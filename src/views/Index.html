  <!-- Dynamic Theme CSS Variables & Custom Styles -->
  <style id="app-dynamic-theme">
    :root {
      --primary-color: #00a66c;
      --primary-hover: #008f5d;
      --primary-dark: #065f46;
      --primary-light: #e8f8f2;
      --primary-surface: #f0fdf4;

    /* Custom CSS Utility Classes using dynamic CSS variables */

    /* Print Optimization for Report Card (Format A4) & Leger */
    @media print {
      @page {
        size: A4 portrait;
        margin: 6mm 8mm 6mm 8mm;
      }
      
      html, body {
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
        background: #ffffff !important;
        color: #000000 !important;
        font-size: 9.5pt;
      }

      /* Allow parent containers to flow without clipping pages */
      .flex-1, main, body, html {
        overflow: visible !important;
        height: auto !important;
        max-height: none !important;
      }

      .signature-space {
        height: 70px !important;
        min-height: 70px !important;
        display: block !important;
      }

      body > * {
        overflow: visible !important;
      }

      .view-panel {
        overflow: visible !important;
        transition: none !important;
      }

      /* Hide non-printable UI components & inactive sheets */
      nav, aside, header, footer, #sidebar-nav, #sidebar-backdrop, #toast-container,
      .no-print, [class*="no-print"],
      .hidden, [hidden] {
        display: none !important;
      }

      .print-only {
        display: block !important;
      }

      main {
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
      }

      .max-w-7xl, .max-w-4xl {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      .print-container {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
        border-radius: 0 !important;
        background: #ffffff !important;
      }

      .print-container.hidden {
        display: none !important;
      }

      .identity-box {
        background: #f8fafc !important;
        border: 1px solid #cbd5e1 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      /* Page breaks */
      .page-break-inside-avoid {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }
      
      .page-break-before {
        break-before: page !important;
        page-break-before: always !important;
      }

      table {
        border-collapse: collapse !important;
        width: 100% !important;
        page-break-inside: auto;
      }

      tr {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }

      th, td {
        border: 1px solid #000000 !important;
        padding: 2.5px 4px !important;
      }

      th {
        background-color: #f1f5f9 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      /* Ensure borderless identity table stays clean without table borders */
      .identity-table,
      .identity-table tr,
      .identity-table td,
      .identity-table th,
      table.no-border,
      table.no-border tr,
      table.no-border td,
      table.no-border th,
      .border-none {
        border: none !important;
        background: transparent !important;
        padding: 1px 2px !important;
      }

      /* Compact SKL Kepemimpinan 28-row print style (Fits perfectly on 1 page) */
      #print-sheet-kepemimpinan table th,
      #print-sheet-kepemimpinan table td {
        padding: 1.5px 2.5px !important;
        font-size: 7pt !important;
        line-height: 1.15 !important;
      }

      #print-sheet-kepemimpinan .identity-table td {
        padding: 0.5px 2px !important;
        font-size: 7.5pt !important;
      }

      /* Leger landscape adjustments when printing leger */
      body.printing-leger-landscape {
        font-size: 7.5pt !important;
      }
      body.printing-leger-landscape table th,
      body.printing-leger-landscape table td {
        padding: 2px 4px !important;
        font-size: 7pt !important;
      }
    }
