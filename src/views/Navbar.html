<!-- Top Navigation Bar -->
<header class="no-print bg-white/95 backdrop-blur-md border border-[#e2f3ea] rounded-2xl mx-3 sm:mx-6 mt-3 shadow-sm sticky top-2 z-30">
  <div class="max-w-7xl mx-auto px-4 sm:px-6">
    <div class="flex justify-between h-16 items-center">
      
      <!-- Left: Mobile Menu Toggle & Brand Info -->
      <div class="flex items-center space-x-3">
        <button id="btn-toggle-sidebar" onclick="toggleSidebar()" class="lg:hidden p-2 rounded-xl text-slate-600 hover:bg-emerald-50 hover:text-emerald-700 focus:outline-none transition cursor-pointer" title="Menu Sidebar">
          <i class="fa-solid fa-bars text-lg"></i>
        </button>
        
        <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('dashboard')">
          <img id="nav-school-logo" src="https://alimamischool.com/wp-content/uploads/2020/08/Al-Imam-Islamic-School-alimamischool.com-sekolah-sunnah-logo.png" 
               alt="Logo Sekolah" class="h-9 w-auto object-contain drop-shadow-sm rounded" />
          <div class="hidden sm:block">
            <h1 id="nav-school-name" class="text-sm sm:text-base font-extrabold text-slate-900 leading-tight">SMP AL IMAM ISLAMIC SCHOOL (AI IS)</h1>
            <p class="text-[11px] font-semibold text-slate-400 flex items-center gap-1.5">
              <span class="inline-block w-2 h-2 rounded-full bg-[#00a66c] animate-pulse"></span>
              Development by Al-Imam EduTech
            </p>
          </div>
        </div>
      </div>

      <!-- Center / Right: Academic Badge & User Quick Controls -->
      <div class="flex items-center space-x-2 sm:space-x-3">
        
        <!-- Active Period Pill (Clickable to switch / add academic year - Khusus Guru / Admin) -->
        <button id="nav-btn-academic-year" onclick="openAcademicYearModal()" title="Klik untuk mengganti atau menambah Tahun Ajaran Baru"
                class="menu-non-wali hidden md:flex items-center gap-1.5 bg-emerald-50/80 hover:bg-emerald-100 border border-emerald-200/80 hover:border-emerald-300 px-3 py-1.5 rounded-full text-xs font-medium text-slate-700 hover:text-emerald-900 transition shadow-sm group">
          <i class="fa-regular fa-calendar-check text-[#00a66c] group-hover:scale-110 transition-transform"></i>
          <span>T.A. <strong id="nav-academic-year" class="text-emerald-900 font-bold">2026/2027</strong></span>
          <span class="text-emerald-200">|</span>
          <span class="text-emerald-700 font-bold" id="nav-semester">Tengah Semester 1</span>
          <i class="fa-solid fa-chevron-down text-[9px] text-emerald-400 group-hover:text-emerald-600 ml-0.5"></i>
        </button>

        <!-- Petunjuk & Panduan Membaca Rapor Button (Resmi di Header) -->
        <button id="nav-btn-petunjuk-rapor" onclick="openModalPetunjukRapor('baca_rapor')" class="inline-flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200/90 rounded-xl text-xs font-bold transition-all shadow-sm cursor-pointer" title="Petunjuk Penggunaan & Cara Membaca Lembar Rapor">
          <i class="fa-solid fa-book-open-reader text-amber-600"></i>
          <span class="hidden sm:inline">Petunjuk Rapor</span>
        </button>

        <!-- Interactive Guide Button (Khusus Guru / Non-Wali) -->
        <button id="nav-btn-tutorial" onclick="openInteractiveGuide(1)" class="menu-non-wali inline-flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-[#00a66c] border border-emerald-200 rounded-xl text-xs font-bold transition-all shadow-sm cursor-pointer">
          <i class="fa-solid fa-lightbulb text-amber-500"></i>
          <span class="hidden sm:inline">Tutorial</span>
        </button>

        <!-- Quick Cetak Rapor Button (Khusus Guru / Admin di Header) -->
        <button id="nav-btn-quick-print" onclick="openQuickPrintModal()" class="menu-non-wali inline-flex items-center gap-2 px-3.5 py-1.5 bg-[#00a66c] hover:bg-[#008f5d] text-white rounded-xl text-xs font-bold shadow-sm shadow-[#00a66c]/20 transition-all">
          <i class="fa-solid fa-print"></i>
          <span class="hidden sm:inline">Cetak Rapor</span>
        </button>

        <!-- Active User Profile & Secure Logout (Strictly Private Account, No Switcher) -->
        <div class="flex items-center space-x-2.5">
          <!-- Active Role / Class / Mapel Badge (Locked, Non-interactive, Khusus Guru / Walas / Admin) -->
          <div id="nav-role-badge-container" class="menu-non-wali flex items-center gap-1.5 px-3 py-1.5 bg-emerald-50 border border-emerald-200/80 rounded-xl text-xs font-bold text-emerald-900 shadow-sm select-none">
            <i id="nav-role-badge-icon" class="fa-solid fa-lock text-emerald-600 text-xs"></i>
            <span id="nav-user-role-badge">Wali Kelas</span>
          </div>

          <!-- User Identity (Private, No Switcher) -->
          <div class="flex items-center space-x-2 pl-2 border-l border-slate-200">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-600 to-teal-500 text-white flex items-center justify-center font-bold text-xs shadow-inner select-none" 
                 id="nav-user-avatar">
              A
            </div>
            <div class="hidden lg:block text-left select-none">
              <div id="nav-user-name" class="text-xs font-bold text-slate-800 leading-tight max-w-[160px] truncate">Administrator Utama</div>
              <div id="nav-user-subtitle" class="text-[10px] text-slate-500 font-medium max-w-[160px] truncate">Sistem Administrator</div>
            </div>
            
            <!-- Direct Logout Button -->
            <button onclick="logoutUser()" class="flex items-center gap-1.5 px-2.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 hover:text-rose-800 border border-rose-200/80 rounded-xl text-xs font-bold transition shadow-sm cursor-pointer ml-1" title="Keluar dari Akun">
              <i class="fa-solid fa-power-off text-rose-600 text-xs"></i>
              <span class="hidden sm:inline">Keluar</span>
            </button>
          </div>
        </div>

      </div>

    </div>
  </div>
</header>
