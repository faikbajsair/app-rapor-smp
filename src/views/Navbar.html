<!-- Top Navigation Bar -->
<header class="no-print bg-white/95 backdrop-blur-md border border-[#e2f3ea] rounded-2xl mx-3 sm:mx-6 mt-3 shadow-sm sticky top-2 z-30">
  <div class="max-w-7xl mx-auto px-4 sm:px-6">
    <div class="flex justify-between h-16 items-center">
      
      <!-- Left: Mobile Menu Toggle & Brand Info -->
      <div class="flex items-center space-x-3">
        <button id="btn-toggle-sidebar" onclick="toggleSidebar()" class="lg:hidden p-2 rounded-xl text-slate-600 hover:bg-emerald-50 hover:text-emerald-700 focus:outline-none transition cursor-pointer" title="Menu Sidebar">
          <i class="fa-solid fa-bars text-lg"></i>
        </button>
        
        <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('dashboard')">
          <img id="nav-school-logo" src="https://alimamischool.com/wp-content/uploads/2020/08/Al-Imam-Islamic-School-alimamischool.com-sekolah-sunnah-logo.png" 
               alt="Logo Sekolah" class="h-9 w-auto object-contain drop-shadow-sm rounded" />
          <div class="hidden sm:block">
            <h1 id="nav-school-name" class="text-sm sm:text-base font-extrabold text-slate-900 leading-tight">SMP AL IMAM ISLAMIC SCHOOL (AI IS)</h1>
            <p class="text-[11px] font-semibold text-slate-400 flex items-center gap-1.5">
              <span class="inline-block w-2 h-2 rounded-full bg-[#00a66c] animate-pulse"></span>
              Development by Al-Imam EduTech
            </p>
          </div>
        </div>
      </div>

      <!-- Center / Right: Academic Badge & User Quick Controls -->
      <div class="flex items-center space-x-2 sm:space-x-3">
        
        <!-- Active Period Pill (Clickable to switch / add academic year) -->
        <button onclick="openAcademicYearModal()" title="Klik untuk mengganti atau menambah Tahun Ajaran Baru"
                class="hidden md:flex items-center gap-1.5 bg-emerald-50/80 hover:bg-emerald-100 border border-emerald-200/80 hover:border-emerald-300 px-3 py-1.5 rounded-full text-xs font-medium text-slate-700 hover:text-emerald-900 transition shadow-sm group">
          <i class="fa-regular fa-calendar-check text-[#00a66c] group-hover:scale-110 transition-transform"></i>
          <span>T.A. <strong id="nav-academic-year" class="text-emerald-900 font-bold">2026/2027</strong></span>
          <span class="text-emerald-200">|</span>
          <span class="text-emerald-700 font-bold" id="nav-semester">Tengah Semester 1</span>
          <i class="fa-solid fa-chevron-down text-[9px] text-emerald-400 group-hover:text-emerald-600 ml-0.5"></i>
        </button>

        <!-- Interactive Guide Button -->
        <button onclick="openInteractiveGuide(1)" class="inline-flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-[#00a66c] border border-emerald-200 rounded-xl text-xs font-bold transition-all shadow-sm">
          <i class="fa-solid fa-lightbulb text-amber-500"></i>
          <span class="hidden sm:inline">Panduan</span>
        </button>

        <!-- Quick Cetak Rapor Button -->
        <button onclick="openQuickPrintModal()" class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-[#00a66c] hover:bg-[#008f5d] text-white rounded-xl text-xs font-bold shadow-sm shadow-[#00a66c]/20 transition-all">
          <i class="fa-solid fa-print"></i>
          <span class="hidden sm:inline">Cetak Rapor</span>
        </button>

        <!-- Multi-Role Switcher & Teacher Account Selector -->
        <div class="relative">
          <button id="btn-role-switcher" onclick="toggleRoleDropdown()" class="flex items-center gap-2 px-3 py-1.5 bg-slate-50 hover:bg-emerald-50/50 border border-slate-200 hover:border-emerald-300 rounded-xl text-xs font-semibold text-slate-700 transition shadow-sm">
            <i class="fa-solid fa-user-shield text-[#00a66c]"></i>
            <span id="nav-user-role-badge" class="font-bold text-slate-800">Admin</span>
            <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
          </button>
          
          <div id="dropdown-role-switcher" class="hidden absolute right-0 mt-2 w-72 bg-white rounded-2xl shadow-2xl border border-slate-100 py-2 z-50 text-xs overflow-hidden">
            <div class="px-4 py-2 bg-slate-50 border-b border-slate-100">
              <span class="text-slate-400 uppercase font-bold text-[10px] tracking-wider block">Akun Aktif Saat Ini:</span>
              <div class="font-bold text-slate-800 text-xs truncate" id="dropdown-active-user-name">Administrator Utama</div>
              <div class="text-[11px] text-emerald-700 font-semibold truncate" id="dropdown-active-user-mapel">Semua Mapel</div>
            </div>
            
            <div class="px-3.5 py-1.5 text-slate-400 uppercase font-bold text-[9px] tracking-wider">
              Akses Cepat Pengguna:
            </div>
            
            <!-- 1. Admin Arif Rohman -->
            <button onclick="loginAsSpecificTeacher('arifrohman', 'arif123')" class="w-full text-left px-3.5 py-2 hover:bg-purple-50 flex items-center justify-between text-slate-700 transition">
              <div class="flex items-center gap-2 overflow-hidden">
                <span class="w-2.5 h-2.5 rounded-full bg-purple-600 flex-shrink-0"></span>
                <div class="truncate">
                  <strong class="text-slate-900 block leading-tight text-[11px] truncate">Gr. Arif Rohman, S.Sos., M.Pd.</strong>
                  <span class="text-[10px] text-slate-400">Admin / Guru Fikih IX</span>
                </div>
              </div>
              <span class="text-[9px] bg-purple-100 text-purple-800 font-bold px-1.5 py-0.2 rounded flex-shrink-0">Admin</span>
            </button>

            <!-- 2. Admin Dewi Fitria -->
            <button onclick="loginAsSpecificTeacher('dewi', 'dewi123')" class="w-full text-left px-3.5 py-2 hover:bg-purple-50 flex items-center justify-between text-slate-700 transition">
              <div class="flex items-center gap-2 overflow-hidden">
                <span class="w-2.5 h-2.5 rounded-full bg-purple-600 flex-shrink-0"></span>
                <div class="truncate">
                  <strong class="text-slate-900 block leading-tight text-[11px] truncate">Dewi Fitria Nugraheni, S.Pd.</strong>
                  <span class="text-[10px] text-slate-400">Admin / Guru B. Indonesia</span>
                </div>
              </div>
              <span class="text-[9px] bg-purple-100 text-purple-800 font-bold px-1.5 py-0.2 rounded flex-shrink-0">Admin</span>
            </button>

            <!-- 3. Zam-zam Nasrullah (Akhlak & Hadits) -->
            <button onclick="loginAsSpecificTeacher('zamzam', 'zamzam123')" class="w-full text-left px-3.5 py-2 hover:bg-teal-50 flex items-center justify-between text-slate-700 transition">
              <div class="flex items-center gap-2 overflow-hidden">
                <span class="w-2.5 h-2.5 rounded-full bg-teal-600 flex-shrink-0"></span>
                <div class="truncate">
                  <strong class="text-slate-900 block leading-tight text-[11px] truncate">Zam-zam Nasrullah, S.Pd.</strong>
                  <span class="text-[10px] text-slate-400">Guru Akhlak & Hadits</span>
                </div>
              </div>
              <span class="text-[9px] bg-teal-100 text-teal-800 font-bold px-1.5 py-0.2 rounded flex-shrink-0">Guru</span>
            </button>

            <div class="my-1 border-t border-slate-100"></div>

            <!-- Open Full Teacher Picker / Login Modal -->
            <button onclick="openLoginModal()" class="w-full text-left px-3.5 py-2 hover:bg-emerald-50 flex items-center gap-2 text-emerald-700 font-bold text-xs transition">
              <i class="fa-solid fa-users text-xs"></i>
              <span>Daftar 12 Akun Guru Lengkap...</span>
            </button>

            <!-- Logout Button -->
            <button onclick="logoutUser()" class="w-full text-left px-3.5 py-2 hover:bg-rose-50 flex items-center gap-2 text-rose-600 font-bold text-xs transition border-t border-slate-100">
              <i class="fa-solid fa-right-from-bracket text-xs"></i>
              <span>Keluar (Logout)</span>
            </button>
          </div>
        </div>

        <!-- User Profile & Logout Button -->
        <div class="flex items-center space-x-2 pl-2 border-l border-slate-200">
          <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-600 to-teal-500 text-white flex items-center justify-center font-bold text-xs shadow-inner cursor-pointer" 
               id="nav-user-avatar" onclick="openLoginModal()" title="Klik untuk ganti akun">
            A
          </div>
          <div class="hidden lg:block text-left cursor-pointer" onclick="openLoginModal()">
            <div id="nav-user-name" class="text-xs font-bold text-slate-800 leading-tight max-w-[140px] truncate">Administrator Utama</div>
            <div id="nav-user-subtitle" class="text-[10px] text-slate-400 font-medium max-w-[140px] truncate">Sistem Administrator</div>
          </div>
          
          <!-- Direct Logout Quick Button -->
          <button onclick="logoutUser()" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition cursor-pointer" title="Keluar dari Akun">
            <i class="fa-solid fa-power-off text-sm"></i>
          </button>
        </div>

      </div>

    </div>
  </div>
</header>
