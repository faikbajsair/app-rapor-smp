<!-- Top Navigation Bar -->
<header class="no-print bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16 items-center">
      
      <!-- Left: Mobile Menu Toggle & Brand Info -->
      <div class="flex items-center space-x-3">
        <button id="btn-toggle-sidebar" class="lg:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100 focus:outline-none">
          <i class="fa-solid fa-bars text-lg"></i>
        </button>
        
        <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('dashboard')">
          <img id="nav-school-logo" src="https://alimamischool.com/wp-content/uploads/2020/08/Al-Imam-Islamic-School-alimamischool.com-sekolah-sunnah-logo.png" 
               alt="Logo Sekolah" class="h-10 w-auto object-contain drop-shadow-sm rounded" />
          <div class="hidden sm:block">
            <h1 id="nav-school-name" class="text-base font-bold text-slate-900 leading-tight">SMP Al-Imam Islamic School (AI IS)</h1>
            <p class="text-xs font-semibold text-slate-500 flex items-center gap-1.5">
              <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              Development by Al-Imam EduTech
            </p>
          </div>
        </div>
      </div>

      <!-- Center / Right: Academic Badge & User Quick Controls -->
      <div class="flex items-center space-x-2 sm:space-x-3">
        
        <!-- Active Period Pill -->
        <div class="hidden md:flex items-center bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-full text-xs font-medium text-slate-700">
          <i class="fa-regular fa-calendar-check text-theme-primary mr-1.5"></i>
          <span>T.A. <strong id="nav-academic-year">2025/2026</strong></span>
          <span class="mx-1.5 text-slate-300">|</span>
          <span class="text-emerald-700 font-semibold" id="nav-semester">Ganjil</span>
        </div>

        <!-- Interactive Guide Button -->
        <button onclick="openInteractiveGuide(1)" class="inline-flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 rounded-lg text-xs font-bold transition-all shadow-sm">
          <i class="fa-solid fa-lightbulb text-amber-500"></i>
          <span class="hidden sm:inline">Panduan</span>
        </button>

        <!-- Quick Cetak Rapor Button -->
        <button onclick="openQuickPrintModal()" class="inline-flex items-center gap-2 px-3 py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-semibold shadow transition-all">
          <i class="fa-solid fa-print"></i>
          <span class="hidden sm:inline">Cetak Rapor</span>
        </button>

        <!-- Multi-Role Switcher & Login Portal Button -->
        <div class="relative">
          <button id="btn-role-switcher" onclick="toggleRoleDropdown()" class="flex items-center gap-2 px-3 py-1.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg text-xs font-medium text-slate-700">
            <i class="fa-solid fa-user-shield text-theme-secondary"></i>
            <span id="nav-user-role-badge" class="font-bold text-slate-800">Admin</span>
            <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
          </button>
          
          <div id="dropdown-role-switcher" class="hidden absolute right-0 mt-2 w-60 bg-white rounded-2xl shadow-2xl border border-slate-100 py-2 z-50 text-xs">
            <div class="px-3.5 py-1.5 text-slate-400 uppercase font-bold text-[10px] tracking-wider border-b border-slate-100">
              Ganti Role Akses Pengguna:
            </div>
            
            <!-- 1. Admin -->
            <button onclick="setSimulatedRole('admin')" class="w-full text-left px-3.5 py-2.5 hover:bg-purple-50 flex items-center justify-between text-slate-700 transition">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-purple-600"></span>
                <div>
                  <strong class="text-slate-900 block leading-tight">Admin Utama</strong>
                  <span class="text-[10px] text-slate-400">Akses Penuh & CMS</span>
                </div>
              </div>
              <span class="text-[9px] bg-purple-100 text-purple-800 font-bold px-1.5 py-0.5 rounded">All</span>
            </button>

            <!-- 2. Kepala Sekolah -->
            <button onclick="setSimulatedRole('kepala_sekolah')" class="w-full text-left px-3.5 py-2.5 hover:bg-indigo-50 flex items-center justify-between text-slate-700 transition">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-indigo-600"></span>
                <div>
                  <strong class="text-slate-900 block leading-tight">Kepala Sekolah</strong>
                  <span class="text-[10px] text-slate-400">Monitoring & Leger Rapor</span>
                </div>
              </div>
              <span class="text-[9px] bg-indigo-100 text-indigo-800 font-bold px-1.5 py-0.5 rounded">Kepsek</span>
            </button>

            <!-- 3. Guru -->
            <button onclick="setSimulatedRole('guru')" class="w-full text-left px-3.5 py-2.5 hover:bg-blue-50 flex items-center justify-between text-slate-700 transition">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
                <div>
                  <strong class="text-slate-900 block leading-tight">Guru / Pendidik</strong>
                  <span class="text-[10px] text-slate-400">Input Nilai 3 Dashboard</span>
                </div>
              </div>
              <span class="text-[9px] bg-blue-100 text-blue-800 font-bold px-1.5 py-0.5 rounded">Guru</span>
            </button>

            <!-- 4. Wali Murid -->
            <button onclick="setSimulatedRole('wali_murid')" class="w-full text-left px-3.5 py-2.5 hover:bg-emerald-50 flex items-center justify-between text-slate-700 transition">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span>
                <div>
                  <strong class="text-slate-900 block leading-tight">Wali Murid</strong>
                  <span class="text-[10px] text-slate-400">Lihat & Cetak E-Rapor Anak</span>
                </div>
              </div>
              <span class="text-[9px] bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.5 rounded">Wali</span>
            </button>

            <div class="my-1 border-t border-slate-100"></div>

            <!-- Login Modal Trigger -->
            <button onclick="openLoginModal()" class="w-full text-left px-3.5 py-2 hover:bg-slate-100 flex items-center gap-2 text-theme-primary font-bold">
              <i class="fa-solid fa-right-to-bracket text-xs"></i>
              <span>Login / Masuk Akun Lain...</span>
            </button>
          </div>
        </div>

        <!-- User Profile -->
        <div class="flex items-center space-x-2 pl-2 border-l border-slate-200">
          <div class="w-8 h-8 rounded-full bg-theme-primary text-white flex items-center justify-center font-bold text-xs shadow-inner" id="nav-user-avatar">
            A
          </div>
          <div class="hidden lg:block text-left">
            <div id="nav-user-name" class="text-xs font-bold text-slate-800 leading-tight">Admin Utama</div>
            <div id="nav-user-subtitle" class="text-[10px] text-slate-400">Sistem Administrator</div>
          </div>
        </div>

      </div>

    </div>
  </div>
</header>
