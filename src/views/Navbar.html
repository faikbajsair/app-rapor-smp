<!-- Top Navigation Bar -->
<header class="no-print bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16 items-center">
      
      <!-- Left: Mobile Menu Toggle & Brand Info -->
      <div class="flex items-center space-x-3">
        <button id="btn-toggle-sidebar" class="lg:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100 focus:outline-none">
          <i class="fa-solid fa-bars text-lg"></i>
        </button>
        
        <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('dashboard')">
          <img id="nav-school-logo" src="https://alimamischool.com/wp-content/uploads/2020/08/Al-Imam-Islamic-School-alimamischool.com-sekolah-sunnah-logo.png" 
               alt="Logo Sekolah" class="h-10 w-auto object-contain drop-shadow-sm rounded" />
          <div class="hidden sm:block">
            <h1 id="nav-school-name" class="text-base font-bold text-slate-900 leading-tight">SMP IT Al-Imam Islamic School MBU</h1>
            <p class="text-xs font-semibold text-slate-500 flex items-center gap-1.5">
              <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              Sistem Rapor Tengah Semester (MVC Engine)
            </p>
          </div>
        </div>
      </div>

      <!-- Center / Right: Academic Badge & User Quick Controls -->
      <div class="flex items-center space-x-3 sm:space-x-4">
        
        <!-- Active Period Pill -->
        <div class="hidden md:flex items-center bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-full text-xs font-medium text-slate-700">
          <i class="fa-regular fa-calendar-check text-theme-primary mr-1.5"></i>
          <span>T.A. <strong id="nav-academic-year">2025/2026</strong></span>
          <span class="mx-1.5 text-slate-300">|</span>
          <span class="text-emerald-700 font-semibold" id="nav-semester">Ganjil</span>
        </div>

        <!-- Quick Cetak Rapor Button -->
        <button onclick="openQuickPrintModal()" class="inline-flex items-center gap-2 px-3 py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-semibold shadow transition-all">
          <i class="fa-solid fa-print"></i>
          <span class="hidden sm:inline">Cetak Rapor</span>
        </button>

        <!-- User Role Switcher Dropdown (for testing & role demonstration) -->
        <div class="relative">
          <button id="btn-role-switcher" onclick="toggleRoleDropdown()" class="flex items-center gap-2 px-3 py-1.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg text-xs font-medium text-slate-700">
            <i class="fa-solid fa-user-shield text-theme-secondary"></i>
            <span id="nav-user-role-badge" class="font-bold text-slate-800">Admin</span>
            <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
          </button>
          
          <div id="dropdown-role-switcher" class="hidden absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-slate-100 py-2 z-50 text-xs">
            <div class="px-3 py-1.5 text-slate-400 uppercase font-semibold text-[10px] tracking-wider border-b border-slate-100">
              Ganti Role Simulasi:
            </div>
            <button onclick="setSimulatedRole('admin')" class="w-full text-left px-3 py-2 hover:bg-slate-50 flex items-center gap-2 text-slate-700">
              <span class="w-2 h-2 rounded-full bg-purple-500"></span>
              <strong>Admin / CMS</strong> (Akses Penuh)
            </button>
            <button onclick="setSimulatedRole('guru_akademik')" class="w-full text-left px-3 py-2 hover:bg-slate-50 flex items-center gap-2 text-slate-700">
              <span class="w-2 h-2 rounded-full bg-blue-500"></span>
              <strong>Guru Akademik</strong> (Mapel Umum)
            </button>
            <button onclick="setSimulatedRole('pembina_kepemimpinan')" class="w-full text-left px-3 py-2 hover:bg-slate-50 flex items-center gap-2 text-slate-700">
              <span class="w-2 h-2 rounded-full bg-amber-500"></span>
              <strong>Pembina Kepemimpinan</strong> (Karakter)
            </button>
            <button onclick="setSimulatedRole('pembina_diniyah')" class="w-full text-left px-3 py-2 hover:bg-slate-50 flex items-center gap-2 text-slate-700">
              <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
              <strong>Pembina Diniyah</strong> (Tahfidz/Adab)
            </button>
            <button onclick="setSimulatedRole('santri')" class="w-full text-left px-3 py-2 hover:bg-slate-50 flex items-center gap-2 text-slate-700">
              <span class="w-2 h-2 rounded-full bg-slate-400"></span>
              <strong>Santri / Orang Tua</strong> (Lihat Rapor)
            </button>
          </div>
        </div>

        <!-- User Profile & Sign Out -->
        <div class="flex items-center space-x-2 pl-2 border-l border-slate-200">
          <div class="w-8 h-8 rounded-full bg-theme-primary text-white flex items-center justify-center font-bold text-xs shadow-inner" id="nav-user-avatar">
            A
          </div>
          <div class="hidden lg:block text-left">
            <div id="nav-user-name" class="text-xs font-bold text-slate-800 leading-tight">Admin Utama</div>
            <div id="nav-user-subtitle" class="text-[10px] text-slate-400">Sistem Administrator</div>
          </div>
        </div>

      </div>

    </div>
  </div>
</header>
