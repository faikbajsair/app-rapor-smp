<!-- Main Application Sidebar (Matching Emerald & Light Mint Theme) -->
<aside id="app-sidebar" class="no-print fixed inset-y-0 left-0 z-20 w-64 lg:w-72 bg-white text-slate-700 border border-emerald-100/80 shadow-md rounded-3xl m-3 lg:m-4 transform -translate-x-full lg:translate-x-0 lg:static lg:inset-auto transition-transform duration-200 ease-in-out flex flex-col justify-between overflow-hidden">
  
  <!-- Sidebar Header / School Brand -->
  <div class="p-4 sm:p-5 flex items-center justify-between border-b border-emerald-50">
    <div class="flex items-center gap-3 overflow-hidden cursor-pointer" onclick="switchView('dashboard')">
      <div class="w-10 h-10 rounded-2xl bg-emerald-50/80 border border-emerald-200/60 flex items-center justify-center p-1.5 shadow-sm shrink-0">
        <img id="sidebar-school-logo" src="https://alimamischool.com/wp-content/uploads/2020/08/Al-Imam-Islamic-School-alimamischool.com-sekolah-sunnah-logo.png" 
             alt="Logo" class="max-h-full max-w-full object-contain" />
      </div>
      <div class="overflow-hidden">
        <h2 class="text-xs font-extrabold text-slate-900 leading-tight uppercase truncate" id="sidebar-school-name">SMP Al-Imam Islamic School</h2>
        <p class="text-[10px] font-bold text-emerald-700 mt-0.5">TP 2026/2027</p>
      </div>
    </div>
    <button id="btn-close-sidebar" class="lg:hidden p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100">
      <i class="fa-solid fa-xmark text-lg"></i>
    </button>
  </div>

  <div class="p-3.5 flex-1 overflow-y-auto space-y-4">
    <!-- Navigation Menu Items -->
    <nav class="space-y-1" id="sidebar-nav-list">
      
      <!-- 1. Beranda / Ringkasan -->
      <div class="px-3 py-1 text-[10px] font-bold text-slate-400 uppercase tracking-wider">Menu Utama</div>
      <a href="javascript:void(0)" onclick="switchView('dashboard')" id="nav-item-dashboard" 
         class="sidebar-nav-link flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-bold text-white bg-emerald-600 shadow-md shadow-emerald-600/20 transition-all">
        <i class="fa-solid fa-table-cells-large w-4 text-center text-sm"></i>
        <span>Dashboard</span>
      </a>

      <!-- 2. Tiga Kategori Penilaian Utama (Akademik, Ahlaq & Kepribadian, Diniyah) -->
      <div class="pt-3 px-3 py-1 text-[10px] font-bold text-slate-400 uppercase tracking-wider menu-assessment-header">Kategori Penilaian</div>
      
      <!-- Akademik -->
      <a href="javascript:void(0)" onclick="switchView('akademik')" id="nav-item-akademik" 
         class="sidebar-nav-link menu-assessment-item flex items-center justify-between px-3.5 py-2.5 rounded-2xl text-xs font-semibold text-slate-700 hover:text-emerald-800 hover:bg-emerald-50/70 transition-all">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-book-open w-4 text-center text-blue-600 text-sm"></i>
          <span>Nilai Akademik</span>
        </div>
        <span class="text-[10px] bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full font-bold" id="badge-count-akademik">0</span>
      </a>

      <!-- Ahlaq & Kepribadian -->
      <a href="javascript:void(0)" onclick="switchView('kepemimpinan')" id="nav-item-kepemimpinan" 
         class="sidebar-nav-link menu-assessment-item flex items-center justify-between px-3.5 py-2.5 rounded-2xl text-xs font-semibold text-slate-700 hover:text-emerald-800 hover:bg-emerald-50/70 transition-all">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-heart-pulse w-4 text-center text-amber-500 text-sm"></i>
          <span>Ahlaq & Karakter</span>
        </div>
        <span class="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold" id="badge-count-kepemimpinan">0</span>
      </a>

      <!-- Diniyah -->
      <a href="javascript:void(0)" onclick="switchView('diniyah')" id="nav-item-diniyah" 
         class="sidebar-nav-link menu-assessment-item flex items-center justify-between px-3.5 py-2.5 rounded-2xl text-xs font-semibold text-slate-700 hover:text-emerald-800 hover:bg-emerald-50/70 transition-all">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-quran w-4 text-center text-emerald-600 text-sm"></i>
          <span>Diniyah & Tahfidz</span>
        </div>
        <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold" id="badge-count-diniyah">0</span>
      </a>

      <!-- 3. Rapor & Data Master -->
      <div class="pt-3 px-3 py-1 text-[10px] font-bold text-slate-400 uppercase tracking-wider">Output & Master</div>
      
      <!-- Buku Leger Nilai Lengkap (Baru) -->
      <a href="javascript:void(0)" onclick="switchView('leger')" id="nav-item-leger" 
         class="sidebar-nav-link flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-semibold text-slate-700 hover:text-emerald-800 hover:bg-emerald-50/70 transition-all">
        <i class="fa-solid fa-list-check w-4 text-center text-teal-600 text-sm"></i>
        <span>Buku Leger (16 Mapel)</span>
      </a>

      <!-- Cetak Rapor -->
      <a href="javascript:void(0)" onclick="switchView('rapor')" id="nav-item-rapor" 
         class="sidebar-nav-link flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-semibold text-slate-700 hover:text-emerald-800 hover:bg-emerald-50/70 transition-all">
        <i class="fa-solid fa-file-invoice w-4 text-center text-indigo-600 text-sm"></i>
        <span>Cetak Rapor Portofolio</span>
      </a>

      <!-- Data Murid -->
      <a href="javascript:void(0)" onclick="switchView('murid')" id="nav-item-murid" 
         class="sidebar-nav-link menu-murid-management flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-semibold text-slate-700 hover:text-emerald-800 hover:bg-emerald-50/70 transition-all">
        <i class="fa-solid fa-user-graduate w-4 text-center text-purple-600 text-sm"></i>
        <span>Data Siswa & Kelas</span>
      </a>

      <!-- 4. Konfigurasi CMS (SaaS Ready) -->
      <div class="pt-3 px-3 py-1 text-[10px] font-bold text-slate-400 uppercase tracking-wider menu-admin-only">Sistem & CMS</div>
      <a href="javascript:void(0)" onclick="switchView('cms')" id="nav-item-cms" 
         class="sidebar-nav-link menu-admin-only flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-semibold text-slate-700 hover:text-emerald-800 hover:bg-emerald-50/70 transition-all">
        <i class="fa-solid fa-sliders w-4 text-center text-rose-500 text-sm"></i>
        <span>Pengaturan CMS</span>
      </a>

    </nav>
  </div>

  <!-- Sidebar Footer: Role Indicator & Action Controls -->
  <div class="p-4 bg-emerald-50/50 rounded-b-3xl border-t border-emerald-100/60 text-[11px] space-y-2">
    <div class="flex items-center justify-between">
      <span class="text-slate-500 font-medium">Status Role:</span>
      <span class="inline-flex items-center gap-1.5 text-emerald-800 font-bold" id="sidebar-role-indicator">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
        Admin
      </span>
    </div>
    <div class="grid grid-cols-2 gap-1.5">
      <button onclick="openLoginModal()" class="py-1.5 px-2 bg-white hover:bg-emerald-50 text-slate-700 rounded-xl text-center text-[10px] font-bold flex items-center justify-center gap-1 border border-emerald-200/70 shadow-sm transition">
        <i class="fa-solid fa-key text-[9px] text-emerald-600"></i>
        <span>Ganti Akun</span>
      </button>
      <button onclick="triggerInitDb()" class="py-1.5 px-2 bg-white hover:bg-emerald-50 text-slate-700 rounded-xl text-center text-[10px] font-bold flex items-center justify-center gap-1 border border-emerald-200/70 shadow-sm transition">
        <i class="fa-solid fa-arrows-rotate text-[9px] text-emerald-600"></i>
        <span>Reset DB</span>
      </button>
    </div>
  </div>

</aside>
