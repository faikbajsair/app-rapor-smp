<!-- Main Application Sidebar -->
<aside id="app-sidebar" class="no-print fixed inset-y-0 left-0 z-20 w-64 bg-white text-slate-700 m-3 sm:m-4 rounded-3xl border border-[#e2f3ea] shadow-sm transform -translate-x-full lg:translate-x-0 lg:static lg:inset-auto transition-transform duration-200 ease-in-out flex flex-col justify-between">

          <i class="fa-solid fa-heart-pulse w-4 text-center text-sm"></i>

      <span class="inline-flex items-center gap-1.5 text-[#00a66c] font-bold" id="sidebar-role-indicator">
