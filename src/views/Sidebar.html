<!-- Main Application Sidebar -->
<aside id="app-sidebar" class="no-print fixed inset-y-0 left-0 z-20 w-64 bg-slate-900 text-slate-300 transform -translate-x-full lg:translate-x-0 lg:static lg:inset-auto transition-transform duration-200 ease-in-out flex flex-col justify-between shadow-xl">

      <button id="btn-close-sidebar" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <!-- Navigation Menu Items -->
    <nav class="space-y-1.5" id="sidebar-nav-list">
      
      <!-- 1. Beranda / Ringkasan -->

      <a href="javascript:void(0)" onclick="switchView('dashboard')" id="nav-item-dashboard" 
         class="sidebar-nav-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-medium text-white bg-slate-800 transition-colors">
        <i class="fa-solid fa-chart-pie w-4 text-center text-theme-secondary text-sm"></i>
        <span>Dashboard Ringkasan</span>
      </a>

      <!-- 2. Tiga Kategori Penilaian Utama (Akademik, Kepemimpinan, Diniyah) -->
      <div class="pt-4 px-3 py-1 text-[11px] font-semibold text-slate-400 uppercase tracking-wider menu-assessment-header">Kategori Penilaian</div>
      
      <!-- Akademik -->
      <a href="javascript:void(0)" onclick="switchView('akademik')" id="nav-item-akademik" 
         class="sidebar-nav-link menu-assessment-item flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition-colors">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-book-open w-4 text-center text-blue-400 text-sm"></i>
          <span>Nilai Akademik</span>
        </div>
        <span class="text-[10px] bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded-full font-semibold" id="badge-count-akademik">0</span>
      </a>

      <!-- Kepemimpinan -->
      <a href="javascript:void(0)" onclick="switchView('kepemimpinan')" id="nav-item-kepemimpinan"

        <div class="flex items-center gap-3">
          <i class="fa-solid fa-award w-4 text-center text-amber-400 text-sm"></i>
          <span>Nilai Kepemimpinan</span>
        </div>
        <span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full font-semibold" id="badge-count-kepemimpinan">0</span>

      <!-- Diniyah -->
      <a href="javascript:void(0)" onclick="switchView('diniyah')" id="nav-item-diniyah" 
         class="sidebar-nav-link menu-assessment-item flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition-colors">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-quran w-4 text-center text-emerald-400 text-sm"></i>
          <span>Nilai Diniyah & Tahfidz</span>
        </div>
        <span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-semibold" id="badge-count-diniyah">0</span>
      </a>

      <!-- 3. Rapor & Data Master -->
      <div class="pt-4 px-3 py-1 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Output & Master</div>
      
      <!-- Cetak Rapor -->
      <a href="javascript:void(0)" onclick="switchView('rapor')" id="nav-item-rapor"

        <i class="fa-solid fa-file-invoice w-4 text-center text-indigo-400 text-sm"></i>
        <span>Cetak Rapor Terpadu</span>
      </a>

      <!-- Data Murid -->
      <a href="javascript:void(0)" onclick="switchView('murid')" id="nav-item-murid"

      </a>

      <a href="javascript:void(0)" onclick="switchView('cms')" id="nav-item-cms"

  <!-- Sidebar Footer: Sheet Connection & Account Switch -->
  <div class="p-4 bg-slate-950 border-t border-slate-800 text-[11px] space-y-2">
    <div class="flex items-center justify-between">
      <span class="text-slate-400">Status Role:</span>
      <span class="inline-flex items-center gap-1.5 text-blue-400 font-bold" id="sidebar-role-indicator">
        <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span>
        Admin
      </span>
    </div>
    <div class="grid grid-cols-2 gap-1.5">
      <button onclick="openLoginModal()" class="py-1.5 px-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-center text-[10px] font-semibold flex items-center justify-center gap-1 border border-slate-700 transition">
        <i class="fa-solid fa-key text-[9px]"></i>
        <span>Ganti Akun</span>
      </button>
      <button onclick="triggerInitDb()" class="py-1.5 px-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-center text-[10px] font-semibold flex items-center justify-center gap-1 border border-slate-700 transition">
        <i class="fa-solid fa-arrows-rotate text-[9px]"></i>
        <span>Reset DB</span>
      </button>
    </div>
  </div>

</aside>
