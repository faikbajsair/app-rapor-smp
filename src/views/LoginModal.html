<!-- Modal Login & Multi-Role Access Portal (Admin, Kepala Sekolah, Guru, Wali Murid) -->
<div id="modal-login" class="fixed inset-0 bg-slate-950/70 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl max-w-lg w-full shadow-2xl border border-slate-200 overflow-hidden transform transition-all duration-300">
    
    <!-- Modal Header with Gradient & School Identity -->
    <div class="px-6 py-5 bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 text-white relative overflow-hidden">
      <div class="absolute -right-8 -bottom-8 text-white/5 transform rotate-12 pointer-events-none">
        <i class="fa-solid fa-school-flag text-9xl"></i>
      </div>
      
      <div class="relative z-10 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-white/10 backdrop-blur-md flex items-center justify-center border border-white/20 shadow-inner">
            <i class="fa-solid fa-shield-halved text-amber-300 text-lg"></i>
          </div>
          <div>
            <h3 class="font-extrabold text-base tracking-tight text-white">Portal Akses Multi-Role</h3>
            <p class="text-[11px] text-blue-200 font-medium">SMP Al-Imam Islamic School (AI IS)</p>
          </div>
        </div>
        
        <button onclick="closeLoginModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
    </div>

    <!-- Quick Role Selector Chips (1-Click Login for Demo & Teachers) -->
    <div class="p-6 bg-slate-50 border-b border-slate-100">
      <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-2.5">Pilih Akses Cepat (1-Click Role Login):</span>
      <div class="grid grid-cols-2 gap-2.5">
        
        <!-- 1. Admin -->
        <button type="button" onclick="quickLoginRole('admin')" class="p-3 bg-white hover:bg-purple-50 hover:border-purple-300 border border-slate-200 rounded-2xl text-left transition shadow-sm group">
          <div class="flex items-center gap-2 mb-1">
            <span class="w-2.5 h-2.5 rounded-full bg-purple-600 group-hover:scale-110 transition-transform"></span>
            <span class="text-xs font-extrabold text-slate-900">Admin</span>
          </div>
          <p class="text-[10px] text-slate-500 line-clamp-1">Akses Penuh Master & CMS</p>
          <span class="text-[9px] font-mono text-purple-700 bg-purple-100 px-1.5 py-0.5 rounded font-bold mt-1 inline-block">admin / admin123</span>
        </button>

        <!-- 2. Kepala Sekolah -->
        <button type="button" onclick="quickLoginRole('kepala_sekolah')" class="p-3 bg-white hover:bg-indigo-50 hover:border-indigo-300 border border-slate-200 rounded-2xl text-left transition shadow-sm group">
          <div class="flex items-center gap-2 mb-1">
            <span class="w-2.5 h-2.5 rounded-full bg-indigo-600 group-hover:scale-110 transition-transform"></span>
            <span class="text-xs font-extrabold text-slate-900">Kepala Sekolah</span>
          </div>
          <p class="text-[10px] text-slate-500 line-clamp-1">Pemantauan & Leger Rapor</p>
          <span class="text-[9px] font-mono text-indigo-700 bg-indigo-100 px-1.5 py-0.5 rounded font-bold mt-1 inline-block">kepsek / kepsek123</span>
        </button>

        <!-- 3. Guru -->
        <button type="button" onclick="quickLoginRole('guru')" class="p-3 bg-white hover:bg-blue-50 hover:border-blue-300 border border-slate-200 rounded-2xl text-left transition shadow-sm group">
          <div class="flex items-center gap-2 mb-1">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-600 group-hover:scale-110 transition-transform"></span>
            <span class="text-xs font-extrabold text-slate-900">Guru</span>
          </div>
          <p class="text-[10px] text-slate-500 line-clamp-1">Input Nilai 3 Dashboard</p>
          <span class="text-[9px] font-mono text-blue-700 bg-blue-100 px-1.5 py-0.5 rounded font-bold mt-1 inline-block">guru / guru123</span>
        </button>

        <!-- 4. Wali Murid -->
        <button type="button" onclick="quickLoginRole('wali_murid')" class="p-3 bg-white hover:bg-emerald-50 hover:border-emerald-300 border border-slate-200 rounded-2xl text-left transition shadow-sm group">
          <div class="flex items-center gap-2 mb-1">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-600 group-hover:scale-110 transition-transform"></span>
            <span class="text-xs font-extrabold text-slate-900">Wali Murid</span>
          </div>
          <p class="text-[10px] text-slate-500 line-clamp-1">Portal Nilai & Cetak E-Rapor</p>
          <span class="text-[9px] font-mono text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded font-bold mt-1 inline-block">walimurid / wali123</span>
        </button>

      </div>
    </div>

    <!-- Manual Form Login -->
    <form id="form-login-manual" onsubmit="handleManualLogin(event)" class="p-6 space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Username / NIS Murid</label>
        <div class="relative">
          <input type="text" id="login-username" required placeholder="Contoh: admin / guru / 202507001" 
                 class="w-full text-xs bg-slate-50 border border-slate-300 rounded-xl pl-9 pr-3 py-2.5 text-slate-900 font-medium focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none" />
          <i class="fa-solid fa-user absolute left-3 top-3 text-slate-400 text-xs"></i>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Kata Sandi (Password)</label>
        <div class="relative">
          <input type="password" id="login-password" required placeholder="Masukkan kata sandi..." 
                 class="w-full text-xs bg-slate-50 border border-slate-300 rounded-xl pl-9 pr-3 py-2.5 text-slate-900 font-medium focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none" />
          <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-400 text-xs"></i>
        </div>
      </div>

      <div class="pt-2 flex items-center justify-between gap-3">
        <button type="button" onclick="closeLoginModal()" class="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 text-xs font-bold transition">
          Batal
        </button>
        <button type="submit" id="btn-login-submit" class="flex-1 px-5 py-2.5 bg-theme-primary hover:opacity-90 text-white rounded-xl text-xs font-extrabold shadow-md transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Masuk ke Sistem</span>
        </button>
      </div>
    </form>

  </div>
</div>
