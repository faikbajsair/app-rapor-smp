<!-- Modal Login & Authentication Guard Portal (SMP Al-Imam Islamic School) -->
<div id="modal-login" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
  <div class="bg-white rounded-3xl max-w-md w-full shadow-2xl border border-slate-200 overflow-hidden transform transition-all duration-300 my-auto">
    
    <!-- Modal Header with School Branding -->
    <div class="px-6 py-5 bg-gradient-to-r from-emerald-900 via-teal-900 to-slate-900 text-white relative overflow-hidden">
      <div class="absolute -right-6 -bottom-6 text-white/5 transform rotate-12 pointer-events-none">
        <i class="fa-solid fa-graduation-cap text-8xl"></i>
      </div>
      
      <div class="relative z-10 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl bg-white/10 backdrop-blur-md flex items-center justify-center border border-white/20 shadow-inner flex-shrink-0">
            <img src="https://alimamischool.com/wp-content/uploads/2020/08/Al-Imam-Islamic-School-alimamischool.com-sekolah-sunnah-logo.png" 
                 alt="Logo AI IS" class="h-8 w-auto object-contain drop-shadow" />
          </div>
          <div>
            <div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-emerald-500/30 text-emerald-200 text-[10px] font-bold border border-emerald-400/30 mb-0.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
              PORTAL RESMI SMP AL-IMAM
            </div>
            <h3 class="font-extrabold text-base tracking-tight text-white leading-tight">e-Rapor & Portofolio Siswa</h3>
            <p class="text-[11px] text-emerald-200/90 font-medium">SMP Al-Imam Islamic School &bull; TP 2026/2027</p>
          </div>
        </div>
        
        <!-- Close button (Only visible when user is already authenticated and switching accounts) -->
        <button id="btn-close-login-modal" onclick="closeLoginModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition hidden" title="Tutup">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
    </div>

    <!-- Portal Type Switcher Tabs (Guru/Staf vs Wali Murid) -->
    <div class="px-6 pt-4 pb-1">
      <div class="grid grid-cols-2 p-1 bg-slate-100 rounded-2xl border border-slate-200/80">
        <button type="button" id="tab-login-staff" onclick="switchLoginPortalTab('staff')" 
                class="py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 bg-white text-emerald-800 shadow-sm">
          <i class="fa-solid fa-chalkboard-user text-xs"></i>
          <span>Guru & Staf</span>
        </button>
        <button type="button" id="tab-login-wali" onclick="switchLoginPortalTab('wali')" 
                class="py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 text-slate-500 hover:text-slate-800">
          <i class="fa-solid fa-user-group text-xs text-amber-500"></i>
          <span>Wali Murid</span>
        </button>
      </div>
    </div>

    <!-- Clean Form Login -->
    <div class="p-6 pt-3 space-y-4">
      
      <!-- Informative Notice Banner -->
      <div id="login-info-box" class="bg-emerald-50 border border-emerald-200/80 rounded-2xl p-3 text-[11px] text-emerald-900 flex items-start gap-2.5 transition-all">
        <i id="login-info-icon" class="fa-solid fa-shield-halved text-emerald-600 text-base mt-0.5 flex-shrink-0"></i>
        <div>
          <strong id="login-info-title" class="font-bold block">Autentikasi Dewan Guru & Pendidik</strong>
          <span id="login-info-desc">Silakan masukkan <strong>Username</strong> dan <strong>Kata Sandi</strong> akun guru / wali kelas Anda untuk melanjutkan.</span>
        </div>
      </div>

      <form id="form-login-manual" onsubmit="handleManualLogin(event)" class="space-y-3.5">
        <div>
          <label id="login-label-username" class="block text-xs font-bold text-slate-700 mb-1.5">
            Username / Akun Pendidik <span class="text-rose-500">*</span>
          </label>
          <div class="relative">
            <input type="text" id="login-username" required placeholder="Contoh: arifrohman / dewi / zamzam" 
                   class="w-full text-xs bg-slate-50 border border-slate-300 rounded-xl pl-9 pr-3 py-2.5 text-slate-900 font-semibold focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition" />
            <i id="login-input-user-icon" class="fa-solid fa-user absolute left-3 top-3 text-slate-400 text-xs"></i>
          </div>
          <p id="login-help-username" class="text-[10px] text-slate-400 mt-1 hidden"></p>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">
            Kata Sandi (Password) <span class="text-rose-500">*</span>
          </label>
          <div class="relative">
            <input type="password" id="login-password" required placeholder="Masukkan kata sandi..." 
                   class="w-full text-xs bg-slate-50 border border-slate-300 rounded-xl pl-9 pr-10 py-2.5 text-slate-900 font-semibold focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition" />
            <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-400 text-xs"></i>
            <button type="button" onclick="togglePasswordVisibility('login-password', 'eye-login-pwd')" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 focus:outline-none" title="Lihat Password">
              <i id="eye-login-pwd" class="fa-regular fa-eye text-xs"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between text-[11px] text-slate-500 pt-0.5">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" id="login-remember" class="rounded text-emerald-600 focus:ring-emerald-500 w-3.5 h-3.5" checked />
            <span>Ingat sesi di perangkat ini</span>
          </label>
          <span id="login-portal-badge" class="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-200">
            Pendidik
          </span>
        </div>

        <div class="pt-1">
          <button type="submit" id="btn-login-submit" class="w-full py-3 bg-[#00a66c] hover:bg-[#008f5d] text-white rounded-xl text-xs font-black shadow-lg shadow-[#00a66c]/25 transition flex items-center justify-center gap-2 cursor-pointer">
            <i class="fa-solid fa-right-to-bracket text-sm"></i>
            <span id="btn-login-text">Masuk ke Sistem e-Rapor</span>
          </button>
        </div>
      </form>

      <div class="pt-2 text-center text-[10px] text-slate-400 border-t border-slate-100">
        SMP Al-Imam Islamic School &copy; 2026/2027 &bull; Al-Imam EduTech
      </div>

    </div>

  </div>
</div>
