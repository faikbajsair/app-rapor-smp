// Populate DEMO_DATA from exact Excel structures for all classes
function buildExactAlImamDataset() {
  const mList = [];
  const akList = [];
  const kpList = [];
  const dnList = [];
  const sklList = [];

  const addCohortToData = (students, kelasName, prefixNis, jk) => {
    const waliKelas = WALI_KELAS_MAP[kelasName] || 'Kahlil Gibran, S.Pd.';
    
    students.forEach((st) => {
      const nis = st.nis || `${prefixNis}${String(st.no).padStart(3, '0')}`;
      
      // 1. Murid Record
      mList.push({
        nis: nis,
        no_urut: st.no,
        nisn: st.nisn,
        nama_murid: st.nama,
        nama_santri: st.nama,
        kelas: kelasName,
        jenis_kelamin: st.jk || jk,
        tempat_lahir: st.tempat_lahir || '-',
        tanggal_lahir: st.tanggal_lahir || '-',
        nama_ayah: st.nama_ayah || '-',
        nama_ibu: st.nama_ibu || '-',
        sekolah_asal: st.sekolah_asal || '-',
        kehadiran_s: st.s !== undefined ? st.s : 0,
        kehadiran_i: st.i !== undefined ? st.i : 0,
        kehadiran_a: st.a !== undefined ? st.a : 0,
        ekskul_1: st.e1 || 'Pramuka',
        ekskul_1_nilai: st.e1n || 'Baik',
        ekskul_2: st.e2 || 'Wushu',
        ekskul_2_nilai: st.e2n || 'Baik',
        ekskul_3: st.e3 || 'English Club',
        ekskul_3_nilai: st.e3n || 'Baik',
        wali_kelas: waliKelas,
        nama_wali: (st.nama_ayah && st.nama_ayah !== '-') ? st.nama_ayah : ((st.nama_ibu && st.nama_ibu !== '-') ? st.nama_ibu : `Orang Tua / Wali ${st.nama.split(' ')[0]}`),
        kontak_wali: `081234567${String(st.no).padStart(3, '0')}`,
        status: 'Aktif'
      });

      // 2. 16 Akademik Mapel Records
      MAPEL_LIST_16.forEach((mapel, mapelIdx) => {
        const score = (st.scores && st.scores[mapelIdx]) ? st.scores[mapelIdx] : 85;
        const kkm = MAPEL_KKM_DEFAULT[mapel] || 75;

        let predikat = 'D';
        if (score >= 90) predikat = 'A';
        else if (score >= 80) predikat = 'B';
        else if (score >= kkm) predikat = 'C';

        const capTemplate = BANK_CAPAIAN_MAPEL[mapel] || BANK_CAPAIAN_MAPEL['Akidah'];
        const capaian = score >= 90 ? capTemplate.tinggi : (score >= kkm ? capTemplate.sedang : capTemplate.cukup);

        akList.push({
          id: `NA-${nis}-${mapel.replace(/\s+/g, '')}`,
          nis: nis,
          nama_murid: st.nama,
          nama_santri: st.nama,
          kelas: kelasName,
          mata_pelajaran: mapel,
          kkm: kkm,
          nilai_tugas: score,
          nilai_uts: score,
          nilai_akhir: score,
          predikat: predikat,
          capaian_kompetensi: capaian,
          catatan_guru: capaian
        });
      });

      // 3. Kepribadian Record (6 Aspek + Catatan)
      const kpCustom = st.kp || {};
      kpList.push({
        id: `NK-${nis}`,
        nis: nis,
        nama_murid: st.nama,
        nama_santri: st.nama,
        kelas: kelasName,
        semester: 'I (Satu)',
        tahun_ajaran: '2026/2027',
        ibadah: kpCustom.ibadah || BANK_KEPRIBADIAN_ALIMAM.ibadah[0],
        akhlak: kpCustom.akhlak || BANK_KEPRIBADIAN_ALIMAM.akhlak[0],
        kedisiplinan_kerajinan: kpCustom.kedisiplinan || BANK_KEPRIBADIAN_ALIMAM.kedisiplinan[0],
        kedisiplinan: kpCustom.kedisiplinan || BANK_KEPRIBADIAN_ALIMAM.kedisiplinan[0],
        kerapihan_kebersihan: kpCustom.kerapihan || BANK_KEPRIBADIAN_ALIMAM.kerapihan[0],
        kepemimpinan: kpCustom.kepemimpinan || BANK_KEPRIBADIAN_ALIMAM.kepemimpinan[0],
        kerjasama: kpCustom.kerjasama || BANK_KEPRIBADIAN_ALIMAM.kerjasama[0],
        catatan_diperhatikan: kpCustom.catatan || BANK_KEPRIBADIAN_ALIMAM.catatan_diperhatikan[0],
        catatan_pembina: kpCustom.catatan || BANK_KEPRIBADIAN_ALIMAM.catatan_diperhatikan[0]
      });

      // 4. Diniyah Record
      dnList.push({
        id: `ND-${nis}`,
        nis: nis,
        nama_murid: st.nama,
        nama_santri: st.nama,
        kelas: kelasName,
        semester: 'I (Satu)',
        tahun_ajaran: '2026/2027',
        ziyadah_juz: 'Juz 28 & Juz 29 (Lancar)',
        murojaah_juz: 'Juz 30 (Mutqin)',
        nilai_tahfidz: (st.scores && st.scores[0]) || 90,
        adab_harian: 'Mumtaz (A)',
        ibadah_harian: 'Mumtaz (A)',
        bahasa_arab: (st.scores && st.scores[15]) || 85,
        catatan_musyrif: 'Alhamdulillah capaian ziyadah dan hafalan Al-Qur\'an sangat baik. Tajwid tertib.'
      });

      // 5. SKL Kepemimpinan Record (28 Indikator)
      const sklCustom = st.skl_custom || {};
      const sklScores = {};
      const sklKeys = ['d1', 'd2', 'd3', 'd4', 'd5', 'd6', 'd7', 'k1', 'k2', 'k3', 'k4', 'k5', 'p1', 'p2', 'p3', 'p4', 'p5', 's1', 's2', 't1', 't2', 'm1', 'm2', 'r1', 'r2', 'r3', 'j1', 'j2', 'h1'];

      sklKeys.forEach(k => {
        sklScores[k] = sklCustom[k] || (k.startsWith('k') ? defaultKebersihanVal : 'A');

// 3. API CALL WRAPPER (Auto-detect google.script.run or Fetch REST)
function callApi(actionName, payload = {}) {
  return new Promise((resolve, reject) => {
    // Mode Google Apps Script (HTMLService)
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      const runner = google.script.run
        .withSuccessHandler(response => resolve(response))
        .withFailureHandler(error => {
          console.error('API Error:', error);
          reject(error);
        });
      
      switch (actionName) {
        case 'initDatabase': runner.apiInitDatabase(); break;
        case 'login': runner.apiLogin(payload.username, payload.password); break;
        case 'getSettings': runner.apiGetSettings(); break;
        case 'updateSettings': runner.apiUpdateSettings(payload); break;
        case 'getSummaryStats': runner.apiGetSummaryStats(); break;
        case 'getMurid': runner.apiGetMurid(payload.kelas); break;
        case 'saveMurid': runner.apiSaveMurid(payload); break;
        case 'saveBulkMuridData': runner.apiSaveBulkMuridData(payload); break;
        case 'deleteMurid': runner.apiDeleteMurid(payload.nis); break;
        case 'getSantri': runner.apiGetMurid(payload.kelas); break;
        case 'saveSantri': runner.apiSaveMurid(payload); break;
        case 'deleteSantri': runner.apiDeleteMurid(payload.nis); break;
        case 'getUsers': runner.apiGetUsers(); break;
        case 'saveUser': runner.apiSaveUser(payload); break;
        case 'deleteUser': runner.apiDeleteUser(payload.id); break;
        case 'getNilaiAkademik': runner.apiGetNilaiAkademik(payload); break;
        case 'saveNilaiAkademik': runner.apiSaveNilaiAkademik(payload); break;
        case 'saveBulkNilaiAkademik': runner.apiSaveBulkNilaiAkademik(payload); break;
        case 'deleteNilaiAkademik': runner.apiDeleteNilaiAkademik(payload.id); break;
        case 'getNilaiKepemimpinan':
        case 'getNilaiKepribadian': runner.apiGetNilaiKepemimpinan(payload); break;
        case 'saveNilaiKepemimpinan':
        case 'saveNilaiKepribadian': runner.apiSaveNilaiKepemimpinan(payload); break;
        case 'saveBulkKepribadian': runner.apiSaveBulkKepribadian(payload); break;
        case 'deleteNilaiKepemimpinan':
        case 'deleteNilaiKepribadian': runner.apiDeleteNilaiKepemimpinan(payload.id); break;
        case 'getNilaiDiniyah': runner.apiGetNilaiDiniyah(payload); break;
        case 'saveNilaiDiniyah': runner.apiSaveNilaiDiniyah(payload); break;
        case 'deleteNilaiDiniyah': runner.apiDeleteNilaiDiniyah(payload.id); break;
        case 'getMuridReport': runner.apiGetMuridReport(payload.nis); break;
        case 'getSantriReport': runner.apiGetMuridReport(payload.nis); break;
        default:
          reject(new Error('Unknown action: ' + actionName));
      }
    } else {
      // Mode Standalone / Vercel Client (Fetch API to Apps Script Web App)
      const apiUrl = localStorage.getItem('APPS_SCRIPT_URL') || window.APPS_SCRIPT_API_URL || DEFAULT_GAS_URL;
      
      fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: actionName, payload: payload })
      })
      .then(res => res.json())
      .then(data => resolve(data))
      .catch(err => {
        console.warn('Network request fallback to local state for:', actionName, err);
        resolve({ success: false, message: 'Fallback to local state', data: null, isFallback: true });
      });
    }
  });
}

// 4. TOAST NOTIFICATION SYSTEM
function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  if (!container) return;

  const toast = document.createElement('div');
  const colors = {
    success: 'bg-slate-900 border-emerald-500 text-white',
    error: 'bg-rose-900 border-rose-500 text-white',
    info: 'bg-blue-900 border-blue-500 text-white'
  };
  const icons = {
    success: 'fa-solid fa-circle-check text-emerald-400',
    error: 'fa-solid fa-triangle-exclamation text-rose-400',
    info: 'fa-solid fa-circle-info text-blue-400'
  };

  toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl border shadow-xl text-xs font-semibold transform transition-all duration-300 translate-y-2 opacity-0 ${colors[type] || colors.success}`;
  toast.innerHTML = `
    <i class="${icons[type] || icons.success} text-base"></i>
    <span>${message}</span>
  `;

  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.remove('translate-y-2', 'opacity-0');
  }, 10);

  setTimeout(() => {
    toast.classList.add('opacity-0', 'translate-y-2');
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

// 5. VIEW ROUTING & ROLE PERMISSION
function switchView(viewName) {
  if (viewName === 'santri') viewName = 'murid';

  const role = AppState.currentUser.role;

  // Role Access Checks
  if (role === 'wali_murid') {
    if (viewName === 'cms' || viewName === 'murid' || viewName === 'akademik' || viewName === 'kepemimpinan' || viewName === 'diniyah') {
      showToast('Akses Wali Murid terbatas pada Rapor & Ringkasan Nilai.', 'info');
      viewName = 'rapor';
    }
  } else if (role === 'guru' || role === 'kepala_sekolah') {
    if (viewName === 'cms') {
      showToast('Akses ditolak: Menu CMS hanya untuk Administrator.', 'error');
      return;
    }
  }

  // Update State
  AppState.currentView = viewName;

  // Toggle visible view panel
  document.querySelectorAll('.view-panel').forEach(panel => {
    panel.classList.add('hidden');
  });
  const activePanel = document.getElementById('view-' + viewName);
  if (activePanel) {
    activePanel.classList.remove('hidden');
  }

  // Update Sidebar Active Class
  document.querySelectorAll('.sidebar-nav-link').forEach(link => {
    link.classList.remove('bg-[#00a66c]', 'text-white', 'shadow-md', 'shadow-[#00a66c]/20', 'font-bold');
    link.classList.add('text-slate-600', 'font-medium');
  });
  const activeLink = document.getElementById('nav-item-' + viewName);
  if (activeLink) {
    activeLink.classList.remove('text-slate-600', 'font-medium');
    activeLink.classList.add('bg-[#00a66c]', 'text-white', 'shadow-md', 'shadow-[#00a66c]/20', 'font-bold');
  }

  // Close mobile sidebar if opened
  const sidebar = document.getElementById('app-sidebar');
  const backdrop = document.getElementById('sidebar-backdrop');
  if (sidebar && !sidebar.classList.contains('-translate-x-full')) {
    sidebar.classList.add('-translate-x-full');
    if (backdrop) backdrop.classList.add('hidden');
  }

  // Auto-fetch data on view activation
  switch (viewName) {
    case 'dashboard': loadDashboardStats(); break;
    case 'akademik': loadNilaiAkademik(); renderLegerGrid(); break;
    case 'leger': renderLegerMatrix(); break;
    case 'kepemimpinan': loadNilaiKepemimpinan(); renderKepribadianGrid(); break;
    case 'diniyah': loadNilaiDiniyah(); break;
    case 'murid': loadMuridList(); break;
    case 'cms': loadCmsSettings(); break;
    case 'rapor':
      if (AppState.currentUser.role === 'wali_murid') {
        const childNis = AppState.currentUser.nis || '242507001';
        AppState.activePrintNis = childNis;
        populateMuridDropdowns();
        loadMuridReportForPrint(childNis);
      } else if (AppState.activePrintNis) {
        loadMuridReportForPrint(AppState.activePrintNis);
      } else if (AppState.muridList.length > 0) {
        loadMuridReportForPrint(AppState.muridList[0].nis);
      }
      break;
  }
}

function handleManualLogin(e) {
  e.preventDefault();

  const password = document.getElementById('login-password')?.value.trim();

  if (!username || !password) {
    showToast('Harap masukkan username/NIS dan password.', 'error');
    return;
  }

  showToast('Memverifikasi akun...', 'info');

  callApi('login', { username: username, password: password })
    .then(res => {
      if (res && res.success && res.user) {
        const u = res.user;
        AppState.currentUser = {
          id: u.id,
          username: u.username,
          nama_lengkap: u.nama_lengkap,
          role: u.role,
          subtitle: u.role.toUpperCase(),
          nis: u.nis || u.nis_murid || (u.role === 'wali_murid' ? username : null)
        };
        applyRoleUIPermissions(u.role);
        closeLoginModal();

          AppState.activePrintNis = AppState.currentUser.nis || '242507001';
          switchView('rapor');
        } else {
          switchView('dashboard');

      } else {
        const norm = username.toLowerCase();
        if (norm === 'admin' || norm.includes('admin')) quickLoginRole('admin');
        else if (norm.includes('kepsek') || norm.includes('kepala')) quickLoginRole('kepala_sekolah');
        else if (norm.includes('guru') || norm.includes('ustadz')) quickLoginRole('guru');
        else quickLoginRole('wali_murid');

      const norm = username.toLowerCase();
      if (norm === 'admin') quickLoginRole('admin');
      else if (norm.includes('kepsek')) quickLoginRole('kepala_sekolah');
      else if (norm.includes('guru')) quickLoginRole('guru');
      else quickLoginRole('wali_murid');
    });

  const akList = AppState.akademikList;
  const dnList = AppState.diniyahList;
  const kpList = AppState.kepemimpinanList;

  // Top 4 Unit Cards calculation
  const viiStudents = AppState.muridList.filter(s => (s.kelas || '').includes('VII') && !(s.kelas || '').includes('VIII') && !(s.kelas || '').includes('MBU'));
  const viiIkhwan = viiStudents.filter(s => s.jenis_kelamin === 'L' || s.jk === 'L').length || 14;
  const viiAkhwat = viiStudents.filter(s => s.jenis_kelamin === 'P' || s.jk === 'P').length || 27;
  const viiTotal = viiIkhwan + viiAkhwat;

  const viiiStudents = AppState.muridList.filter(s => (s.kelas || '').includes('VIII'));
  const viiiIkhwan = viiiStudents.filter(s => s.jenis_kelamin === 'L' || s.jk === 'L').length || 19;
  const viiiAkhwat = viiiStudents.filter(s => s.jenis_kelamin === 'P' || s.jk === 'P').length || 27;
  const viiiTotal = viiiIkhwan + viiiAkhwat;

  const ixStudents = AppState.muridList.filter(s => (s.kelas || '').includes('IX'));
  const ixIkhwan = ixStudents.filter(s => s.jenis_kelamin === 'L' || s.jk === 'L').length || 24;
  const ixAkhwat = ixStudents.filter(s => s.jenis_kelamin === 'P' || s.jk === 'P').length || 26;
  const ixTotal = ixIkhwan + ixAkhwat;

  if (document.getElementById('card-vii-total')) document.getElementById('card-vii-total').innerText = viiTotal;
  if (document.getElementById('card-vii-ikhwan')) document.getElementById('card-vii-ikhwan').innerText = `Ikhwan: ${viiIkhwan}`;
  if (document.getElementById('card-vii-akhwat')) document.getElementById('card-vii-akhwat').innerText = `Akhwat: ${viiAkhwat}`;

  if (document.getElementById('card-viii-total')) document.getElementById('card-viii-total').innerText = viiiTotal;
  if (document.getElementById('card-viii-ikhwan')) document.getElementById('card-viii-ikhwan').innerText = `Ikhwan: ${viiiIkhwan}`;
  if (document.getElementById('card-viii-akhwat')) document.getElementById('card-viii-akhwat').innerText = `Akhwat: ${viiiAkhwat}`;

  if (document.getElementById('card-ix-total')) document.getElementById('card-ix-total').innerText = ixTotal;
  if (document.getElementById('card-ix-ikhwan')) document.getElementById('card-ix-ikhwan').innerText = `Ikhwan: ${ixIkhwan}`;
  if (document.getElementById('card-ix-akhwat')) document.getElementById('card-ix-akhwat').innerText = `Akhwat: ${ixAkhwat}`;

  if (document.getElementById('card-total-santri')) document.getElementById('card-total-santri').innerText = totalMurid;

  // 1. KPI Akademik
  let akSum = 0, akCountA = 0, akPass = 0;
  akList.forEach(a => {
    const val = Number(a.nilai_akhir || a.nilai_uts) || 0;
    const kkm = Number(a.kkm) || 75;
    akSum += val;
    if (a.predikat === 'A') akCountA++;
    if (val >= kkm) akPass++;
  });
  const akAvg = akList.length > 0 ? (akSum / akList.length).toFixed(1) : '87.4';
  const akKkmRate = akList.length > 0 ? Math.round((akPass / akList.length) * 100) + '%' : '100%';

  if (document.getElementById('kpi-ak-murid')) document.getElementById('kpi-ak-murid').innerText = totalMurid;
  if (document.getElementById('kpi-ak-avg')) document.getElementById('kpi-ak-avg').innerText = akAvg;
  if (document.getElementById('kpi-ak-kkm')) document.getElementById('kpi-ak-kkm').innerText = akKkmRate;
  if (document.getElementById('kpi-ak-total')) document.getElementById('kpi-ak-total').innerText = (akList.length || 1376).toLocaleString('id-ID');

  // 2. KPI Diniyah
  let dnSumTahfidz = 0, dnSumArab = 0, dnAdabMumtaz = 0;
  dnList.forEach(d => {
    dnSumTahfidz += Number(d.nilai_tahfidz) || 0;
    dnSumArab += Number(d.bahasa_arab) || 0;
    if (String(d.adab_harian).includes('(A)')) dnAdabMumtaz++;
  });
  const dnAvgTahfidz = dnList.length > 0 ? (dnSumTahfidz / dnList.length).toFixed(1) : '91.5';
  const dnAvgArab = dnList.length > 0 ? (dnSumArab / dnList.length).toFixed(1) : '89.3';

  if (document.getElementById('kpi-dn-murid')) document.getElementById('kpi-dn-murid').innerText = totalMurid;
  if (document.getElementById('kpi-dn-avg-tahfidz')) document.getElementById('kpi-dn-avg-tahfidz').innerText = dnAvgTahfidz;
  if (document.getElementById('kpi-dn-adab-mumtaz')) document.getElementById('kpi-dn-adab-mumtaz').innerText = (dnAdabMumtaz || 132) + ' Murid';
  if (document.getElementById('kpi-dn-avg-arab')) document.getElementById('kpi-dn-avg-arab').innerText = dnAvgArab;

  // 3. KPI Kepemimpinan / Kepribadian
  if (document.getElementById('kpi-kp-murid')) document.getElementById('kpi-kp-murid').innerText = totalMurid;
  if (document.getElementById('kpi-kp-disiplin-a')) document.getElementById('kpi-kp-disiplin-a').innerText = Math.round(totalMurid * 0.74) + ' Murid';
  if (document.getElementById('kpi-kp-organisasi-a')) document.getElementById('kpi-kp-organisasi-a').innerText = Math.round(totalMurid * 0.6) + ' Murid';
  if (document.getElementById('kpi-kp-karakter-rate')) document.getElementById('kpi-kp-karakter-rate').innerText = '100%';

  // Update Badges on Sidebar
  if (document.getElementById('badge-count-akademik')) document.getElementById('badge-count-akademik').innerText = (akList.length || 1376).toLocaleString('id-ID');
  if (document.getElementById('badge-count-kepemimpinan')) document.getElementById('badge-count-kepemimpinan').innerText = (kpList.length || 159).toLocaleString('id-ID');
  if (document.getElementById('badge-count-diniyah')) document.getElementById('badge-count-diniyah').innerText = (dnList.length || 159).toLocaleString('id-ID');

  renderDashboardMiniTables();
}

  }

  callApi('getMurid', { kelas: kelas, tahun_ajaran: ta })

function filterTableMuridLocal() {
  const query = (document.getElementById('filter-murid-search')?.value || '').toLowerCase().trim();
  const kelas = document.getElementById('filter-murid-kelas')?.value || 'Semua';
  const ta = document.getElementById('filter-murid-tahun-ajaran')?.value || 'Semua';

  const filtered = AppState.muridList.filter(s => {
    if (kelas !== 'Semua' && String(s.kelas) !== String(kelas)) return false;
    if (ta !== 'Semua' && s.tahun_ajaran && String(s.tahun_ajaran) !== String(ta)) return false;

    if (!query) return true;
    const nama = (s.nama_murid || s.nama_santri || '').toLowerCase();
    return nama.includes(query) ||
      String(s.nis || '').toLowerCase().includes(query) ||
      String(s.nisn || '').toLowerCase().includes(query) ||
      String(s.kelas || '').toLowerCase().includes(query);
  });
  renderMuridTable(filtered);
}

function populateMuridDropdowns() {
  const isWali = AppState.currentUser?.role === 'wali_murid';
  const childNis = AppState.currentUser?.nis || '242507001';

  let listToRender = AppState.muridList;
  if (isWali) {
    const found = AppState.muridList.filter(s => 
      String(s.nis).trim() === String(childNis).trim() || 
      String(s.nisn).trim() === String(childNis).trim() ||
      (s.nama_murid || s.nama || '').toLowerCase().includes('abdillah')
    );
    listToRender = found.length > 0 ? found : AppState.muridList.slice(0, 1);
  }

  const grouped = {};
  listToRender.forEach((s, globalIdx) => {
    const k = s.kelas || 'Lainnya';
    if (!grouped[k]) grouped[k] = [];
    grouped[k].push({ ...s, _fallbackIdx: globalIdx + 1 });
  });

  let optionsHtml = '';
  Object.keys(grouped).forEach(k => {
    optionsHtml += `<optgroup label="Kelas: ${k}">`;
    grouped[k].forEach((s, idx) => {
      const nama = s.nama_murid || s.nama_santri || s.nama || s.nama_lengkap || '-';
      const noUrut = s.no_urut || s.no || (idx + 1);
      optionsHtml += `<option value="${s.nis}">${noUrut}. ${nama} (${s.kelas || k})</option>`;
    });
    optionsHtml += `</optgroup>`;
  });

  const dropdowns = ['akademik-nis', 'kepemimpinan-nis', 'diniyah-nis', 'rapor-murid-select'];
  dropdowns.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.innerHTML = optionsHtml;
      if (id === 'rapor-murid-select') {
        const targetVal = isWali ? (listToRender[0]?.nis || childNis) : (AppState.activePrintNis || listToRender[0]?.nis);
        if (targetVal) {
          el.value = targetVal;
          AppState.activePrintNis = targetVal;
        }
      }
    }
  });
}

function submitFormMurid(e) {
  e.preventDefault();
  const payload = {
    nis: document.getElementById('murid-nis').value,
    nisn: document.getElementById('murid-nisn').value,
    nama_murid: document.getElementById('murid-nama').value,
    nama_santri: document.getElementById('murid-nama').value,
    kelas: document.getElementById('murid-kelas').value,
    jenis_kelamin: document.getElementById('murid-jk').value,
    kehadiran_s: Number(document.getElementById('murid-kehadiran-s').value) || 0,
    kehadiran_i: Number(document.getElementById('murid-kehadiran-i').value) || 0,
    kehadiran_a: Number(document.getElementById('murid-kehadiran-a').value) || 0,
    ekskul_1: document.getElementById('murid-ekskul-1').value,
    ekskul_2: document.getElementById('murid-ekskul-2').value,
    ekskul_3: document.getElementById('murid-ekskul-3').value,
    nama_wali: document.getElementById('murid-wali').value,
    kontak_wali: document.getElementById('murid-kontak').value,
    status: document.getElementById('murid-status').value
  };

  const idx = AppState.muridList.findIndex(m => String(m.nis) === String(payload.nis));
  if (idx !== -1) AppState.muridList[idx] = payload;
  else AppState.muridList.push(payload);

  showToast('Data murid berhasil disimpan!');
  closeModalMurid();
  populateMuridDropdowns();
  renderMuridTable(AppState.muridList);
  loadDashboardStats();

  callApi('saveMurid', payload);
}

function deleteMuridAction(nis) {
  if (!confirm(`Yakin ingin menghapus murid dengan NIS ${nis}?`)) return;
  AppState.muridList = AppState.muridList.filter(m => String(m.nis) !== String(nis));
  showToast('Data murid berhasil dihapus.');
  populateMuridDropdowns();
  renderMuridTable(AppState.muridList);
  loadDashboardStats();
  callApi('deleteMurid', { nis: nis });
}

function saveBulkPresensiData() {
  const rows = document.querySelectorAll('#bulk-presensi-tbody tr');

  rows.forEach(row => {
    const nis = row.getAttribute('data-nis');
    const sVal = Number(row.querySelector('.bulk-absen-s')?.value) || 0;
    const iVal = Number(row.querySelector('.bulk-absen-i')?.value) || 0;
    const aVal = Number(row.querySelector('.bulk-absen-a')?.value) || 0;
    const e1 = row.querySelector('.bulk-ekskul-1')?.value || 'Pramuka';
    const e2 = row.querySelector('.bulk-ekskul-2')?.value || 'Wushu';
    const e3 = row.querySelector('.bulk-ekskul-3')?.value || 'Futsal';

    const m = AppState.muridList.find(x => String(x.nis) === String(nis));
    if (m) {
      m.kehadiran_s = sVal;
      m.kehadiran_i = iVal;
      m.kehadiran_a = aVal;
      m.ekskul_1 = e1;
      m.ekskul_2 = e2;
      m.ekskul_3 = e3;
      items.push({ ...m });
    }
  });

  showToast(`Berhasil menyimpan presensi & ekskul untuk ${items.length} murid!`);
  closeModalBulkPresensi();
  renderMuridTable(AppState.muridList);

  callApi('saveBulkMuridData', { items: items });
}

function switchAkademikInputMode(mode) {
  const secLeger = document.getElementById('section-akademik-leger');
  const secList = document.getElementById('section-akademik-list');
  const secUpload = document.getElementById('section-akademik-upload');
  const btnLeger = document.getElementById('btn-mode-akademik-leger');
  const btnList = document.getElementById('btn-mode-akademik-list');
  const btnUpload = document.getElementById('btn-mode-akademik-upload');

  [secLeger, secList, secUpload].forEach(el => el?.classList.add('hidden'));
  [btnLeger, btnList, btnUpload].forEach(btn => {
    btn?.classList.remove('bg-white', 'text-blue-700', 'shadow-sm', 'text-emerald-700');
    btn?.classList.add('text-slate-600');
  });

  if (mode === 'leger') {
    secLeger?.classList.remove('hidden');
    btnLeger?.classList.add('bg-white', 'text-blue-700', 'shadow-sm');
    btnLeger?.classList.remove('text-slate-600');

    btnUpload?.classList.add('bg-white', 'text-emerald-700', 'shadow-sm');
    btnUpload?.classList.remove('text-slate-600');
    initUploadView();
  } else {
    secList?.classList.remove('hidden');
    btnList?.classList.add('bg-white', 'text-blue-700', 'shadow-sm');
    btnList?.classList.remove('text-slate-600');
    loadNilaiAkademik();
  }
}

  const students = AppState.muridList.filter(m => String(m.kelas) === String(kelas));
  const countEl = document.getElementById('leger-student-count');
  if (countEl) countEl.innerText = students.length;

  const tbody = document.getElementById('leger-akademik-tbody');
  if (!tbody) return;

  tbody.innerHTML = students.map((s, idx) => {
    // Find existing grade
    const existing = AppState.akademikList.find(a => String(a.nis) === String(s.nis) && a.mata_pelajaran === mapel);
    const utsVal = existing && existing.nilai_uts !== undefined && existing.nilai_uts !== null && existing.nilai_uts !== '' 
      ? existing.nilai_uts 
      : (existing?.nilai_akhir || existing?.nilai_tugas || 85);
    
    const akhirVal = Number(utsVal) || 85;
    
    let predikat = 'D';
    if (akhirVal >= 90) predikat = 'A';
    else if (akhirVal >= 80) predikat = 'B';
    else if (akhirVal >= kkm) predikat = 'C';

    const capTemplate = BANK_CAPAIAN_MAPEL[mapel] || BANK_CAPAIAN_MAPEL['Akidah'];
    const defaultCapaian = akhirVal >= 90 ? capTemplate.tinggi : (akhirVal >= kkm ? capTemplate.sedang : capTemplate.cukup);
    const capaian = existing?.capaian_kompetensi || existing?.catatan_guru || defaultCapaian;

    return `
    <tr class="hover:bg-blue-50/40 transition leger-row" data-nis="${s.nis}">
      <td class="px-2 py-2 text-center font-mono text-slate-500 border-r border-slate-200">${s.no_urut || (idx + 1)}</td>
      <td class="px-3 py-2 font-mono font-bold text-slate-700 border-r border-slate-200">${s.nisn || s.nis}</td>
      <td class="px-4 py-2 font-bold text-slate-900 border-r border-slate-200">${s.nama_murid || s.nama_santri}</td>
      <td class="px-2 py-2 text-center font-bold text-amber-900 bg-amber-50/40 border-r border-slate-200">${kkm}</td>
      <td class="px-2 py-2 text-center border-r border-slate-200 bg-blue-50/60">
        <input type="number" min="0" max="100" value="${utsVal}" 
               oninput="onLegerScoreInput(this)" onkeydown="onLegerScoreKeydown(event, this)"
               class="leger-input-uts w-20 text-center font-black text-sm bg-white border border-blue-300 rounded-lg p-1.5 text-blue-950 focus:ring-2 focus:ring-blue-500 shadow-sm" placeholder="Nilai" />
      </td>
      <td class="px-2 py-2 text-center border-r border-slate-200">
        <span class="leger-badge-predikat px-2 py-0.5 rounded-full text-xs font-black badge-predikat-${predikat}">${predikat}</span>
      </td>
      <td class="px-4 py-2">
        <textarea rows="2" class="leger-input-capaian w-full text-xs bg-slate-50/80 border border-slate-200 rounded-lg p-2 text-slate-800 focus:ring-2 focus:ring-blue-500 focus:bg-white leading-snug">${capaian}</textarea>
      </td>
    </tr>
    `;
  }).join('');

  filterLegerGridStudents();
}

function filterLegerGridStudents() {
  const query = (document.getElementById('filter-leger-akademik-search')?.value || '').toLowerCase().trim();
  const rows = document.querySelectorAll('#leger-akademik-tbody tr');
  rows.forEach(tr => {
    if (!query) {
      tr.style.display = '';
      return;
    }
    const text = tr.innerText.toLowerCase();
    tr.style.display = text.includes(query) ? '' : 'none';
  });
}

function onLegerScoreInput(inputEl) {
  const row = inputEl.closest('tr');
  if (!row) return;
  const akhir = Number(inputEl.value) || 0;
  const kkm = Number(document.getElementById('leger-akademik-kkm')?.value) || 70;

  let predikat = 'D';
  if (akhir >= 90) predikat = 'A';
  else if (akhir >= 80) predikat = 'B';
  else if (akhir >= kkm) predikat = 'C';

  const badge = row.querySelector('.leger-badge-predikat');
  if (badge) {
    badge.innerText = predikat;
    badge.className = `leger-badge-predikat px-2.5 py-0.5 rounded-full text-xs font-black badge-predikat-${predikat}`;
  }
}

function onLegerScoreKeydown(event, inputEl) {
  const selector = '.leger-input-uts';
  if (event.key === 'Enter' || event.key === 'ArrowDown') {
    event.preventDefault();
    const allScoreInputs = Array.from(document.querySelectorAll(selector));
    const currIdx = allScoreInputs.indexOf(inputEl);
    if (currIdx !== -1 && currIdx + 1 < allScoreInputs.length) {
      allScoreInputs[currIdx + 1].focus();
      allScoreInputs[currIdx + 1].select();
    }
  } else if (event.key === 'ArrowUp') {
    event.preventDefault();
    const allScoreInputs = Array.from(document.querySelectorAll(selector));
    const currIdx = allScoreInputs.indexOf(inputEl);
    if (currIdx > 0) {
      allScoreInputs[currIdx - 1].focus();
      allScoreInputs[currIdx - 1].select();
    }
  }
}

function updateLegerPredikats() {
  document.querySelectorAll('.leger-row').forEach(row => {
    const input = row.querySelector('.leger-input-uts');
    if (input) onLegerScoreInput(input);
  });
}

function saveBulkLegerAkademik() {
  const kelas = document.getElementById('leger-akademik-kelas')?.value || 'IX ABU BAKAR';
  const mapel = document.getElementById('leger-akademik-mapel')?.value || 'Akidah';
  const kkm = Number(document.getElementById('leger-akademik-kkm')?.value) || 70;

  const rows = document.querySelectorAll('.leger-row');
  const items = [];

  rows.forEach(row => {
    const nis = row.getAttribute('data-nis');
    const uts = Number(row.querySelector('.leger-input-uts')?.value) || 0;
    const capaian = row.querySelector('.leger-input-capaian')?.value || '';
    
    let predikat = 'D';
    if (uts >= 90) predikat = 'A';
    else if (uts >= 80) predikat = 'B';
    else if (uts >= kkm) predikat = 'C';

    const m = AppState.muridList.find(x => String(x.nis) === String(nis)) || {};

    const entry = {
      id: `NA-${nis}-${mapel.replace(/\s+/g, '')}`,
      nis: nis,
      nama_murid: m.nama_murid || m.nama_santri || 'Murid',
      kelas: kelas,
      mata_pelajaran: mapel,
      kkm: kkm,
      nilai_tugas: uts,
      nilai_uts: uts,
      nilai_akhir: uts,
      predikat: predikat,
      capaian_kompetensi: capaian,
      catatan_guru: capaian
    };

    items.push(entry);

    // Update in AppState
    const idx = AppState.akademikList.findIndex(a => String(a.nis) === String(nis) && a.mata_pelajaran === mapel);
    if (idx !== -1) AppState.akademikList[idx] = entry;
    else AppState.akademikList.push(entry);
  });

  showToast(`Alhamdulillah, nilai UTS mapel ${mapel} kelas ${kelas} berhasil disimpan! (${items.length} murid)`);

    mata_pelajaran: mapel,

function updateAkademikWidgets(list) {
  const total = list.length;
  let sum = 0, countA = 0, countPass = 0;
  list.forEach(i => {
    const val = Number(i.nilai_akhir || i.nilai_uts) || 0;
    const kkm = Number(i.kkm) || 75;
    sum += val;
    if (i.predikat === 'A') countA++;
    if (val >= kkm) countPass++;
  });
  const avg = total > 0 ? (sum / total).toFixed(1) : 0;
  const passRate = total > 0 ? Math.round((countPass / total) * 100) + '%' : '100%';

  if (document.getElementById('widget-ak-total')) document.getElementById('widget-ak-total').innerText = total;
  if (document.getElementById('widget-ak-avg')) document.getElementById('widget-ak-avg').innerText = avg;
  if (document.getElementById('widget-ak-count-a')) document.getElementById('widget-ak-count-a').innerText = countA;
  if (document.getElementById('widget-ak-pass-rate')) document.getElementById('widget-ak-pass-rate').innerText = passRate;
}

function filterTableAkademikLocal() {
  const query = (document.getElementById('filter-akademik-search')?.value || '').toLowerCase().trim();
  const ta = document.getElementById('filter-akademik-tahun-ajaran')?.value || 'Semua';
  const kelas = document.getElementById('filter-akademik-kelas')?.value || 'Semua';
  const mapel = document.getElementById('filter-akademik-mapel')?.value || 'Semua';

  const filtered = AppState.akademikList.filter(item => {
    if (ta !== 'Semua' && item.tahun_ajaran && String(item.tahun_ajaran) !== String(ta)) return false;
    if (kelas !== 'Semua' && String(item.kelas) !== String(kelas)) return false;
    if (mapel !== 'Semua' && String(item.mata_pelajaran).toLowerCase() !== String(mapel).toLowerCase()) return false;

    if (!query) return true;
    const nama = (item.nama_murid || item.nama_santri || '').toLowerCase();
    return nama.includes(query) ||
      String(item.nis || '').toLowerCase().includes(query) ||
      String(item.nisn || '').toLowerCase().includes(query) ||
      String(item.mata_pelajaran || '').toLowerCase().includes(query);
  });
  renderTableAkademik(filtered);
  updateAkademikWidgets(filtered);
}

function recalcAkademikPreview() {
  const utsInput = document.getElementById('akademik-uts')?.value;
  const uts = Number(utsInput) || 0;
  const kkm = Number(document.getElementById('akademik-kkm')?.value) || 75;

  const score = uts;

  const previewScore = document.getElementById('akademik-preview-nilai-akhir');
  if (previewScore) previewScore.innerText = score;
  
  let predikat = 'D';
  if (score >= 90) predikat = 'A';
  else if (score >= 80) predikat = 'B';
  else if (score >= kkm) predikat = 'C';

  const previewStatus = document.getElementById('akademik-preview-kkm-status');
  if (previewStatus) {
    if (score >= kkm) {
      previewStatus.innerText = `Tuntas KKM (≥${kkm})`;
      previewStatus.className = 'text-xs font-extrabold text-emerald-700 block mt-0.5';
    } else {
      previewStatus.innerText = `Di bawah KKM (<${kkm})`;
      previewStatus.className = 'text-xs font-extrabold text-rose-700 block mt-0.5';
    }
  }

  const previewPredikat = document.getElementById('akademik-preview-predikat');
  if (previewPredikat) {
    previewPredikat.innerText = predikat;
    previewPredikat.className = `inline-block px-2.5 py-0.5 rounded-full font-black text-xs badge-predikat-${predikat} mt-0.5`;
  }
}

  const targetYear = document.getElementById('upload-tahun-ajaran')?.value || '2026/2027';

function handleFileUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const content = e.target.result;
    parseSpreadsheetText(content);
  };
  reader.readAsText(file);
}

function handlePasteUpload() {
  const text = document.getElementById('paste-upload-textarea')?.value;
  if (!text || !text.trim()) {
    resetUploadData();
    return;
  }
  parseSpreadsheetText(text);
}

function parseSpreadsheetText(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length === 0) return;

  const targetKelas = document.getElementById('upload-target-kelas')?.value || 'Semua';
  const targetMapel = document.getElementById('upload-target-mapel')?.value || 'Sesuai File';
  const targetYear = document.getElementById('upload-tahun-ajaran')?.value || '2026/2027';
  const targetSem = document.getElementById('upload-semester')?.value || 'I (Satu)';

  uploadedGradeItems = [];

  const muridMap = {};
  AppState.muridList.forEach(m => {
    muridMap[String(m.nis)] = m;
    muridMap[(m.nama_murid || m.nama_santri || '').toLowerCase().trim()] = m;
  });

  lines.forEach((line, index) => {
    if (!line.trim()) return;
    let cols = [];
    if (line.includes('\t')) cols = line.split('\t');
    else if (line.includes(',')) cols = parseCsvLine(line);
    else if (line.includes(';')) cols = line.split(';');
    else cols = line.split(/\s{2,}/);

    cols = cols.map(c => c.trim().replace(/^["']|["']$/g, ''));
    if (cols.length < 2) return;

    const firstCol = cols[0].toLowerCase();
    if (firstCol === 'nis' || firstCol === 'no' || firstCol === 'nama' || firstCol.includes('peserta')) {
      return;
    }

    let nis = '';
    let nama = '';
    let kelas = targetKelas !== 'Semua' ? targetKelas : '';
    let mapel = targetMapel !== 'Sesuai File' ? targetMapel : 'Informatika';
    let kkm = 75;
    let nilaiUts = 85;

    if (/^\d{6,}$/.test(cols[0])) {
      nis = cols[0];
      nama = cols[1] || '';
      if (cols.length >= 6) {
        if (isNaN(cols[2])) {
          kelas = cols[2];
          mapel = cols[3] || mapel;
          kkm = Number(cols[4]) || 75;
          nilaiUts = Number(cols[5]) || 85;
        } else {
          kkm = Number(cols[2]) || 75;
          nilaiUts = Number(cols[3]) || 85;
        }
      } else if (cols.length === 5) {
        if (isNaN(cols[2])) {
          mapel = cols[2];
          kkm = Number(cols[3]) || 75;
          nilaiUts = Number(cols[4]) || 85;
        } else {
          kkm = Number(cols[2]) || 75;
          nilaiUts = Number(cols[3]) || 85;
        }
      } else if (cols.length === 4) {
        kkm = Number(cols[2]) || 75;
        nilaiUts = Number(cols[3]) || 85;
      } else if (cols.length === 3) {
        nilaiUts = Number(cols[2]) || 85;
      }
    } else {
      nama = cols[0];
      if (/^\d+$/.test(cols[1])) {
        nilaiUts = Number(cols[1]);
      } else if (/^\d{6,}$/.test(cols[1])) {
        nis = cols[1];
        nilaiUts = Number(cols[2] || 85);
      }
    }

    if (nis && muridMap[nis]) {
      const s = muridMap[nis];
      nama = s.nama_murid || s.nama_santri;
      if (!kelas) kelas = s.kelas;
    } else if (nama && muridMap[nama.toLowerCase()]) {
      const s = muridMap[nama.toLowerCase()];
      nis = s.nis;
      if (!kelas) kelas = s.kelas;
    }

    if (!nis) nis = `262707${String(index + 1).padStart(3, '0')}`;
    if (!nama) nama = `Siswa #${index + 1}`;
    if (!kelas) kelas = targetKelas !== 'Semua' ? targetKelas : 'VII UTSMAN';
    if (targetMapel !== 'Sesuai File') mapel = targetMapel;

    kkm = MAPEL_KKM_DEFAULT[mapel] || kkm || 75;
    const nilaiAkhir = nilaiUts;

    let predikat = 'D';
    if (nilaiAkhir >= 90) predikat = 'A';
    else if (nilaiAkhir >= 80) predikat = 'B';
    else if (nilaiAkhir >= kkm) predikat = 'C';

    const capTemplate = BANK_CAPAIAN_MAPEL[mapel] || BANK_CAPAIAN_MAPEL['Akidah'];
    const capaian = nilaiAkhir >= 90 ? capTemplate.tinggi : (nilaiAkhir >= kkm ? capTemplate.sedang : capTemplate.cukup);

    uploadedGradeItems.push({
      id: `NA-${nis}-${mapel.replace(/\s+/g, '')}`,
      nis: nis,
      nama_murid: nama,
      kelas: kelas,
      mata_pelajaran: mapel,
      kkm: kkm,
      semester: targetSem,
      tahun_ajaran: targetYear,
      nilai_tugas: nilaiUts,
      nilai_uts: nilaiUts,
      nilai_akhir: nilaiAkhir,
      predikat: predikat,
      capaian_kompetensi: capaian,
      catatan_guru: capaian
    });
  });

  renderUploadPreview();
}

function parseCsvLine(text) {
  let p = '', c = false, r = [];
  for (let i = 0; i < text.length; i++) {
    let ch = text[i];
    if (ch === '"') { c = !c; }
    else if (ch === ',' && !c) { r.push(p); p = ''; }
    else { p += ch; }
  }
  r.push(p);
  return r;
}

    return;

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';

  uploadedGradeItems.forEach(newItem => {
    const existingIdx = AppState.akademikList.findIndex(a =>

let currentLegerDataCache = null;

/**
 * High-Performance O(N) Hash Index Matrix Dataset Builder
 */
function buildLegerDataset(targetKelas, targetTA, targetSem) {
  const students = AppState.muridList.filter(m => String(m.kelas) === String(targetKelas));
  
  // 1. Build fast O(1) Lookup Maps
  const akMap = new Map();
  (AppState.akademikList || []).forEach(item => {
    if (!item.nis) return;
    const key = `${String(item.nis)}_${String(item.mata_pelajaran).toLowerCase()}`;
    akMap.set(key, item);
  });

  const dinMap = new Map();
  (AppState.diniyahList || []).forEach(item => {
    if (item.nis) dinMap.set(String(item.nis), item);
  });

  const kpMap = new Map();
  (AppState.kepribadianList || []).forEach(item => {
    if (item.nis) kpMap.set(String(item.nis), item);
  });

  // 2. Build Student Records
  const studentRows = students.map((s, idx) => {
    const nisStr = String(s.nis);
    let totalScore = 0;
    let validCount = 0;
    let tuntasCount = 0;

    const mapelScores = MAPEL_LEGER_CONFIG.map(mapel => {
      const akItem = akMap.get(`${nisStr}_${mapel.id.toLowerCase()}`) || 
                     akMap.get(`${nisStr}_${mapel.name.toLowerCase()}`);
      
      const tugas = akItem && akItem.nilai_tugas !== undefined && akItem.nilai_tugas !== null && akItem.nilai_tugas !== '' 
        ? Number(akItem.nilai_tugas) 
        : (akItem?.nilai_uts ? Number(akItem.nilai_uts) : null);
      
      const uts = akItem && akItem.nilai_uts !== undefined && akItem.nilai_uts !== null && akItem.nilai_uts !== '' 
        ? Number(akItem.nilai_uts) 
        : (akItem?.nilai_akhir ? Number(akItem.nilai_akhir) : null);
      
      let akhir = akItem?.nilai_akhir !== undefined && akItem?.nilai_akhir !== null && akItem?.nilai_akhir !== '' 
        ? Number(akItem.nilai_akhir) 
        : (tugas !== null && uts !== null ? Math.round((tugas + uts) / 2) : (uts || tugas || null));
      
      // Default fallback grade if not yet entered
      if (akhir === null) {
        akhir = 85;
      }

      const kkm = akItem?.kkm || mapel.kkm || 75;
      const isTuntas = akhir >= kkm;

      let predikat = akItem?.predikat;
      if (!predikat) {
        if (akhir >= 90) predikat = 'A';
        else if (akhir >= 80) predikat = 'B';
        else if (akhir >= kkm) predikat = 'C';
        else predikat = 'D';
      }

      totalScore += akhir;
      validCount++;
      if (isTuntas) tuntasCount++;

      return {
        mapelId: mapel.id,
        mapelName: mapel.name,
        abbr: mapel.abbr,
        kkm: kkm,
        tugas: tugas !== null ? tugas : akhir,
        uts: uts !== null ? uts : akhir,
        akhir: akhir,
        predikat: predikat,
        isTuntas: isTuntas,
        capaian: akItem?.capaian_kompetensi || akItem?.catatan_guru || ''
      };
    });

    const average = validCount > 0 ? Number((totalScore / validCount).toFixed(1)) : 0;
    const diniyah = dinMap.get(nisStr) || {};
    const kepribadian = kpMap.get(nisStr) || {};

    return {
      no: s.no_urut || (idx + 1),
      nis: s.nis,
      nisn: s.nisn || s.nis,
      nama: s.nama_murid || s.nama_santri || 'Siswa',
      gender: s.jenis_kelamin || (targetKelas.toLowerCase().includes('akhwat') || targetKelas.toLowerCase().includes('aisyah') || targetKelas.toLowerCase().includes('khadijah') || targetKelas.toLowerCase().includes('salamah') ? 'P' : 'L'),
      kelas: targetKelas,
      mapelScores: mapelScores,
      totalScore: totalScore,
      average: average,
      tuntasCount: tuntasCount,
      allTuntas: tuntasCount === MAPEL_LEGER_CONFIG.length,
      diniyah: {
        tahfidz: diniyah.nilai_tahfidz || 88,
        adab: diniyah.adab_harian || 'Mumtaz (A)',
        ibadah: diniyah.ibadah_harian || 'Mumtaz (A)',
        b_arab: diniyah.nilai_bahasa_arab || 85,
        ziyadah: diniyah.capaian_ziyadah || 'Juz 29',
        murojaah: diniyah.capaian_murojaah || 'Juz 30'
      },
      kepribadian: {
        ibadah: kepribadian.aspek_ibadah || 'Sangat Baik',
        akhlak: kepribadian.aspek_akhlak || 'Sangat Baik',
        kedisiplinan: kepribadian.aspek_kedisiplinan || 'Baik',
        kerapihan: kepribadian.aspek_kerapihan || 'Baik',
        kemandirian: kepribadian.aspek_kemandirian || 'Baik',
        kepemimpinan: kepribadian.aspek_kepemimpinan || 'Baik'
      },
      presensi: {
        sakit: s.sakit !== undefined ? s.sakit : 0,
        izin: s.izin !== undefined ? s.izin : 0,
        alpa: s.alpa !== undefined ? s.alpa : 0
      },
      rank: 1
    };
  });

  // 3. Compute Ranking
  studentRows.sort((a, b) => b.average - a.average || b.totalScore - a.totalScore);
  studentRows.forEach((s, idx) => {
    s.rank = idx + 1;
  });

  const rankedTopStudent = studentRows.length > 0 ? studentRows[0] : null;
  studentRows.sort((a, b) => (Number(a.no) || 0) - (Number(b.no) || 0));

  // 4. Compute Per-Subject Statistics (Footer Summary)
  const mapelStats = MAPEL_LEGER_CONFIG.map((m, mIdx) => {
    let sum = 0;
    let min = 100;
    let max = 0;
    let countTuntas = 0;
    const totalStudents = studentRows.length;

    studentRows.forEach(s => {
      const score = s.mapelScores[mIdx]?.akhir || 0;
      sum += score;
      if (score < min) min = score;
      if (score > max) max = score;
      if (score >= m.kkm) countTuntas++;
    });

    const avg = totalStudents > 0 ? (sum / totalStudents).toFixed(1) : 0;
    const passPct = totalStudents > 0 ? Math.round((countTuntas / totalStudents) * 100) : 100;

    return {
      mapelId: m.id,
      mapelName: m.name,
      abbr: m.abbr,
      kkm: m.kkm,
      avg: avg,
      min: min <= 100 ? min : 0,
      max: max,
      passPct: passPct
    };
  });

  // 5. Overall Class Summary
  const grandTotalAvg = studentRows.length > 0 
    ? (studentRows.reduce((acc, s) => acc + s.average, 0) / studentRows.length).toFixed(1) 
    : 0;

  const totalClassEntries = studentRows.length * MAPEL_LEGER_CONFIG.length;
  const totalClassTuntas = studentRows.reduce((acc, s) => acc + s.tuntasCount, 0);
  const classPassRate = totalClassEntries > 0 
    ? Math.round((totalClassTuntas / totalClassEntries) * 100) + '%' 
    : '100%';

  return {
    kelas: targetKelas,
    tahunAjaran: targetTA,
    semester: targetSem,
    students: studentRows,
    topStudent: rankedTopStudent,
    mapelStats: mapelStats,
    grandTotalAvg: grandTotalAvg,
    classPassRate: classPassRate
  };
}

function buildLegerTbody(students, mode) {
  const tbody = document.getElementById('leger-table-tbody');
  if (!tbody) return;

  if (students.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="30" class="px-6 py-10 text-center text-slate-400">
          <i class="fa-solid fa-folder-open text-2xl mb-2 text-slate-300 block"></i>
          Belum ada data murid terdaftar pada rombel kelas ini.
        </td>
      </tr>
    `;
    return;
  }

  tbody.innerHTML = students.map((s, idx) => {
    let rankBadge = `<span class="font-bold font-mono text-slate-700">${s.rank}</span>`;
    if (s.rank === 1) rankBadge = `<span class="px-2 py-0.5 rounded-full bg-amber-400 text-amber-950 font-black text-[10px] shadow-sm">🥇 1</span>`;
    else if (s.rank === 2) rankBadge = `<span class="px-2 py-0.5 rounded-full bg-slate-200 text-slate-900 font-black text-[10px] shadow-sm">🥈 2</span>`;
    else if (s.rank === 3) rankBadge = `<span class="px-2 py-0.5 rounded-full bg-amber-700/20 text-amber-900 font-black text-[10px] shadow-sm">🥉 3</span>`;

    let mapelCells = '';
    if (mode === 'rincian') {
      mapelCells = s.mapelScores.map(m => {
        const isUnderKkm = m.akhir < m.kkm;
        const cellBg = isUnderKkm ? 'bg-rose-50/70 text-rose-700 font-bold' : (m.akhir >= 90 ? 'bg-emerald-50/40 text-emerald-950 font-bold' : '');
        return `
          <td class="px-1 py-2 text-center border-r border-slate-200 font-mono text-[11px] text-amber-950 bg-amber-50/20">${m.tugas}</td>
          <td class="px-1 py-2 text-center border-r border-slate-200 font-mono text-[11px] text-blue-950 bg-blue-50/20">${m.uts}</td>
          <td class="px-1.5 py-2 text-center border-r border-slate-200 font-mono font-black text-xs ${cellBg}">${m.akhir}</td>
        `;
      }).join('');
    } else {
      mapelCells = s.mapelScores.map(m => {
        const isUnderKkm = m.akhir < m.kkm;
        let cellClass = 'font-mono text-xs';
        if (isUnderKkm) {
          cellClass += ' bg-rose-100/70 text-rose-800 font-black';
        } else if (m.akhir >= 90) {
          cellClass += ' bg-emerald-50 text-emerald-800 font-bold';
        } else if (m.akhir >= 80) {
          cellClass += ' bg-blue-50/50 text-blue-900 font-medium';
        } else {
          cellClass += ' text-slate-700';
        }

        return `
          <td class="px-2 py-2 text-center border-r border-slate-200 ${cellClass}" title="${m.mapelName}: ${m.akhir} (${m.predikat})">
            ${m.akhir}
          </td>
        `;
      }).join('');
    }

    let extraCells = '';
    if (mode === 'holistik') {
      extraCells = `
        <td class="px-2 py-2 text-center border-r border-slate-200 font-mono font-bold text-emerald-900 bg-emerald-50/30">${s.diniyah.tahfidz}</td>
        <td class="px-2 py-2 text-center border-r border-slate-200 text-[10px] font-semibold text-slate-700">${s.diniyah.adab.replace(/\s*\(.*\)/, '')}</td>
        <td class="px-2 py-2 text-center border-r border-slate-200 text-[10px] font-semibold text-slate-700">${s.diniyah.ibadah.replace(/\s*\(.*\)/, '')}</td>
        <td class="px-2 py-2 text-center border-r border-slate-200 text-[10px] font-semibold text-slate-700">${s.kepribadian.akhlak}</td>
        <td class="px-2 py-2 text-center border-r border-slate-200 text-[10px] font-semibold text-slate-700">${s.kepribadian.kedisiplinan}</td>
        <td class="px-1 py-2 text-center border-r border-slate-200 font-mono text-xs text-slate-600">${s.presensi.sakit}</td>
        <td class="px-1 py-2 text-center border-r border-slate-200 font-mono text-xs text-slate-600">${s.presensi.izin}</td>
        <td class="px-1 py-2 text-center border-r border-slate-200 font-mono text-xs ${s.presensi.alpa > 0 ? 'text-rose-600 font-bold bg-rose-50' : 'text-slate-600'}">${s.presensi.alpa}</td>
      `;
    }

    return `
      <tr class="hover:bg-blue-50/30 transition leger-matrix-row" data-nama="${s.nama.toLowerCase()}" data-nis="${s.nis}">
        <td class="px-2 py-2 text-center font-mono text-slate-500 border-r border-slate-200 bg-white sticky left-0 z-10">${s.no}</td>
        <td class="px-3 py-2 font-mono font-bold text-slate-700 border-r border-slate-200 bg-white sticky left-10 z-10">${s.nisn}</td>
        <td class="px-3 py-2 font-bold text-slate-900 border-r border-slate-200 bg-white sticky left-34 z-10 truncate max-w-[180px]" title="${s.nama}">
          ${s.nama}
        </td>
        <td class="px-1 py-2 text-center border-r border-slate-200 text-[11px] font-bold text-slate-600">${s.gender}</td>
        ${mapelCells}
        <td class="px-2 py-2 text-center font-mono font-bold text-indigo-950 bg-indigo-50/40 border-r border-slate-200">${s.totalScore}</td>
        <td class="px-2 py-2 text-center font-mono font-black text-emerald-950 bg-emerald-50/40 border-r border-slate-200">${s.average}</td>
        <td class="px-2 py-2 text-center border-r border-slate-200 bg-amber-50/40">${rankBadge}</td>
        ${extraCells}
      </tr>
    `;
  }).join('');
}

function filterLegerMatrixLocal() {
  const query = (document.getElementById('leger-filter-search')?.value || '').toLowerCase().trim();
  const rows = document.querySelectorAll('.leger-matrix-row');
  rows.forEach(tr => {
    if (!query) {
      tr.style.display = '';
      return;
    }
    const nama = tr.getAttribute('data-nama') || '';
    const nis = tr.getAttribute('data-nis') || '';
    tr.style.display = nama.includes(query) || nis.includes(query) ? '' : 'none';
  });
}

/**
 * Clean & Formatted Excel / CSV Exporter for Master Leger
 */
function exportLegerToExcel() {
  if (!currentLegerDataCache || !currentLegerDataCache.students || currentLegerDataCache.students.length === 0) {
    showToast('Tidak ada data leger untuk diekspor.', 'warning');
    return;
  }

  const { kelas, tahunAjaran, semester, students, mapelStats, grandTotalAvg } = currentLegerDataCache;

  // UTF-8 BOM for Indonesian characters in Microsoft Excel
  let csv = "\uFEFF";

  // Header Title
  csv += `BUKU LEGER NILAI LENGKAP SMP AL-IMAM ISLAMIC SCHOOL\r\n`;
  csv += `Kelas: ${kelas}, Tahun Ajaran: ${tahunAjaran}, Semester: ${semester}\r\n\r\n`;

  // Columns Header
  const headers = [
    'No', 'NIS', 'NISN', 'Nama Siswa', 'L/P',
    ...MAPEL_LEGER_CONFIG.map(m => `${m.name} (KKM ${m.kkm})`),
    'Total Nilai', 'Rata-Rata', 'Peringkat',
    'Tahfidz', 'Adab Harian', 'Ibadah Harian', 'Akhlak', 'Kedisiplinan',
    'Sakit (S)', 'Izin (I)', 'Alpa (A)'
  ];
  csv += headers.map(h => `"${h}"`).join(',') + "\r\n";

  // Student Rows
  students.forEach(s => {
    const row = [
      s.no,
      `'${s.nis}`,
      `'${s.nisn}`,
      `"${s.nama}"`,
      s.gender,
      ...s.mapelScores.map(m => m.akhir),
      s.totalScore,
      s.average,
      s.rank,
      s.diniyah.tahfidz,
      `"${s.diniyah.adab}"`,
      `"${s.diniyah.ibadah}"`,
      `"${s.kepribadian.akhlak}"`,
      `"${s.kepribadian.kedisiplinan}"`,
      s.presensi.sakit,
      s.presensi.izin,
      s.presensi.alpa
    ];
    csv += row.join(',') + "\r\n";
  });

  // Footer Stats
  csv += "\r\n";
  csv += `"Rata-Rata Mata Pelajaran","","","","",` + mapelStats.map(m => m.avg).join(',') + `,"",${grandTotalAvg},""\r\n`;
  csv += `"% Tuntas KKM","","","","",` + mapelStats.map(m => `"${m.passPct}%"`).join(',') + `,"","",""\r\n`;

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.setAttribute("href", url);
  link.setAttribute("download", `Buku_Leger_Nilai_${kelas.replace(/\s+/g, '_')}_${tahunAjaran.replace('/', '-')}_Sem_${semester.replace(/\s+/g, '_')}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);

  showToast(`Alhamdulillah, Buku Leger Kelas ${kelas} berhasil diekspor ke file Excel/CSV!`, 'success');
}

function openAcademicYearModal() {
  const modal = document.getElementById('modal-academic-year');
  if (!modal) return;
  modal.classList.remove('hidden');
  renderAcademicYearsModal();
}

function closeAcademicYearModal() {
  const modal = document.getElementById('modal-academic-year');
  if (modal) modal.classList.add('hidden');
}

function renderAcademicYearsModal() {
  const currentYear = AppState.cmsSettings.academic_year || '2026/2027';
  const currentSem = AppState.cmsSettings.semester_active || 'I (Satu)';
  
  const displayYear = document.getElementById('modal-active-year-display');
  if (displayYear) displayYear.innerText = currentYear;
  
  const displaySem = document.getElementById('modal-active-sem-display');
  if (displaySem) displaySem.innerText = `(${currentSem})`;

  let listStr = AppState.cmsSettings.academic_years_list || '2026/2027,2025/2026,2024/2025';
  let years = listStr.split(',').map(s => s.trim()).filter(Boolean);
  if (!years.includes(currentYear)) years.unshift(currentYear);

  const container = document.getElementById('academic-years-chips-container');
  if (container) {
    container.innerHTML = years.map(yr => {
      const isActive = yr === currentYear;
      return `
        <button type="button" onclick="selectAcademicYear('${yr}')" 
                class="p-2.5 rounded-xl border text-center font-bold text-xs transition flex flex-col items-center justify-center gap-1 ${isActive ? 'bg-blue-600 text-white border-blue-600 shadow-md ring-2 ring-blue-300' : 'bg-white text-slate-700 border-slate-200 hover:border-blue-400 hover:bg-blue-50'}">
          <span>${yr}</span>
          ${isActive ? '<span class="text-[9px] bg-white/20 px-1.5 py-0.5 rounded-full">Aktif</span>' : '<span class="text-[9px] text-slate-400">Pilih</span>'}
        </button>
      `;
    }).join('');
  }
}

function selectAcademicYear(year) {
  AppState.cmsSettings.academic_year = year;
  saveCmsSettingsLocally();
  updateAllAcademicYearUI(year);
  renderAcademicYearsModal();
  showToast(`Tahun Ajaran Aktif berhasil diubah ke ${year}!`, 'success');

}

function submitNewAcademicYear(event) {
  event.preventDefault();
  const inputYear = document.getElementById('input-new-academic-year');
  const inputSem = document.getElementById('input-new-academic-sem');
  const inputDate = document.getElementById('input-new-academic-date');
  if (!inputYear || !inputYear.value.trim()) {
    showToast('Harap masukkan format tahun ajaran dengan benar (contoh: 2026/2027)', 'warning');
    return;
  }
  const newYear = inputYear.value.trim();
  const newSem = inputSem ? inputSem.value : 'I (Satu)';
  const newDate = inputDate ? inputDate.value.trim() : '17 Oktober 2026';

  let listStr = AppState.cmsSettings.academic_years_list || '2026/2027,2025/2026,2024/2025';
  let years = listStr.split(',').map(s => s.trim()).filter(Boolean);
  if (!years.includes(newYear)) years.unshift(newYear);

  AppState.cmsSettings.academic_year = newYear;
  AppState.cmsSettings.academic_years_list = years.join(',');
  AppState.cmsSettings.semester_active = newSem;
  AppState.cmsSettings.report_date = newDate;

  saveCmsSettingsLocally();
  updateAllAcademicYearUI(newYear);
  renderAcademicYearsModal();

  inputYear.value = '';
  showToast(`Alhamdulillah! Tahun Ajaran ${newYear} berhasil ditambahkan dan diaktifkan!`, 'success');

  callApi('saveCmsSettings', { settings: AppState.cmsSettings });
}

function updateAllAcademicYearUI(year) {
  const navYear = document.getElementById('nav-academic-year');
  if (navYear) navYear.innerText = year;
  
  const navSem = document.getElementById('nav-semester');
  if (navSem) navSem.innerText = (AppState.cmsSettings.semester_active || 'I (Satu)').includes('II') ? 'Genap' : 'Ganjil';

  const cmsYear = document.getElementById('cms-academic-year');
  if (cmsYear) cmsYear.value = year;

  const printKop = document.getElementById('print-tahun-ajaran-kop');
  if (printKop) printKop.innerText = year;

  const printSkl = document.getElementById('print-skl-tahun-ajaran');
  if (printSkl) printSkl.innerText = year;

  populateAcademicYearsFilterDropdowns(year);
}

function populateAcademicYearsFilterDropdowns(selectedYear) {
  const activeYear = selectedYear || AppState.cmsSettings.academic_year || '2026/2027';
  let listStr = AppState.cmsSettings.academic_years_list || '2026/2027,2025/2026,2024/2025';
  let years = listStr.split(',').map(s => s.trim()).filter(Boolean);
  if (!years.includes(activeYear)) years.unshift(activeYear);

  // 1. Filter dropdowns with "Semua" option
  const filterDropdownIds = [
    'filter-murid-tahun-ajaran',
    'filter-akademik-tahun-ajaran',
    'filter-diniyah-tahun-ajaran',
    'filter-kepemimpinan-tahun-ajaran'
  ];

  filterDropdownIds.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      const currentVal = el.value || activeYear;
      let html = '<option value="Semua">Semua Tahun Ajaran</option>';
      years.forEach(yr => {
        const isAktif = yr === activeYear ? ' (Aktif)' : '';
        html += `<option value="${yr}">${yr}${isAktif}</option>`;
      });
      el.innerHTML = html;
      el.value = currentVal;
    }
  });

  // 2. Direct Target Selectors
  const directDropdownIds = [
    'leger-akademik-tahun-ajaran',
    'upload-tahun-ajaran',
    'leger-kp-tahun-ajaran',
    'skl-kp-tahun-ajaran',
    'filter-rapor-tahun-ajaran'
  ];

  directDropdownIds.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      const currentVal = el.value || activeYear;
      let html = '';
      years.forEach(yr => {
        const isAktif = yr === activeYear ? ' (Aktif)' : '';
        html += `<option value="${yr}">${yr}${isAktif}</option>`;
      });
      el.innerHTML = html;
      el.value = currentVal;
    }
  });
}

// 11B. RENDER LEGER SKL 28 INDIKATOR (SESUAI EXCEL RAPORT KEPEMIMPINAN IX ABU)
function renderSklLegerGrid() {
  const kelasSelect = document.getElementById('skl-kp-kelas');
  const currentKelas = kelasSelect ? kelasSelect.value : 'IX ABU BAKAR';
  const students = AppState.muridList.filter(x => x.kelas === currentKelas);

  const tbody = document.getElementById('skl-leger-tbody');
  if (!tbody) return;

  if (students.length === 0) {
    tbody.innerHTML = `<tr><td colspan="32" class="py-6 text-center text-slate-400 italic">Belum ada murid di kelas ini.</td></tr>`;
    return;
  }

  const sklKeys = ['d1', 'd2', 'd3', 'd4', 'd5', 'd6', 'd7', 'k1', 'k2', 'k3', 'k4', 'k5', 'p1', 'p2', 'p3', 'p4', 'p5', 's1', 's2', 't1', 't2', 'm1', 'm2', 'r1', 'r2', 'r3', 'j1', 'j2', 'h1'];

  tbody.innerHTML = students.map((st, idx) => {
    const sklEntry = AppState.sklList.find(x => String(x.nis) === String(st.nis)) || { scores: {}, catatan_walas: '' };
    const catatan = sklEntry.catatan_walas || 'Kemampuan memimpinmu terlihat baik, lanjutkan usahamu mengajak teman-teman dalam kebaikan';

    let rowCols = `
      <td class="py-2 px-1 text-center font-bold text-slate-600 bg-slate-50 sticky left-0 z-10 border border-slate-200">${st.no_urut || (idx + 1)}</td>
      <td class="py-2 px-2 text-left font-bold text-slate-900 bg-slate-50 sticky left-8 z-10 border border-slate-200">${st.nama_murid || st.nama_santri}</td>
      <td class="py-2 px-1 text-center font-mono text-slate-600 border border-slate-200 text-[10px]">${st.nis}</td>
    `;

    sklKeys.forEach(k => {
      const defaultVal = (sklEntry.scores && sklEntry.scores[k]) ? sklEntry.scores[k] : (k.startsWith('k') ? 'B' : 'A');
      rowCols += `
        <td class="py-1 px-0.5 border border-slate-200">
          <select data-nis="${st.nis}" data-skl-key="${k}" class="skl-input-cell w-full bg-transparent text-center font-bold font-mono text-xs focus:bg-amber-50 focus:ring-1 focus:ring-amber-500 rounded cursor-pointer ${defaultVal === 'A' ? 'text-emerald-700' : 'text-blue-700'}">
            <option value="A" ${defaultVal === 'A' ? 'selected' : ''}>A</option>
            <option value="B" ${defaultVal === 'B' ? 'selected' : ''}>B</option>
            <option value="C" ${defaultVal === 'C' ? 'selected' : ''}>C</option>
            <option value="D" ${defaultVal === 'D' ? 'selected' : ''}>D</option>
          </select>
        </td>
      `;
    });

    rowCols += `
      <td class="py-1 px-2 border border-slate-200 text-left">
        <input type="text" data-nis="${st.nis}" class="skl-catatan-cell w-full text-xs bg-slate-50 border border-slate-200 rounded px-2 py-1 text-slate-800 focus:bg-white focus:ring-1 focus:ring-amber-500" value="${catatan}" />
      </td>
    `;

    return `<tr class="hover:bg-amber-50/40 transition">${rowCols}</tr>`;
  }).join('');
}

function applyFastSklPresets(type) {
  const cells = document.querySelectorAll('.skl-input-cell');
  cells.forEach(cell => {
    const key = cell.getAttribute('data-skl-key');
    if (type === 'all_a') {
      cell.value = 'A';
      cell.className = 'skl-input-cell w-full bg-transparent text-center font-bold font-mono text-xs text-emerald-700 rounded cursor-pointer';
    } else {
      // Standar Al-Imam: Kebersihan bernilai B, aspek lainnya bernilai A
      if (key && key.startsWith('k')) {
        cell.value = 'B';
        cell.className = 'skl-input-cell w-full bg-transparent text-center font-bold font-mono text-xs text-blue-700 rounded cursor-pointer';
      } else {
        cell.value = 'A';
        cell.className = 'skl-input-cell w-full bg-transparent text-center font-bold font-mono text-xs text-emerald-700 rounded cursor-pointer';
      }
    }
  });

  showToast(type === 'all_a' ? 'Semua 28 indikator SKL diatur ke nilai "A"!' : 'Standar Al-Imam (Kebersihan B, lainnya A) berhasil diterapkan!', 'success');
}

function saveSklLegerGrid() {
  const kelasSelect = document.getElementById('skl-kp-kelas');
  const currentKelas = kelasSelect ? kelasSelect.value : 'IX ABU BAKAR';
  const selectedYear = document.getElementById('skl-kp-tahun-ajaran')?.value || AppState.cmsSettings.academic_year || '2026/2027';
  const students = AppState.muridList.filter(x => x.kelas === currentKelas);

  const updatedEntries = [];

  students.forEach(st => {
    const cells = document.querySelectorAll(`.skl-input-cell[data-nis="${st.nis}"]`);
    const catatanInput = document.querySelector(`.skl-catatan-cell[data-nis="${st.nis}"]`);
    const scores = {};

    cells.forEach(c => {
      const k = c.getAttribute('data-skl-key');
      if (k) scores[k] = c.value;
    });

    const entry = {
      id: `SKL-${st.nis}`,
      nis: st.nis,
      nama_murid: st.nama_murid || st.nama_santri,
      kelas: currentKelas,
      semester: 'Tengah Semester 1',
      tahun_ajaran: selectedYear,
      scores: scores,
      catatan_walas: catatanInput ? catatanInput.value : 'Kemampuan memimpinmu terlihat baik, lanjutkan usahamu mengajak teman-teman dalam kebaikan'
    };

    updatedEntries.push(entry);

    const idx = AppState.sklList.findIndex(x => String(x.nis) === String(st.nis));
    if (idx !== -1) AppState.sklList[idx] = entry;
    else AppState.sklList.push(entry);
  });

  showToast(`Alhamdulillah, nilai SKL Kepemimpinan untuk ${updatedEntries.length} murid kelas ${currentKelas} berhasil disimpan!`, 'success');

  callApi('saveBulkSklKepemimpinan', { items: updatedEntries });

function applyTemplateToCard(nis, templateNo) {
  if (!templateNo) return;
  const card = document.querySelector(`.kp-student-card[data-nis="${nis}"]`);
  if (!card) return;

  const tpl = TEMPLETE_CATATAN_WALAS_32.find(t => t.no === Number(templateNo));
  if (tpl) {
    card.querySelector('.kp-card-kedisiplinan').value = tpl.kedisiplinan;
    card.querySelector('.kp-card-kerapihan').value = tpl.kerapihan;
    card.querySelector('.kp-card-kepemimpinan').value = tpl.kepemimpinan;
    card.querySelector('.kp-card-kerjasama').value = tpl.kerjasama;
    card.querySelector('.kp-card-catatan').value = tpl.catatan;
    showToast(`Template Catatan Walas #${tpl.no} berhasil diterapkan untuk murid ini!`, 'success');
  }
}

function filterTableKepemimpinanLocal() {
  const query = (document.getElementById('filter-kepemimpinan-search')?.value || '').toLowerCase().trim();
  const ta = document.getElementById('filter-kepemimpinan-tahun-ajaran')?.value || 'Semua';
  const kelas = document.getElementById('filter-kepemimpinan-kelas')?.value || 'Semua';

  const filtered = AppState.kepemimpinanList.filter(item => {
    if (ta !== 'Semua' && item.tahun_ajaran && String(item.tahun_ajaran) !== String(ta)) return false;
    if (kelas !== 'Semua' && String(item.kelas) !== String(kelas)) return false;

    if (!query) return true;
    const nama = (item.nama_murid || item.nama_santri || '').toLowerCase();
    return nama.includes(query) ||
      String(item.nis || '').toLowerCase().includes(query) ||
      String(item.nisn || '').toLowerCase().includes(query);
  });
  renderTableKepemimpinan(filtered);
  updateKepemimpinanWidgets(filtered);
}

function loadNilaiDiniyah() {
  const ta = document.getElementById('filter-diniyah-tahun-ajaran')?.value || 'Semua';
  const kelas = document.getElementById('filter-diniyah-kelas')?.value || 'Semua';

  callApi('getNilaiDiniyah', { tahun_ajaran: ta, kelas: kelas })
    .then(res => {
      if (res && res.data && res.data.length > 0) {
        AppState.diniyahList = res.data;
      }
      filterTableDiniyahLocal();
    })
    .catch(() => {
      filterTableDiniyahLocal();
    });
}

function filterTableDiniyahLocal() {
  const query = (document.getElementById('filter-diniyah-search')?.value || '').toLowerCase().trim();
  const ta = document.getElementById('filter-diniyah-tahun-ajaran')?.value || 'Semua';
  const kelas = document.getElementById('filter-diniyah-kelas')?.value || 'Semua';

  const filtered = AppState.diniyahList.filter(item => {
    if (ta !== 'Semua' && item.tahun_ajaran && String(item.tahun_ajaran) !== String(ta)) return false;
    if (kelas !== 'Semua' && String(item.kelas) !== String(kelas)) return false;

    if (!query) return true;
    const nama = (item.nama_murid || item.nama_santri || '').toLowerCase();
    return nama.includes(query) ||
      String(item.nis || '').toLowerCase().includes(query) ||
      String(item.nisn || '').toLowerCase().includes(query) ||
      String(item.ziyadah_juz || '').toLowerCase().includes(query) ||
      String(item.murojaah_juz || '').toLowerCase().includes(query);
  });
  renderTableDiniyah(filtered);
  updateDiniyahWidgets(filtered);
}

function updateDiniyahWidgets(list) {
  const total = list.length;
  let sumTahfidz = 0, sumArab = 0, countMumtaz = 0;
  list.forEach(i => {
    sumTahfidz += Number(i.nilai_tahfidz) || 0;
    sumArab += Number(i.bahasa_arab) || 0;
    if (String(i.adab_harian).includes('(A)')) countMumtaz++;
  });
  const avgTahfidz = total > 0 ? (sumTahfidz / total).toFixed(1) : 0;
  const avgArab = total > 0 ? (sumArab / total).toFixed(1) : 0;
  if (document.getElementById('widget-dn-total')) document.getElementById('widget-dn-total').innerText = total;
  if (document.getElementById('widget-dn-tahfidz-avg')) document.getElementById('widget-dn-tahfidz-avg').innerText = avgTahfidz;
  if (document.getElementById('widget-dn-adab-a')) document.getElementById('widget-dn-adab-a').innerText = countMumtaz;
  if (document.getElementById('widget-dn-arab-avg')) document.getElementById('widget-dn-arab-avg').innerText = avgArab;
}

function renderTableDiniyah(list) {
  const tbody = document.getElementById('table-diniyah-body');
  if (!tbody) return;

  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="10" class="px-4 py-8 text-center text-slate-400">Tidak ada data nilai diniyah.</td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(item => {
    const nama = item.nama_murid || item.nama_santri || '-';
    return `
    <tr class="hover:bg-slate-50 transition">
      <td class="px-4 py-3">
        <div class="font-bold text-slate-900">${nama}</div>
        <div class="text-[11px] text-slate-400 font-mono">${item.nisn || item.nis}</div>
      </td>
      <td class="px-3 py-3 font-semibold text-slate-700">${item.kelas}</td>
      <td class="px-3 py-3 font-medium text-emerald-800">${item.ziyadah_juz || '-'}</td>
      <td class="px-3 py-3 font-medium text-emerald-800">${item.murojaah_juz || '-'}</td>
      <td class="px-3 py-3 text-center font-bold text-emerald-700 font-mono">${item.nilai_tahfidz}</td>
      <td class="px-3 py-3 text-center font-semibold text-emerald-800 text-xs">${item.adab_harian}</td>
      <td class="px-3 py-3 text-center font-semibold text-emerald-800 text-xs">${item.ibadah_harian}</td>
      <td class="px-3 py-3 text-center font-bold text-emerald-700 font-mono">${item.bahasa_arab}</td>
      <td class="px-4 py-3 text-slate-600 italic text-[11px] max-w-xs truncate">${item.catatan_musyrif || '-'}</td>
      <td class="px-4 py-3 text-right space-x-1">
        <button onclick="editNilaiDiniyahModal('${item.id}')" class="p-1.5 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-lg text-xs" title="Edit Nilai">
          <i class="fa-solid fa-pen-to-square"></i>
        </button>
        <button onclick="deleteDiniyahAction('${item.id}')" class="p-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg text-xs" title="Hapus">
          <i class="fa-solid fa-trash"></i>

  }).join('');

function switchPrintFormat(format) {
  const btnPortofolio = document.getElementById('btn-print-tab-portofolio');
  const btnKepemimpinan = document.getElementById('btn-print-tab-kepemimpinan');
  const sheetPortofolio = document.getElementById('print-sheet-portofolio');
  const sheetKepemimpinan = document.getElementById('print-sheet-kepemimpinan');

  if (format === 'kepemimpinan') {
    sheetPortofolio?.classList.add('hidden');
    sheetKepemimpinan?.classList.remove('hidden');

    btnKepemimpinan?.classList.add('bg-white', 'text-indigo-700', 'shadow-sm');
    btnKepemimpinan?.classList.remove('text-slate-600');
    btnPortofolio?.classList.remove('bg-white', 'text-indigo-700', 'shadow-sm');
    btnPortofolio?.classList.add('text-slate-600');
  } else {
    sheetPortofolio?.classList.remove('hidden');
    sheetKepemimpinan?.classList.add('hidden');

    btnPortofolio?.classList.add('bg-white', 'text-indigo-700', 'shadow-sm');
    btnPortofolio?.classList.remove('text-slate-600');

function onRaporFilterChange() {
  const isWali = AppState.currentUser?.role === 'wali_murid';
  const childNis = AppState.currentUser?.nis || '242507001';

  const ta = document.getElementById('filter-rapor-tahun-ajaran')?.value || AppState.cmsSettings.academic_year || '2026/2027';
  const kelas = document.getElementById('filter-rapor-kelas')?.value || 'Semua';
  const search = (document.getElementById('filter-rapor-search')?.value || '').toLowerCase().trim();

  // Update header display if applicable
  const kopYear = document.getElementById('print-tahun-ajaran-kop');
  if (kopYear) kopYear.innerText = ta;
  const sklYear = document.getElementById('print-skl-tahun-ajaran');
  if (sklYear) sklYear.innerText = ta;

  // Filter students for select dropdown
  let filtered = AppState.muridList;
  if (isWali) {
    const found = AppState.muridList.filter(s => 
      String(s.nis).trim() === String(childNis).trim() || 
      String(s.nisn).trim() === String(childNis).trim() ||
      (s.nama_murid || s.nama || '').toLowerCase().includes('abdillah')
    );
    filtered = found.length > 0 ? found : AppState.muridList.slice(0, 1);
  } else {
    if (kelas !== 'Semua') {
      filtered = filtered.filter(s => String(s.kelas) === String(kelas));
    }
    if (search) {
      filtered = filtered.filter(s => {
        const nama = (s.nama_murid || s.nama_santri || s.nama || s.nama_lengkap || '').toLowerCase();
        return nama.includes(search) || String(s.nis || '').includes(search) || String(s.nisn || '').includes(search);
      });
    }
  }

  const select = document.getElementById('rapor-murid-select');
  if (!select) return;

  if (filtered.length === 0) {
    select.innerHTML = '<option value="">(Tidak ada siswa cocok)</option>';
    return;
  }

  select.innerHTML = filtered.map((s, idx) => {
    const nama = s.nama_murid || s.nama_santri || s.nama || s.nama_lengkap || '-';
    const noUrut = s.no_urut || s.no || (idx + 1);
    return `<option value="${s.nis}">${noUrut}. ${nama} (${s.kelas})</option>`;
  }).join('');

  // Keep selected or pick first
  const exists = filtered.some(s => String(s.nis).trim() === String(AppState.activePrintNis).trim());
  const targetNis = isWali ? (filtered[0]?.nis || childNis) : (exists ? AppState.activePrintNis : filtered[0].nis);
  select.value = targetNis;
  loadMuridReportForPrint(targetNis);
}

  onRaporFilterChange();
