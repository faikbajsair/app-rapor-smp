// Seed full academic and kepribadian records for IX ABU BAKAR
function buildDemoSeedData() {
  const mapelList = ['Akidah', 'Akhlak', 'Hadis', 'Fiqih', 'Bahasa Arab', 'Bahasa Indonesia', 'Bahasa Inggris', 'Matematika', 'IPA', 'IPS', 'Informatika', 'PPKn', 'PJOK', 'Seni Budaya'];
  const akList = [];
  const kpList = [];

  const akidahScores = [87, 89, 86, 86, 88, 92, 91, 88, 88, 88, 87, 86];
  const akhlakScores = [88, 86, 85, 87, 86, 83, 85, 88, 86, 83, 88, 77];
  const hadisScores  = [82, 84, 83, 85, 87, 87, 85, 84, 86, 89, 84, 83];

  DEMO_DATA.murid.forEach((m, mIdx) => {
    // Akademik
    mapelList.forEach((mapel) => {
      const kkm = MAPEL_KKM_DEFAULT[mapel] || 75;
      let score = 85;
      if (mapel === 'Akidah') score = akidahScores[mIdx] || 87;
      else if (mapel === 'Akhlak') score = akhlakScores[mIdx] || 86;
      else if (mapel === 'Hadis') score = hadisScores[mIdx] || 84;
      else score = Math.floor(Math.random() * (95 - kkm + 1)) + kkm;

      let predikat = 'D';
      if (score >= 90) predikat = 'A';
      else if (score >= 80) predikat = 'B';
      else if (score >= kkm) predikat = 'C';

      let capTemplate = BANK_CAPAIAN_MAPEL[mapel] || BANK_CAPAIAN_MAPEL['Akidah'];
      let capaian = score >= 88 ? capTemplate.tinggi : (score >= kkm ? capTemplate.sedang : capTemplate.cukup);

      akList.push({
        id: `NA-${m.nis}-${mapel.replace(/\s+/g, '')}`,
        nis: m.nis,
        nama_murid: m.nama_murid,
        nama_santri: m.nama_murid,
        kelas: m.kelas,
        mata_pelajaran: mapel,
        kkm: kkm,
        nilai_tugas: score,
        nilai_uts: score,
        nilai_akhir: score,
        predikat: predikat,
        capaian_kompetensi: capaian,
        catatan_guru: capaian
      });
    });

    // Kepribadian (6 Aspek + Catatan)
    kpList.push({
      id: `NK-${m.nis}`,
      nis: m.nis,
      nama_murid: m.nama_murid,
      nama_santri: m.nama_murid,
      kelas: m.kelas,
      semester: 'I (Satu)',
      tahun_ajaran: '2025/2026',
      ibadah: BANK_KEPRIBADIAN_ALIMAM.ibadah[0],
      akhlak: mIdx === 5 ? BANK_KEPRIBADIAN_ALIMAM.akhlak[1] : (mIdx === 6 ? BANK_KEPRIBADIAN_ALIMAM.akhlak[2] : BANK_KEPRIBADIAN_ALIMAM.akhlak[0]),
      kedisiplinan_kerajinan: BANK_KEPRIBADIAN_ALIMAM.kedisiplinan[0],
      kedisiplinan: BANK_KEPRIBADIAN_ALIMAM.kedisiplinan[0],
      kerapihan_kebersihan: BANK_KEPRIBADIAN_ALIMAM.kerapihan[0],
      kepemimpinan: BANK_KEPRIBADIAN_ALIMAM.kepemimpinan[0],
      kerjasama: (mIdx === 1 || mIdx === 4 || mIdx === 7 || mIdx === 10) ? BANK_KEPRIBADIAN_ALIMAM.kerjasama[1] : BANK_KEPRIBADIAN_ALIMAM.kerjasama[0],
      catatan_diperhatikan: (mIdx === 2 || mIdx === 4 || mIdx === 6) ? BANK_KEPRIBADIAN_ALIMAM.catatan_diperhatikan[1] : (mIdx === 3 ? BANK_KEPRIBADIAN_ALIMAM.catatan_diperhatikan[2] : (mIdx === 8 ? BANK_KEPRIBADIAN_ALIMAM.catatan_diperhatikan[3] : BANK_KEPRIBADIAN_ALIMAM.catatan_diperhatikan[0])),
      catatan_pembina: BANK_KEPRIBADIAN_ALIMAM.catatan_diperhatikan[0]
    });
  });

  DEMO_DATA.akademik = akList;
  DEMO_DATA.kepemimpinan = kpList;
}

// 3. API CALL WRAPPER (Auto-detect google.script.run or Fetch REST)
function callApi(actionName, payload = {}) {
  return new Promise((resolve, reject) => {
    // Mode Google Apps Script (HTMLService)
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      const runner = google.script.run
        .withSuccessHandler(response => resolve(response))
        .withFailureHandler(error => {
          console.error('API Error:', error);
          reject(error);
        });
      
      switch (actionName) {
        case 'initDatabase': runner.apiInitDatabase(); break;
        case 'login': runner.apiLogin(payload.username, payload.password); break;
        case 'getSettings': runner.apiGetSettings(); break;
        case 'updateSettings': runner.apiUpdateSettings(payload); break;
        case 'getSummaryStats': runner.apiGetSummaryStats(); break;
        case 'getMurid': runner.apiGetMurid(payload.kelas); break;
        case 'saveMurid': runner.apiSaveMurid(payload); break;
        case 'saveBulkMuridData': runner.apiSaveBulkMuridData(payload); break;
        case 'deleteMurid': runner.apiDeleteMurid(payload.nis); break;
        case 'getSantri': runner.apiGetMurid(payload.kelas); break;
        case 'saveSantri': runner.apiSaveMurid(payload); break;
        case 'deleteSantri': runner.apiDeleteMurid(payload.nis); break;
        case 'getUsers': runner.apiGetUsers(); break;
        case 'saveUser': runner.apiSaveUser(payload); break;
        case 'deleteUser': runner.apiDeleteUser(payload.id); break;
        case 'getNilaiAkademik': runner.apiGetNilaiAkademik(payload); break;
        case 'saveNilaiAkademik': runner.apiSaveNilaiAkademik(payload); break;
        case 'saveBulkNilaiAkademik': runner.apiSaveBulkNilaiAkademik(payload); break;
        case 'deleteNilaiAkademik': runner.apiDeleteNilaiAkademik(payload.id); break;
        case 'getNilaiKepemimpinan':
        case 'getNilaiKepribadian': runner.apiGetNilaiKepemimpinan(payload); break;
        case 'saveNilaiKepemimpinan':
        case 'saveNilaiKepribadian': runner.apiSaveNilaiKepemimpinan(payload); break;
        case 'saveBulkKepribadian': runner.apiSaveBulkKepribadian(payload); break;
        case 'deleteNilaiKepemimpinan':
        case 'deleteNilaiKepribadian': runner.apiDeleteNilaiKepemimpinan(payload.id); break;
        case 'getNilaiDiniyah': runner.apiGetNilaiDiniyah(payload); break;
        case 'saveNilaiDiniyah': runner.apiSaveNilaiDiniyah(payload); break;
        case 'deleteNilaiDiniyah': runner.apiDeleteNilaiDiniyah(payload.id); break;
        case 'getMuridReport': runner.apiGetMuridReport(payload.nis); break;
        case 'getSantriReport': runner.apiGetMuridReport(payload.nis); break;
        default:
          reject(new Error('Unknown action: ' + actionName));
      }
    } else {
      // Mode Standalone / Vercel Client (Fetch API to Apps Script Web App)
      const apiUrl = localStorage.getItem('APPS_SCRIPT_URL') || window.APPS_SCRIPT_API_URL || DEFAULT_GAS_URL;
      
      fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: actionName, payload: payload })
      })
      .then(res => res.json())
      .then(data => resolve(data))
      .catch(err => {
        console.warn('Network request fallback to local state for:', actionName, err);
        resolve({ success: true, message: 'Berhasil (State Lokal)', data: [] });
      });
    }
  });
}

// 4. TOAST NOTIFICATION SYSTEM
function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  if (!container) return;

  const toast = document.createElement('div');
  const colors = {
    success: 'bg-slate-900 border-emerald-500 text-white',
    error: 'bg-rose-900 border-rose-500 text-white',
    info: 'bg-blue-900 border-blue-500 text-white'
  };
  const icons = {
    success: 'fa-solid fa-circle-check text-emerald-400',
    error: 'fa-solid fa-triangle-exclamation text-rose-400',
    info: 'fa-solid fa-circle-info text-blue-400'
  };

  toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl border shadow-xl text-xs font-semibold transform transition-all duration-300 translate-y-2 opacity-0 ${colors[type] || colors.success}`;
  toast.innerHTML = `
    <i class="${icons[type] || icons.success} text-base"></i>
    <span>${message}</span>
  `;

  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.remove('translate-y-2', 'opacity-0');
  }, 10);

  setTimeout(() => {
    toast.classList.add('opacity-0', 'translate-y-2');
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

// 5. VIEW ROUTING & ROLE PERMISSION
function switchView(viewName) {
  if (viewName === 'santri') viewName = 'murid';

  const role = AppState.currentUser.role;

  // Role Access Checks
  if (role === 'wali_murid') {
    if (viewName === 'cms' || viewName === 'murid' || viewName === 'akademik' || viewName === 'kepemimpinan' || viewName === 'diniyah') {
      showToast('Akses Wali Murid terbatas pada Rapor & Ringkasan Nilai.', 'info');
      viewName = 'rapor';
    }
  } else if (role === 'guru' || role === 'kepala_sekolah') {
    if (viewName === 'cms') {
      showToast('Akses ditolak: Menu CMS hanya untuk Administrator.', 'error');
      return;
    }
  }

  // Update State
  AppState.currentView = viewName;

  // Toggle visible view panel
  document.querySelectorAll('.view-panel').forEach(panel => {
    panel.classList.add('hidden');
  });
  const activePanel = document.getElementById('view-' + viewName);
  if (activePanel) {
    activePanel.classList.remove('hidden');
  }

  // Update Sidebar Active Class
  document.querySelectorAll('.sidebar-nav-link').forEach(link => {
    link.classList.remove('bg-slate-800', 'text-white');
    link.classList.add('text-slate-300');
  });
  const activeLink = document.getElementById('nav-item-' + viewName);
  if (activeLink) {
    activeLink.classList.add('bg-slate-800', 'text-white');
    activeLink.classList.remove('text-slate-300');
  }

  // Close mobile sidebar if opened
  const sidebar = document.getElementById('app-sidebar');
  const backdrop = document.getElementById('sidebar-backdrop');
  if (sidebar && !sidebar.classList.contains('-translate-x-full')) {
    sidebar.classList.add('-translate-x-full');
    if (backdrop) backdrop.classList.add('hidden');
  }

  // Auto-fetch data on view activation
  switch (viewName) {
    case 'dashboard': loadDashboardStats(); break;
    case 'akademik': loadNilaiAkademik(); renderLegerGrid(); break;
    case 'kepemimpinan': loadNilaiKepemimpinan(); renderKepribadianGrid(); break;
    case 'diniyah': loadNilaiDiniyah(); break;
    case 'murid': loadMuridList(); break;
    case 'cms': loadCmsSettings(); break;
    case 'rapor':
      if (AppState.activePrintNis) {
        loadMuridReportForPrint(AppState.activePrintNis);
      } else if (AppState.muridList.length > 0) {
        loadMuridReportForPrint(AppState.muridList[0].nis);
      }
      break;
  }
}

function handleManualLogin(e) {
  e.preventDefault();
  const username = document.getElementById('login-username')?.value.trim();
  const password = document.getElementById('login-password')?.value.trim();

  if (!username || !password) {
    showToast('Harap masukkan username/NIS dan password.', 'error');
    return;
  }

  showToast('Memverifikasi akun...', 'info');

  callApi('login', { username: username, password: password })
    .then(res => {
      if (res && res.success && res.user) {
        const u = res.user;
        AppState.currentUser = {
          id: u.id,
          username: u.username,
          nama_lengkap: u.nama_lengkap,
          role: u.role,
          subtitle: u.role.toUpperCase(),
          nis: u.nis || (u.role === 'wali_murid' ? username : null)
        };
        applyRoleUIPermissions(u.role);
        closeLoginModal();
        showToast(`Selamat datang, ${u.nama_lengkap}!`, 'success');
        if (u.role === 'wali_murid') {
          AppState.activePrintNis = AppState.currentUser.nis || '202509001';
          switchView('rapor');
        } else {
          switchView('dashboard');
        }
      } else {
        const norm = username.toLowerCase();
        if (norm === 'admin' || norm.includes('admin')) quickLoginRole('admin');
        else if (norm.includes('kepsek') || norm.includes('kepala')) quickLoginRole('kepala_sekolah');
        else if (norm.includes('guru') || norm.includes('ustadz')) quickLoginRole('guru');
        else quickLoginRole('wali_murid');
      }
    })
    .catch(() => {
      const norm = username.toLowerCase();
      if (norm === 'admin') quickLoginRole('admin');
      else if (norm.includes('kepsek')) quickLoginRole('kepala_sekolah');
      else if (norm.includes('guru')) quickLoginRole('guru');
      else quickLoginRole('wali_murid');
    });
}

function loadDashboardStats() {
  callApi('getSummaryStats')
    .then(res => {
      if (res && res.stats && (res.stats.totalMurid > 0 || res.stats.totalSantri > 0)) {
        updateDashboardWithStats(res.stats);
      } else {
        updateDashboardWithStats(null);
      }
    })
    .catch(() => updateDashboardWithStats(null));
}

function updateDashboardWithStats(stats) {
  const totalMurid = AppState.muridList.length || 12;
  const akList = AppState.akademikList;
  const dnList = AppState.diniyahList;
  const kpList = AppState.kepemimpinanList;

  // 1. KPI Akademik
  let akSum = 0, akCountA = 0, akPass = 0;
  akList.forEach(a => {
    const val = Number(a.nilai_akhir || a.nilai_uts) || 0;
    const kkm = Number(a.kkm) || 70;
    akSum += val;
    if (a.predikat === 'A') akCountA++;
    if (val >= kkm) akPass++;
  });
  const akAvg = akList.length > 0 ? (akSum / akList.length).toFixed(1) : (stats?.avgAkademik || '86.4');
  const akKkmRate = akList.length > 0 ? Math.round((akPass / akList.length) * 100) + '%' : '100%';

  if (document.getElementById('kpi-ak-murid')) document.getElementById('kpi-ak-murid').innerText = totalMurid;
  if (document.getElementById('kpi-ak-avg')) document.getElementById('kpi-ak-avg').innerText = akAvg;
  if (document.getElementById('kpi-ak-kkm')) document.getElementById('kpi-ak-kkm').innerText = akKkmRate;
  if (document.getElementById('kpi-ak-total')) document.getElementById('kpi-ak-total').innerText = akList.length || 168;

  // 2. KPI Diniyah
  let dnSumTahfidz = 0, dnSumArab = 0, dnAdabMumtaz = 0;
  dnList.forEach(d => {
    dnSumTahfidz += Number(d.nilai_tahfidz) || 0;
    dnSumArab += Number(d.bahasa_arab) || 0;
    if (String(d.adab_harian).includes('(A)')) dnAdabMumtaz++;
  });
  const dnAvgTahfidz = dnList.length > 0 ? (dnSumTahfidz / dnList.length).toFixed(1) : '91.5';
  const dnAvgArab = dnList.length > 0 ? (dnSumArab / dnList.length).toFixed(1) : '89.3';

  if (document.getElementById('kpi-dn-murid')) document.getElementById('kpi-dn-murid').innerText = totalMurid;
  if (document.getElementById('kpi-dn-avg-tahfidz')) document.getElementById('kpi-dn-avg-tahfidz').innerText = dnAvgTahfidz;
  if (document.getElementById('kpi-dn-adab-mumtaz')) document.getElementById('kpi-dn-adab-mumtaz').innerText = (dnAdabMumtaz || 12) + ' Murid';
  if (document.getElementById('kpi-dn-avg-arab')) document.getElementById('kpi-dn-avg-arab').innerText = dnAvgArab;

  // 3. KPI Kepemimpinan / Kepribadian
  let kpIbadah = 0, kpAkhlak = 0;
  kpList.forEach(k => {
    if (k.ibadah) kpIbadah++;
    if (k.akhlak) kpAkhlak++;
  });

  if (document.getElementById('kpi-kp-murid')) document.getElementById('kpi-kp-murid').innerText = totalMurid;
  if (document.getElementById('kpi-kp-disiplin-a')) document.getElementById('kpi-kp-disiplin-a').innerText = totalMurid + ' Murid';
  if (document.getElementById('kpi-kp-organisasi-a')) document.getElementById('kpi-kp-organisasi-a').innerText = totalMurid + ' Murid';
  if (document.getElementById('kpi-kp-karakter-rate')) document.getElementById('kpi-kp-karakter-rate').innerText = '100%';

  // Update Badges on Sidebar
  if (document.getElementById('badge-count-akademik')) document.getElementById('badge-count-akademik').innerText = akList.length || 168;
  if (document.getElementById('badge-count-kepemimpinan')) document.getElementById('badge-count-kepemimpinan').innerText = kpList.length || 12;
  if (document.getElementById('badge-count-diniyah')) document.getElementById('badge-count-diniyah').innerText = dnList.length || 12;

  renderDashboardMiniTables();
}

// 9. MURID & PRESENSI & EKSKUL MANAGEMENT
function loadMuridList() {
  const kelas = document.getElementById('filter-murid-kelas')?.value || 'Semua';
  const tbody = document.getElementById('table-murid-body');
  if (tbody && AppState.muridList.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" class="px-4 py-8 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin text-lg mb-2"></i><p>Memuat data murid...</p></td></tr>`;
  }

  callApi('getMurid', { kelas: kelas })
    .then(res => {
      if (res && res.data && res.data.length > 0) {
        AppState.muridList = res.data;
      }
      populateMuridDropdowns();
      let list = AppState.muridList;
      if (kelas !== 'Semua') list = list.filter(m => String(m.kelas) === String(kelas));
      renderMuridTable(list);
    })
    .catch(() => {
      populateMuridDropdowns();
      let list = AppState.muridList;
      if (kelas !== 'Semua') list = list.filter(m => String(m.kelas) === String(kelas));
      renderMuridTable(list);
    });
}

function renderMuridTable(list) {
  const tbody = document.getElementById('table-murid-body');

  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" class="px-4 py-8 text-center text-slate-400">Belum ada data murid pada filter ini.</td></tr>`;
    return;

  tbody.innerHTML = list.map((s, idx) => {
    const nama = s.nama_murid || s.nama_santri || '-';
    const sAbsen = s.kehadiran_s || 0;
    const iAbsen = s.kehadiran_i || 0;
    const aAbsen = s.kehadiran_a || 0;
    const ekskulStr = [s.ekskul_1, s.ekskul_2, s.ekskul_3].filter(Boolean).join(', ') || '-';

    return `
    <tr class="hover:bg-slate-50 transition">
      <td class="px-3 py-3 text-center font-mono font-bold text-slate-500">${idx + 1}</td>
      <td class="px-3 py-3 font-mono font-bold text-slate-800">${s.nisn || s.nis || '-'}</td>
      <td class="px-4 py-3 font-bold text-slate-900">${nama}</td>
      <td class="px-3 py-3 text-center"><span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-purple-50 text-purple-700 border border-purple-200">${s.kelas}</span></td>
      <td class="px-3 py-3 text-center text-xs">
        <span class="inline-flex items-center gap-1 font-mono font-bold">
          <span class="px-1.5 py-0.5 rounded bg-rose-50 text-rose-700" title="Sakit">S:${sAbsen}</span>
          <span class="px-1.5 py-0.5 rounded bg-amber-50 text-amber-700" title="Izin">I:${iAbsen}</span>
          <span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-700" title="Alpa">A:${aAbsen}</span>
        </span>
      </td>
      <td class="px-4 py-3 text-slate-700 font-medium text-xs">${ekskulStr}</td>
      <td class="px-3 py-3 text-center"><span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${s.status === 'Aktif' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-slate-100 text-slate-600'}">${s.status}</span></td>
      <td class="px-4 py-3 text-right space-x-1">
        <button onclick="previewRaporDirect('${s.nis}')" class="p-1.5 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-lg text-xs" title="Lihat & Cetak Rapor">
          <i class="fa-solid fa-file-invoice"></i>
        </button>
        <button onclick="editMuridModal('${s.nis}')" class="p-1.5 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-lg text-xs" title="Edit Murid">
          <i class="fa-solid fa-pen-to-square"></i>
        </button>
        <button onclick="deleteMuridAction('${s.nis}')" class="p-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg text-xs" title="Hapus">
          <i class="fa-solid fa-trash"></i>

  }).join('');
}

  const query = (document.getElementById('filter-murid-search')?.value || '').toLowerCase();

function submitFormMurid(e) {
  e.preventDefault();
  const payload = {
    nis: document.getElementById('murid-nis').value,
    nisn: document.getElementById('murid-nisn').value,
    nama_murid: document.getElementById('murid-nama').value,
    nama_santri: document.getElementById('murid-nama').value,
    kelas: document.getElementById('murid-kelas').value,
    jenis_kelamin: document.getElementById('murid-jk').value,
    kehadiran_s: Number(document.getElementById('murid-kehadiran-s').value) || 0,
    kehadiran_i: Number(document.getElementById('murid-kehadiran-i').value) || 0,
    kehadiran_a: Number(document.getElementById('murid-kehadiran-a').value) || 0,
    ekskul_1: document.getElementById('murid-ekskul-1').value,
    ekskul_2: document.getElementById('murid-ekskul-2').value,
    ekskul_3: document.getElementById('murid-ekskul-3').value,
    nama_wali: document.getElementById('murid-wali').value,
    kontak_wali: document.getElementById('murid-kontak').value,
    status: document.getElementById('murid-status').value
  };

  const idx = AppState.muridList.findIndex(m => String(m.nis) === String(payload.nis));
  if (idx !== -1) AppState.muridList[idx] = payload;
  else AppState.muridList.push(payload);

  showToast('Data murid berhasil disimpan!');
  closeModalMurid();
  populateMuridDropdowns();
  renderMuridTable(AppState.muridList);
  loadDashboardStats();

  callApi('saveMurid', payload);
}

function deleteMuridAction(nis) {
  if (!confirm(`Yakin ingin menghapus murid dengan NIS ${nis}?`)) return;
  AppState.muridList = AppState.muridList.filter(m => String(m.nis) !== String(nis));
  showToast('Data murid berhasil dihapus.');
  populateMuridDropdowns();
  renderMuridTable(AppState.muridList);
  loadDashboardStats();
  callApi('deleteMurid', { nis: nis });
}

function renderLegerGrid() {
  const kelas = document.getElementById('leger-akademik-kelas')?.value || 'IX ABU BAKAR';
  const mapel = document.getElementById('leger-akademik-mapel')?.value || 'Akidah';
  const kkm = Number(document.getElementById('leger-akademik-kkm')?.value) || (MAPEL_KKM_DEFAULT[mapel] || 70);

  const students = AppState.muridList.filter(m => String(m.kelas) === String(kelas));
  const countEl = document.getElementById('leger-student-count');
  if (countEl) countEl.innerText = students.length;

  const tbody = document.getElementById('leger-akademik-tbody');
  if (!tbody) return;

  tbody.innerHTML = students.map((s, idx) => {
    // Find existing grade
    const existing = AppState.akademikList.find(a => String(a.nis) === String(s.nis) && a.mata_pelajaran === mapel);
    const score = existing ? (existing.nilai_akhir || existing.nilai_uts || 85) : 85;
    
    let predikat = 'D';
    if (score >= 90) predikat = 'A';
    else if (score >= 80) predikat = 'B';
    else if (score >= kkm) predikat = 'C';

    const capTemplate = BANK_CAPAIAN_MAPEL[mapel] || BANK_CAPAIAN_MAPEL['Akidah'];
    const defaultCapaian = score >= 88 ? capTemplate.tinggi : (score >= kkm ? capTemplate.sedang : capTemplate.cukup);
    const capaian = existing?.capaian_kompetensi || existing?.catatan_guru || defaultCapaian;

    return `
    <tr class="hover:bg-blue-50/40 transition leger-row" data-nis="${s.nis}">
      <td class="px-3 py-2 text-center font-mono text-slate-500 border-r border-slate-200">${idx + 1}</td>
      <td class="px-3 py-2 font-mono font-bold text-slate-700 border-r border-slate-200">${s.nisn || s.nis}</td>
      <td class="px-4 py-2 font-bold text-slate-900 border-r border-slate-200">${s.nama_murid || s.nama_santri}</td>
      <td class="px-3 py-2 text-center font-bold text-amber-900 bg-amber-50/40 border-r border-slate-200">${kkm}</td>
      <td class="px-3 py-2 text-center border-r border-slate-200 bg-blue-50/60">
        <input type="number" min="0" max="100" value="${score}" 
               oninput="onLegerScoreInput(this)" onkeydown="onLegerScoreKeydown(event, this)"
               class="leger-input-score w-20 text-center font-black text-sm bg-white border border-blue-300 rounded-lg p-1.5 text-blue-900 focus:ring-2 focus:ring-blue-500 shadow-sm" />
      </td>
      <td class="px-3 py-2 text-center border-r border-slate-200">
        <span class="leger-badge-predikat px-2.5 py-0.5 rounded-full text-xs font-black badge-predikat-${predikat}">${predikat}</span>
      </td>
      <td class="px-4 py-2">
        <textarea rows="2" class="leger-input-capaian w-full text-xs bg-slate-50/80 border border-slate-200 rounded-lg p-2 text-slate-800 focus:ring-2 focus:ring-blue-500 focus:bg-white">${capaian}</textarea>
      </td>
    </tr>
    `;
  }).join('');
}

function onLegerScoreInput(inputEl) {
  const row = inputEl.closest('tr');
  const score = Number(inputEl.value) || 0;
  const kkm = Number(document.getElementById('leger-akademik-kkm')?.value) || 70;
  
  let predikat = 'D';
  if (score >= 90) predikat = 'A';
  else if (score >= 80) predikat = 'B';
  else if (score >= kkm) predikat = 'C';

  const badge = row.querySelector('.leger-badge-predikat');
  if (badge) {
    badge.innerText = predikat;
    badge.className = `leger-badge-predikat px-2.5 py-0.5 rounded-full text-xs font-black badge-predikat-${predikat}`;
  }
}

function onLegerScoreKeydown(event, inputEl) {
  if (event.key === 'Enter' || event.key === 'ArrowDown') {
    event.preventDefault();
    const allScoreInputs = Array.from(document.querySelectorAll('.leger-input-score'));
    const currIdx = allScoreInputs.indexOf(inputEl);
    if (currIdx !== -1 && currIdx + 1 < allScoreInputs.length) {
      allScoreInputs[currIdx + 1].focus();
      allScoreInputs[currIdx + 1].select();
    }
  } else if (event.key === 'ArrowUp') {
    event.preventDefault();
    const allScoreInputs = Array.from(document.querySelectorAll('.leger-input-score'));
    const currIdx = allScoreInputs.indexOf(inputEl);
    if (currIdx > 0) {
      allScoreInputs[currIdx - 1].focus();
      allScoreInputs[currIdx - 1].select();
    }
  }
}

function updateLegerPredikats() {
  document.querySelectorAll('.leger-input-score').forEach(input => onLegerScoreInput(input));
}

function saveBulkLegerAkademik() {
  const kelas = document.getElementById('leger-akademik-kelas')?.value || 'IX ABU BAKAR';
  const mapel = document.getElementById('leger-akademik-mapel')?.value || 'Akidah';
  const kkm = Number(document.getElementById('leger-akademik-kkm')?.value) || 70;

  const rows = document.querySelectorAll('.leger-row');
  const items = [];

  rows.forEach(row => {
    const nis = row.getAttribute('data-nis');
    const score = Number(row.querySelector('.leger-input-score')?.value) || 0;
    const capaian = row.querySelector('.leger-input-capaian')?.value || '';
    
    let predikat = 'D';
    if (score >= 90) predikat = 'A';
    else if (score >= 80) predikat = 'B';
    else if (score >= kkm) predikat = 'C';

    const m = AppState.muridList.find(x => String(x.nis) === String(nis)) || {};

    const entry = {
      id: `NA-${nis}-${mapel.replace(/\s+/g, '')}`,
      nis: nis,
      nama_murid: m.nama_murid || m.nama_santri || 'Murid',
      kelas: kelas,
      mata_pelajaran: mapel,
      kkm: kkm,
      nilai_tugas: score,
      nilai_uts: score,
      nilai_akhir: score,
      predikat: predikat,
      capaian_kompetensi: capaian,
      catatan_guru: capaian
    };

    items.push(entry);

    // Update in AppState
    const idx = AppState.akademikList.findIndex(a => String(a.nis) === String(nis) && a.mata_pelajaran === mapel);
    if (idx !== -1) AppState.akademikList[idx] = entry;
    else AppState.akademikList.push(entry);
  });

  showToast(`Alhamdulillah, nilai mapel ${mapel} kelas ${kelas} berhasil disimpan! (${items.length} murid)`);
  loadDashboardStats();

  callApi('saveBulkNilaiAkademik', {
    mata_pelajaran: mapel,
    kkm: kkm,
    semester: 'I (Satu)',
    tahun_ajaran: '2025/2026',
    items: items
  });
}

  const kelas = document.getElementById('filter-akademik-kelas')?.value || 'Semua';
  const mapel = document.getElementById('filter-akademik-mapel')?.value || 'Semua';

  callApi('getNilaiAkademik', { kelas: kelas, mata_pelajaran: mapel })
    .then(res => {
      if (res && res.data && res.data.length > 0) {
        AppState.akademikList = res.data;
      }
      let list = AppState.akademikList;
      if (kelas !== 'Semua') list = list.filter(i => String(i.kelas) === String(kelas));
      if (mapel !== 'Semua') list = list.filter(i => String(i.mata_pelajaran).toLowerCase() === String(mapel).toLowerCase());
      renderTableAkademik(list);
      updateAkademikWidgets(list);
    })
    .catch(() => {
      let list = AppState.akademikList;
      if (kelas !== 'Semua') list = list.filter(i => String(i.kelas) === String(kelas));
      if (mapel !== 'Semua') list = list.filter(i => String(i.mata_pelajaran).toLowerCase() === String(mapel).toLowerCase());
      renderTableAkademik(list);
      updateAkademikWidgets(list);
    });
}

function updateAkademikWidgets(list) {
  const total = list.length;
  let sum = 0, countA = 0, countPass = 0;
  list.forEach(i => {
    const val = Number(i.nilai_akhir || i.nilai_uts) || 0;
    const kkm = Number(i.kkm) || 70;
    sum += val;
    if (i.predikat === 'A') countA++;
    if (val >= kkm) countPass++;
  });
  const avg = total > 0 ? (sum / total).toFixed(1) : 0;
  const passRate = total > 0 ? Math.round((countPass / total) * 100) + '%' : '100%';

  if (document.getElementById('widget-ak-total')) document.getElementById('widget-ak-total').innerText = total;
  if (document.getElementById('widget-ak-avg')) document.getElementById('widget-ak-avg').innerText = avg;
  if (document.getElementById('widget-ak-count-a')) document.getElementById('widget-ak-count-a').innerText = countA;
  if (document.getElementById('widget-ak-pass-rate')) document.getElementById('widget-ak-pass-rate').innerText = passRate;
}

function recalcAkademikPreview() {
  const score = Number(document.getElementById('akademik-uts')?.value) || 0;
  const kkm = Number(document.getElementById('akademik-kkm')?.value) || 70;
  
  let predikat = 'D';
  if (score >= 90) predikat = 'A';
  else if (score >= 80) predikat = 'B';
  else if (score >= kkm) predikat = 'C';

  const previewStatus = document.getElementById('akademik-preview-kkm-status');
  if (previewStatus) {
    if (score >= kkm) {
      previewStatus.innerText = `Tuntas KKM (≥${kkm})`;
      previewStatus.className = 'text-sm font-extrabold text-emerald-700';
    } else {
      previewStatus.innerText = `Di bawah KKM (<${kkm})`;
      previewStatus.className = 'text-sm font-extrabold text-rose-700';
    }
  }

  const previewPredikat = document.getElementById('akademik-preview-predikat');
  if (previewPredikat) {
    previewPredikat.innerText = predikat;
    previewPredikat.className = `inline-block px-3 py-0.5 rounded-full font-bold text-xs badge-predikat-${predikat}`;
  }
}

function editNilaiAkademikModal(id) {
  const item = AppState.akademikList.find(n => String(n.id) === String(id));
  if (!item) return;
  document.getElementById('modal-akademik-title').innerText = 'Edit Nilai Akademik';
  document.getElementById('akademik-id').value = item.id;
  document.getElementById('akademik-nis').value = item.nis;
  document.getElementById('akademik-mapel').value = item.mata_pelajaran;
  document.getElementById('akademik-kkm').value = item.kkm || 70;
  document.getElementById('akademik-uts').value = item.nilai_akhir || item.nilai_uts || 85;
  document.getElementById('akademik-catatan').value = item.capaian_kompetensi || item.catatan_guru || '';
  recalcAkademikPreview();
  document.getElementById('modal-akademik').classList.remove('hidden');
}

function submitFormAkademik(e) {
  e.preventDefault();
  const nis = document.getElementById('akademik-nis').value;
  const m = AppState.muridList.find(x => String(x.nis) === String(nis)) || {};
  const score = Number(document.getElementById('akademik-uts').value) || 0;
  const kkm = Number(document.getElementById('akademik-kkm').value) || 70;
  const mapel = document.getElementById('akademik-mapel').value;
  
  let predikat = 'D';
  if (score >= 90) predikat = 'A';
  else if (score >= 80) predikat = 'B';
  else if (score >= kkm) predikat = 'C';

  const payload = {
    id: document.getElementById('akademik-id').value || `NA-${nis}-${mapel.replace(/\s+/g, '')}`,
    nis: nis,
    nama_murid: m.nama_murid || m.nama_santri || 'Murid',
    kelas: m.kelas || 'IX ABU BAKAR',
    mata_pelajaran: mapel,
    kkm: kkm,
    nilai_tugas: score,
    nilai_uts: score,
    nilai_akhir: score,
    predikat: predikat,
    capaian_kompetensi: document.getElementById('akademik-catatan').value,
    catatan_guru: document.getElementById('akademik-catatan').value
  };

  const idx = AppState.akademikList.findIndex(x => String(x.id) === String(payload.id));
  if (idx !== -1) AppState.akademikList[idx] = payload;
  else AppState.akademikList.unshift(payload);

  showToast('Nilai akademik berhasil disimpan!');
  closeModalAkademik();
  renderTableAkademik(AppState.akademikList);
  updateAkademikWidgets(AppState.akademikList);
  loadDashboardStats();

  callApi('saveNilaiAkademik', payload);
}

function deleteAkademikAction(id) {
  if (!confirm('Yakin ingin menghapus entri nilai akademik ini?')) return;
  AppState.akademikList = AppState.akademikList.filter(x => String(x.id) !== String(id));
  showToast('Nilai akademik berhasil dihapus.');
  renderTableAkademik(AppState.akademikList);
  updateAkademikWidgets(AppState.akademikList);
  loadDashboardStats();
  callApi('deleteNilaiAkademik', { id: id });
}

  const secLeger = document.getElementById('section-kp-leger');

    secList?.classList.add('hidden');

    btnLeger?.classList.remove('text-slate-600');

    .then(res => {

      }
      let list = AppState.diniyahList;
      if (kelas !== 'Semua') list = list.filter(i => String(i.kelas) === String(kelas));
      renderTableDiniyah(list);
      updateDiniyahWidgets(list);
    })
    .catch(() => {
      let list = AppState.diniyahList;
      if (kelas !== 'Semua') list = list.filter(i => String(i.kelas) === String(kelas));
      renderTableDiniyah(list);
      updateDiniyahWidgets(list);
    });
}

function updateDiniyahWidgets(list) {
  const total = list.length;
  let sumTahfidz = 0, sumArab = 0, countMumtaz = 0;
  list.forEach(i => {
    sumTahfidz += Number(i.nilai_tahfidz) || 0;
    sumArab += Number(i.bahasa_arab) || 0;
    if (String(i.adab_harian).includes('(A)')) countMumtaz++;
  });
  const avgTahfidz = total > 0 ? (sumTahfidz / total).toFixed(1) : 0;
  const avgArab = total > 0 ? (sumArab / total).toFixed(1) : 0;
  if (document.getElementById('widget-dn-total')) document.getElementById('widget-dn-total').innerText = total;
  if (document.getElementById('widget-dn-tahfidz-avg')) document.getElementById('widget-dn-tahfidz-avg').innerText = avgTahfidz;
  if (document.getElementById('widget-dn-adab-a')) document.getElementById('widget-dn-adab-a').innerText = countMumtaz;
  if (document.getElementById('widget-dn-arab-avg')) document.getElementById('widget-dn-arab-avg').innerText = avgArab;
}

function renderTableDiniyah(list) {
  const tbody = document.getElementById('table-diniyah-body');
  if (!tbody) return;

  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="10" class="px-4 py-8 text-center text-slate-400">Tidak ada data nilai diniyah.</td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(item => {
    const nama = item.nama_murid || item.nama_santri || '-';
    return `
    <tr class="hover:bg-slate-50 transition">
      <td class="px-4 py-3">
        <div class="font-bold text-slate-900">${nama}</div>
        <div class="text-[11px] text-slate-400 font-mono">${item.nisn || item.nis}</div>
      </td>
      <td class="px-3 py-3 font-semibold text-slate-700">${item.kelas}</td>
      <td class="px-3 py-3 font-medium text-emerald-800">${item.ziyadah_juz || '-'}</td>
      <td class="px-3 py-3 font-medium text-emerald-800">${item.murojaah_juz || '-'}</td>
      <td class="px-3 py-3 text-center font-bold text-emerald-700 font-mono">${item.nilai_tahfidz}</td>
      <td class="px-3 py-3 text-center font-semibold text-emerald-800 text-xs">${item.adab_harian}</td>
      <td class="px-3 py-3 text-center font-semibold text-emerald-800 text-xs">${item.ibadah_harian}</td>
      <td class="px-3 py-3 text-center font-bold text-emerald-700 font-mono">${item.bahasa_arab}</td>
      <td class="px-4 py-3 text-slate-600 italic text-[11px] max-w-xs truncate">${item.catatan_musyrif || '-'}</td>

          <i class="fa-solid fa-pen-to-square"></i>

function loadMuridReportForPrint(nis) {
  if (!nis) return;
  AppState.activePrintNis = nis;
  
  const select = document.getElementById('rapor-murid-select');
  if (select && select.value !== nis) select.value = nis;

  const m = AppState.muridList.find(x => String(x.nis) === String(nis)) || AppState.muridList[0];
  const akItems = AppState.akademikList.filter(x => String(x.nis) === String(nis));
  let totalAk = 0;
  akItems.forEach(a => totalAk += Number(a.nilai_akhir || a.nilai_uts) || 0);
  const avgAk = akItems.length > 0 ? (totalAk / akItems.length).toFixed(1) : '86.4';
  const kp = AppState.kepemimpinanList.find(x => String(x.nis) === String(nis)) || DEMO_DATA.kepemimpinan[0];
  const dn = AppState.diniyahList.find(x => String(x.nis) === String(nis)) || DEMO_DATA.diniyah[0];

  // Render immediately with local/demo state
  renderRaporSheet({
    settings: AppState.cmsSettings,
    murid: m,
    akademik: { items: akItems, totalNilai: totalAk, rataRata: avgAk, jumlahMapel: akItems.length },
    kepemimpinan: kp,
    diniyah: dn
  });

  // Fetch updated data from backend if available
  callApi('getMuridReport', { nis: nis })
    .then(res => {
      if (res && res.success && res.data) {
        renderRaporSheet(res.data);
      }
    })
    .catch(() => {});
}

function renderRaporSheet(report) {
  const m = report.murid || report.santri || {};
  const set = report.settings || AppState.cmsSettings || {};
  const ak = report.akademik || { items: [] };
  const kp = report.kepemimpinan || {};

  const namaMurid = m.nama_murid || m.nama_santri || '-';
  if (document.getElementById('print-murid-nama')) document.getElementById('print-murid-nama').innerText = namaMurid;
  if (document.getElementById('print-murid-nisn')) document.getElementById('print-murid-nisn').innerText = m.nisn || m.nis || '-';
  if (document.getElementById('print-murid-kelas')) document.getElementById('print-murid-kelas').innerText = m.kelas || 'IX ABU BAKAR';
  if (document.getElementById('print-tahun-ajaran')) document.getElementById('print-tahun-ajaran').innerText = set.academic_year || '2025/2026';
  if (document.getElementById('print-semester')) document.getElementById('print-semester').innerText = set.semester_active || 'I (Satu)';
  if (document.getElementById('print-wali-kelas-nama')) document.getElementById('print-wali-kelas-nama').innerText = set.wali_kelas_default || 'Kahlil Gibran, S.Pd.';
  if (document.getElementById('print-ttd-wali-kelas')) document.getElementById('print-ttd-wali-kelas').innerText = set.wali_kelas_default || 'Kahlil Gibran, S.Pd.';

  // Section 1: Akademik (Tabel Nilai & Capaian Kompetensi)
  const tbodyAk = document.getElementById('print-akademik-tbody');
  if (tbodyAk) {
    if (ak.items.length === 0) {
      tbodyAk.innerHTML = `<tr><td colspan="5" class="py-3 px-3 text-center text-slate-400 italic">Belum ada input nilai akademik untuk murid ini.</td></tr>`;
    } else {
      tbodyAk.innerHTML = ak.items.map((item, idx) => `
        <tr>
          <td class="py-1.5 px-1 text-center border-r border-slate-300 font-mono">${idx + 1}</td>
          <td class="py-1.5 px-2 border-r border-slate-300 font-bold text-slate-900">${item.mata_pelajaran}</td>
          <td class="py-1.5 px-1 text-center border-r border-slate-300 font-bold text-amber-900">${item.kkm || 70}</td>
          <td class="py-1.5 px-1 text-center border-r border-slate-300 font-black text-slate-900 bg-blue-50/50">${item.nilai_akhir || item.nilai_uts}</td>
          <td class="py-1.5 px-3 text-slate-800 text-[11px] leading-tight">${item.capaian_kompetensi || item.catatan_guru || '-'}</td>
        </tr>
      `).join('');
    }
  }
  if (document.getElementById('print-akademik-avg')) document.getElementById('print-akademik-avg').innerText = ak.rataRata || '86.4';

  // Section 2: Ahlaq & Kepribadian (6 Aspek Al-Imam)
  if (document.getElementById('print-kp-ibadah')) document.getElementById('print-kp-ibadah').innerText = kp.ibadah || BANK_KEPRIBADIAN_ALIMAM.ibadah[0];
  if (document.getElementById('print-kp-akhlak')) document.getElementById('print-kp-akhlak').innerText = kp.akhlak || BANK_KEPRIBADIAN_ALIMAM.akhlak[0];
  if (document.getElementById('print-kp-kedisiplinan')) document.getElementById('print-kp-kedisiplinan').innerText = kp.kedisiplinan_kerajinan || kp.kedisiplinan || BANK_KEPRIBADIAN_ALIMAM.kedisiplinan[0];
  if (document.getElementById('print-kp-kerapihan')) document.getElementById('print-kp-kerapihan').innerText = kp.kerapihan_kebersihan || BANK_KEPRIBADIAN_ALIMAM.kerapihan[0];
  if (document.getElementById('print-kp-kepemimpinan')) document.getElementById('print-kp-kepemimpinan').innerText = kp.kepemimpinan || BANK_KEPRIBADIAN_ALIMAM.kepemimpinan[0];
  if (document.getElementById('print-kp-kerjasama')) document.getElementById('print-kp-kerjasama').innerText = kp.kerjasama || BANK_KEPRIBADIAN_ALIMAM.kerjasama[0];

  // Section 3: Kehadiran (S, I, A) & Ekskul
  if (document.getElementById('print-absen-s')) document.getElementById('print-absen-s').innerText = m.kehadiran_s ?? 0;
  if (document.getElementById('print-absen-i')) document.getElementById('print-absen-i').innerText = m.kehadiran_i ?? 0;
  if (document.getElementById('print-absen-a')) document.getElementById('print-absen-a').innerText = m.kehadiran_a ?? 0;

  if (document.getElementById('print-ekskul-1')) document.getElementById('print-ekskul-1').innerText = m.ekskul_1 || 'Pramuka';
  if (document.getElementById('print-ekskul-2')) document.getElementById('print-ekskul-2').innerText = m.ekskul_2 || 'Wushu';
  if (document.getElementById('print-ekskul-3')) document.getElementById('print-ekskul-3').innerText = m.ekskul_3 || 'Futsal';

  // Section 4: Catatan yg Diperhatikan
  if (document.getElementById('print-kp-catatan')) {
    document.getElementById('print-kp-catatan').innerText = `"${kp.catatan_diperhatikan || kp.catatan_pembina || BANK_KEPRIBADIAN_ALIMAM.catatan_diperhatikan[0]}"`;
  }

  // Signatures
  if (document.getElementById('print-report-place')) document.getElementById('print-report-place').innerText = set.report_place || 'Bogor';
  if (document.getElementById('print-report-date')) document.getElementById('print-report-date').innerText = set.report_date || '17 Oktober 2025';
  if (document.getElementById('print-headmaster-name')) document.getElementById('print-headmaster-name').innerText = set.headmaster_name || 'Ust. Ahmad Fauzi, M.Pd.';
  if (document.getElementById('print-headmaster-nip')) document.getElementById('print-headmaster-nip').innerText = set.headmaster_nip ? `NIP. ${set.headmaster_nip}` : 'NIP. 198204152008011005';
}

function triggerInitDb() {
  if (!confirm('Inisialisasi ulang database Google Sheets akan memastikan seluruh skema sheet dan data seed default Al-Imam terpasang. Lanjutkan?')) return;
  
  showToast('Menginisialisasi skema sheet Google Sheets...', 'info');
  AppState.cmsSettings = { ...DEMO_DATA.settings };
  AppState.muridList = [...DEMO_DATA.murid];
  AppState.akademikList = [...DEMO_DATA.akademik];
  AppState.kepemimpinanList = [...DEMO_DATA.kepemimpinan];
  AppState.diniyahList = [...DEMO_DATA.diniyah];
  AppState.usersList = [...DEMO_DATA.users];

  applyCmsTheme(AppState.cmsSettings);
  populateMuridDropdowns();
  renderMuridTable(AppState.muridList);
  renderTableUsers(AppState.usersList);
  loadDashboardStats();

  callApi('initDatabase')
    .then(res => {
      showToast('Database Google Sheets berhasil disinkronkan!', 'success');

}

// 17. MOBILE SIDEBAR TOGGLE
function toggleSidebar() {
  const sidebar = document.getElementById('app-sidebar');
  const backdrop = document.getElementById('sidebar-backdrop');
  if (!sidebar) return;
  sidebar.classList.toggle('-translate-x-full');
  if (backdrop) backdrop.classList.toggle('hidden');
}

// 18. INTERACTIVE ONBOARDING GUIDE TOUR
let currentGuideStep = 1;
const TOTAL_GUIDE_STEPS = 8;

function openInteractiveGuide(step = 1) {
  currentGuideStep = step;
  const modal = document.getElementById('modal-interactive-guide');
  if (modal) {
    modal.classList.remove('hidden');
    renderGuideStep(currentGuideStep);
  }
}

function closeInteractiveGuide(dismissForever = false) {
  const modal = document.getElementById('modal-interactive-guide');
  if (modal) modal.classList.add('hidden');
  if (dismissForever) {
    localStorage.setItem('rapor_guide_dismissed', 'true');
    showToast('Panduan ditutup. Anda dapat membukanya kembali kapan saja melalui tombol di navbar.', 'info');
  }
}

function changeGuideStep(delta) {
  const nextStep = currentGuideStep + delta;
  if (nextStep < 1) return;
  if (nextStep > TOTAL_GUIDE_STEPS) {
    closeInteractiveGuide(true);
    showToast('Alhamdulillah! Anda telah menyelesaikan panduan penggunaan sistem.', 'success');
    return;
  }
  currentGuideStep = nextStep;
  renderGuideStep(currentGuideStep);
}

function renderGuideStep(step) {
  const counter = document.getElementById('guide-step-counter');
  if (counter) counter.innerText = `Langkah ${step} dari ${TOTAL_GUIDE_STEPS}`;
  
  const progressFill = document.getElementById('guide-progress-fill');
  if (progressFill) progressFill.style.width = `${(step / TOTAL_GUIDE_STEPS) * 100}%`;

  document.querySelectorAll('.guide-step-card').forEach(card => {
    if (parseInt(card.getAttribute('data-step')) === step) {
      card.classList.remove('hidden');
    } else {
      card.classList.add('hidden');
    }
  });

  const btnPrev = document.getElementById('btn-guide-prev');
  const btnNext = document.getElementById('btn-guide-next');
  if (btnPrev) {
    if (step === 1) btnPrev.classList.add('hidden');
    else btnPrev.classList.remove('hidden');
  }
  if (btnNext) {
    if (step === TOTAL_GUIDE_STEPS) {
      btnNext.innerHTML = '<span>Mulai Gunakan Aplikasi</span> <i class="fa-solid fa-check text-xs"></i>';
      btnNext.className = 'px-4 py-2 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl shadow-md transition flex items-center gap-1.5';
    } else {
      btnNext.innerHTML = '<span>Selanjutnya</span> <i class="fa-solid fa-arrow-right text-[10px]"></i>';
      btnNext.className = 'px-4 py-2 text-xs font-bold text-white bg-theme-primary hover:opacity-90 rounded-xl shadow-md transition flex items-center gap-1.5';
    }
  }
}

function switchViewAndHighlight(viewName) {
  switchView(viewName);
  closeInteractiveGuide(false);
  const titles = {
    'dashboard': 'Dashboard Beranda',
    'akademik': 'Nilai Akademik',
    'kepemimpinan': 'Ahlaq & Kepribadian',
    'diniyah': 'Nilai Diniyah & Tahfidz',
    'murid': 'Data Siswa & Presensi',
    'rapor': 'Cetak Rapor Portofolio',
    'cms': 'Pengaturan CMS'
  };
  showToast(`💡 Anda berada di modul: ${titles[viewName] || viewName}. Klik 'Panduan' di navbar untuk membuka kembali tour.`);
}

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('btn-toggle-sidebar')?.addEventListener('click', toggleSidebar);
  document.getElementById('btn-close-sidebar')?.addEventListener('click', toggleSidebar);

  // Instantly apply demo/default state
  applyCmsTheme(AppState.cmsSettings);
  populateMuridDropdowns();
  renderMuridTable(AppState.muridList);
  renderTableUsers(AppState.usersList);
  loadDashboardStats();

  // Background fetch from Google Sheets
  loadCmsSettings();
  loadMuridList();

  if (localStorage.getItem('rapor_guide_dismissed') !== 'true') {
    setTimeout(() => {
      openInteractiveGuide(1);
    }, 1200);
  }
});
