function loadMuridReportForPrint(nis) {
  if (!nis) return;
  const cleanNis = String(nis).trim();
  AppState.activePrintNis = cleanNis;
  
  const select = document.getElementById('rapor-murid-select');
  if (select && select.value !== cleanNis) select.value = cleanNis;

  let m = AppState.muridList.find(x => 
    String(x.nis || '').trim() === cleanNis || 
    String(x.nisn || '').trim() === cleanNis ||
    String(x.id || '').trim() === cleanNis
  );
  if (!m && AppState.muridList.length > 0) {
    m = AppState.muridList[0];
  }
  if (!m) m = {};

  const normalizedMurid = {
    ...m,
    nis: m.nis || cleanNis,
    nisn: m.nisn || '-',
    nama_murid: m.nama_murid || m.nama_santri || m.nama || m.nama_lengkap || '-',
    nama_santri: m.nama_murid || m.nama_santri || m.nama || m.nama_lengkap || '-',
    kelas: m.kelas || 'IX ABU BAKAR',
    no_urut: m.no_urut || m.no || (AppState.muridList.findIndex(x => String(x.nis).trim() === cleanNis) + 1) || 1
  };

  // Get all 16 subjects in order
  let akItems = [];
  let totalAk = 0;
  MAPEL_LIST_16.forEach(mapel => {
    const existing = AppState.akademikList.find(a => 
      String(a.nis || '').trim() === cleanNis && a.mata_pelajaran === mapel
    );
    if (existing) {
      akItems.push(existing);
      totalAk += Number(existing.nilai_akhir || existing.nilai_uts || existing.nilai) || 0;
    }
  });

  // Fallback if no specific akademik items found in AppState
  if (akItems.length === 0) {
    const rawStudent = (typeof EXCEL_STUDENTS_VII_UTSMAN !== 'undefined' ? EXCEL_STUDENTS_VII_UTSMAN.find(s => String(s.nis).trim() === cleanNis) : null) ||
                      (typeof EXCEL_STUDENTS_VII_AISYAH !== 'undefined' ? EXCEL_STUDENTS_VII_AISYAH.find(s => String(s.nis).trim() === cleanNis) : null) ||
                      (typeof EXCEL_STUDENTS_VII_MBU !== 'undefined' ? EXCEL_STUDENTS_VII_MBU.find(s => String(s.nis).trim() === cleanNis) : null) ||
                      (typeof EXCEL_STUDENTS_VIII_UMAR !== 'undefined' ? EXCEL_STUDENTS_VIII_UMAR.find(s => String(s.nis).trim() === cleanNis) : null) ||
                      (typeof EXCEL_STUDENTS_VIII_KHODIJAH !== 'undefined' ? EXCEL_STUDENTS_VIII_KHODIJAH.find(s => String(s.nis).trim() === cleanNis) : null) ||
                      (typeof EXCEL_STUDENTS_IX_ABU_BAKAR !== 'undefined' ? EXCEL_STUDENTS_IX_ABU_BAKAR.find(s => String(s.nis).trim() === cleanNis) : null) ||
                      (typeof EXCEL_STUDENTS_IX_UMMU_SALAMAH !== 'undefined' ? EXCEL_STUDENTS_IX_UMMU_SALAMAH.find(s => String(s.nis).trim() === cleanNis) : null);
    
    MAPEL_LIST_16.forEach((mapel, mapelIdx) => {
      const score = (rawStudent && rawStudent.scores && rawStudent.scores[mapelIdx]) ? rawStudent.scores[mapelIdx] : (82 + ((mapelIdx * 3) % 15));
      const kkm = MAPEL_KKM_DEFAULT[mapel] || 75;
      const capTemplate = BANK_CAPAIAN_MAPEL[mapel] || BANK_CAPAIAN_MAPEL['Akidah'];
      const capaian = score >= 90 ? capTemplate.tinggi : (score >= kkm ? capTemplate.sedang : capTemplate.cukup);
      akItems.push({
        id: `AK-${cleanNis}-${mapelIdx}`,
        nis: cleanNis,
        nama_murid: normalizedMurid.nama_murid,
        kelas: normalizedMurid.kelas,
        mata_pelajaran: mapel,
        nilai_akhir: score,
        nilai_uts: score,
        capaian_kompetensi: capaian,
        tahun_ajaran: AppState.cmsSettings.academic_year || '2026/2027',
        semester: AppState.cmsSettings.semester_active || 'I (Satu)'
      });
      totalAk += score;
    });
  }

  const avgAk = akItems.length > 0 ? (totalAk / akItems.length).toFixed(1) : '85.0';
  const kp = AppState.kepemimpinanList.find(x => String(x.nis || '').trim() === cleanNis) || DEMO_DATA.kepemimpinan[0] || {};
  const skl = AppState.sklList.find(x => String(x.nis || '').trim() === cleanNis) || (DEMO_DATA.skl && DEMO_DATA.skl[0]) || { scores: {}, catatan_walas: '' };
  const dn = AppState.diniyahList.find(x => String(x.nis || '').trim() === cleanNis) || DEMO_DATA.diniyah[0] || {};

  const localReport = {
    settings: AppState.cmsSettings,
    murid: normalizedMurid,
    santri: normalizedMurid,
    akademik: { items: akItems, totalNilai: totalAk, rataRata: avgAk, jumlahMapel: akItems.length },
    kepemimpinan: kp,
    kepribadian: kp,
    skl: skl,
    diniyah: dn
  };

  // Render immediately with local precomputed state
  renderRaporSheet(localReport);
  renderRaporKepemimpinanSheet(localReport);

  // Background fetch from backend if available
  callApi('getMuridReport', { nis: cleanNis })
    .then(res => {
      if (res && res.success && res.data && typeof res.data === 'object' && !Array.isArray(res.data)) {
        const backendMurid = res.data.murid || res.data.santri;
        if (backendMurid && (backendMurid.nama_murid || backendMurid.nama_santri || backendMurid.nama || backendMurid.nama_lengkap)) {
          const mergedMurid = {
            ...normalizedMurid,
            ...backendMurid,
            nama_murid: backendMurid.nama_murid || backendMurid.nama_santri || backendMurid.nama || backendMurid.nama_lengkap || normalizedMurid.nama_murid,
            nisn: backendMurid.nisn || normalizedMurid.nisn,
            kelas: backendMurid.kelas || normalizedMurid.kelas,
            no_urut: backendMurid.no_urut || normalizedMurid.no_urut
          };
          const backendAk = res.data.akademik;
          const mergedAk = (backendAk && backendAk.items && backendAk.items.length > 0) ? backendAk : localReport.akademik;
          
          const mergedReport = {
            ...localReport,
            ...res.data,
            murid: mergedMurid,
            santri: mergedMurid,
            akademik: mergedAk,
            kepemimpinan: res.data.kepemimpinan || res.data.kepribadian || localReport.kepemimpinan,
            skl: res.data.skl || localReport.skl,
            diniyah: res.data.diniyah || localReport.diniyah
          };
          renderRaporSheet(mergedReport);
          renderRaporKepemimpinanSheet(mergedReport);
        }
      }
    })
    .catch(() => {});
}

  const tahunAjaran = document.getElementById('filter-rapor-tahun-ajaran')?.value || set.academic_year || '2026/2027';

  const waliKelasMurid = m.wali_kelas || WALI_KELAS_MAP[kelasMurid] || set.wali_kelas_default || 'Kahlil Gibran, S.Pd.';

  if (document.getElementById('print-report-place')) document.getElementById('print-report-place').innerText = set.report_place || 'Bogor';

// 18. INTERACTIVE ONBOARDING GUIDE TOUR
let currentGuideStep = 1;
const TOTAL_GUIDE_STEPS = 8;

function openInteractiveGuide(step = 1) {
  currentGuideStep = step;
  const modal = document.getElementById('modal-interactive-guide');
  if (modal) {
    modal.classList.remove('hidden');
    renderGuideStep(currentGuideStep);
  }
}

function closeInteractiveGuide(dismissForever = false) {
  const modal = document.getElementById('modal-interactive-guide');
  if (modal) modal.classList.add('hidden');
  if (dismissForever) {
    localStorage.setItem('rapor_guide_dismissed', 'true');
    showToast('Panduan ditutup. Anda dapat membukanya kembali kapan saja melalui tombol di navbar.', 'info');
  }
}

function goToGuideStep(step) {
  if (step < 1 || step > TOTAL_GUIDE_STEPS) return;
  currentGuideStep = step;
  renderGuideStep(currentGuideStep);
}

function changeGuideStep(delta) {
  const nextStep = currentGuideStep + delta;
  if (nextStep < 1) return;
  if (nextStep > TOTAL_GUIDE_STEPS) {
    closeInteractiveGuide(true);
    showToast('Alhamdulillah! Anda telah menyelesaikan panduan penggunaan sistem.', 'success');
    return;
  }
  currentGuideStep = nextStep;
  renderGuideStep(currentGuideStep);
}

function renderGuideStep(step) {
  const counter = document.getElementById('guide-step-counter');
  if (counter) counter.innerText = `Langkah ${step} dari ${TOTAL_GUIDE_STEPS}`;
  
  const progressFill = document.getElementById('guide-progress-fill');
  if (progressFill) progressFill.style.width = `${(step / TOTAL_GUIDE_STEPS) * 100}%`;

  document.querySelectorAll('.guide-step-card').forEach(card => {
    if (parseInt(card.getAttribute('data-step')) === step) {
      card.classList.remove('hidden');
    } else {
      card.classList.add('hidden');
    }
  });

  document.querySelectorAll('.guide-tab-pill').forEach(pill => {
    if (parseInt(pill.getAttribute('data-tab-step')) === step) {
      pill.className = 'guide-tab-pill px-2.5 py-1 rounded-lg transition whitespace-nowrap bg-blue-500 text-white shadow font-bold';
    } else {
      pill.className = 'guide-tab-pill px-2.5 py-1 rounded-lg transition whitespace-nowrap bg-slate-800/80 text-slate-300 hover:bg-slate-700';
    }
  });

  const btnPrev = document.getElementById('btn-guide-prev');
  const btnNext = document.getElementById('btn-guide-next');
  if (btnPrev) {
    if (step === 1) btnPrev.classList.add('hidden');
    else btnPrev.classList.remove('hidden');
  }
  if (btnNext) {
    if (step === TOTAL_GUIDE_STEPS) {
      btnNext.innerHTML = '<span>Mulai Gunakan Aplikasi</span> <i class="fa-solid fa-check text-xs"></i>';
      btnNext.className = 'px-4 py-2 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl shadow-md transition flex items-center gap-1.5';
    } else {
      btnNext.innerHTML = '<span>Selanjutnya</span> <i class="fa-solid fa-arrow-right text-[10px]"></i>';
      btnNext.className = 'px-4 py-2 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-md transition flex items-center gap-1.5';
    }
  }
}
