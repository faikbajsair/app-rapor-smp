// 1. GLOBAL STATE
const AppState = {
  currentUser: {
    id: 'USR-001',
    username: 'admin',
    nama_lengkap: 'Administrator Utama',
    role: 'admin'
  },
  currentView: 'dashboard',
  cmsSettings: {},
  santriList: [],
  akademikList: [],
  kepemimpinanList: [],
  diniyahList: [],
  usersList: [],
  activePrintNis: null
};

// 2. API CALL WRAPPER (Auto-detect google.script.run or Fetch REST)
function callApi(actionName, payload = {}) {
  return new Promise((resolve, reject) => {
    // Mode Google Apps Script (HTMLService)
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      const runner = google.script.run
        .withSuccessHandler(response => resolve(response))
        .withFailureHandler(error => {
          console.error('API Error:', error);
          reject(error);
        });
      
      switch (actionName) {
        case 'initDatabase': runner.apiInitDatabase(); break;
        case 'login': runner.apiLogin(payload.username, payload.password); break;
        case 'getSettings': runner.apiGetSettings(); break;
        case 'updateSettings': runner.apiUpdateSettings(payload); break;
        case 'getSummaryStats': runner.apiGetSummaryStats(); break;
        case 'getSantri': runner.apiGetSantri(payload.kelas); break;
        case 'saveSantri': runner.apiSaveSantri(payload); break;
        case 'deleteSantri': runner.apiDeleteSantri(payload.nis); break;
        case 'getUsers': runner.apiGetUsers(); break;
        case 'saveUser': runner.apiSaveUser(payload); break;
        case 'deleteUser': runner.apiDeleteUser(payload.id); break;
        case 'getNilaiAkademik': runner.apiGetNilaiAkademik(payload); break;
        case 'saveNilaiAkademik': runner.apiSaveNilaiAkademik(payload); break;
        case 'deleteNilaiAkademik': runner.apiDeleteNilaiAkademik(payload.id); break;
        case 'getNilaiKepemimpinan': runner.apiGetNilaiKepemimpinan(payload); break;
        case 'saveNilaiKepemimpinan': runner.apiSaveNilaiKepemimpinan(payload); break;
        case 'deleteNilaiKepemimpinan': runner.apiDeleteNilaiKepemimpinan(payload.id); break;
        case 'getNilaiDiniyah': runner.apiGetNilaiDiniyah(payload); break;
        case 'saveNilaiDiniyah': runner.apiSaveNilaiDiniyah(payload); break;
        case 'deleteNilaiDiniyah': runner.apiDeleteNilaiDiniyah(payload.id); break;
        case 'getSantriReport': runner.apiGetSantriReport(payload.nis); break;
        default:
          reject(new Error('Unknown action: ' + actionName));
      }
    } else {
      // Mode Standalone / Vercel Client (Fallback Fetch API)
      const apiUrl = window.APPS_SCRIPT_API_URL || '';
      if (!apiUrl) {
        // Mock fallback for direct preview
        console.warn('Running in Mock/Preview mode. Setting up local response for:', actionName);
        resolve({ success: true, message: 'Simulasi berhasil (Mock data)', data: [] });
        return;
      }
      
      fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: actionName, payload: payload })
      })
      .then(res => res.json())
      .then(data => resolve(data))
      .catch(err => reject(err));
    }
  });
}

// 3. TOAST NOTIFICATION SYSTEM
function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  if (!container) return;

  const toast = document.createElement('div');
  const colors = {
    success: 'bg-slate-900 border-emerald-500 text-white',
    error: 'bg-rose-900 border-rose-500 text-white',
    info: 'bg-blue-900 border-blue-500 text-white'
  };
  const icons = {
    success: 'fa-solid fa-circle-check text-emerald-400',
    error: 'fa-solid fa-triangle-exclamation text-rose-400',
    info: 'fa-solid fa-circle-info text-blue-400'
  };

  toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl border shadow-xl text-xs font-semibold transform transition-all duration-300 translate-y-2 opacity-0 ${colors[type] || colors.success}`;
  toast.innerHTML = `
    <i class="${icons[type] || icons.success} text-base"></i>
    <span>${message}</span>
  `;

  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.remove('translate-y-2', 'opacity-0');
  }, 10);

  setTimeout(() => {
    toast.classList.add('opacity-0', 'translate-y-2');
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

// 4. VIEW ROUTING & ROLE PERMISSION
function switchView(viewName) {
  // Permission guard check
  const role = AppState.currentUser.role;
  if (role !== 'admin') {
    if (viewName === 'cms' || (role === 'santri' && (viewName === 'akademik' || viewName === 'kepemimpinan' || viewName === 'diniyah' || viewName === 'santri'))) {
      showToast('Akses ditolak: Role Anda tidak memiliki izin untuk halaman ini.', 'error');
      return;
    }
  }

  // Update State
  AppState.currentView = viewName;

  // Toggle visible view panel
  document.querySelectorAll('.view-panel').forEach(panel => {
    panel.classList.add('hidden');
  });
  const activePanel = document.getElementById('view-' + viewName);
  if (activePanel) {
    activePanel.classList.remove('hidden');
  }

  // Update Sidebar Active Class
  document.querySelectorAll('.sidebar-nav-link').forEach(link => {
    link.classList.remove('bg-slate-800', 'text-white');
    link.classList.add('text-slate-300');
  });
  const activeLink = document.getElementById('nav-item-' + viewName);
  if (activeLink) {
    activeLink.classList.add('bg-slate-800', 'text-white');
    activeLink.classList.remove('text-slate-300');
  }

  // Close mobile sidebar if opened
  const sidebar = document.getElementById('app-sidebar');
  const backdrop = document.getElementById('sidebar-backdrop');
  if (sidebar && !sidebar.classList.contains('-translate-x-full')) {
    sidebar.classList.add('-translate-x-full');
    if (backdrop) backdrop.classList.add('hidden');
  }

  // Auto-fetch data on view activation
  switch (viewName) {
    case 'dashboard': loadDashboardStats(); break;
    case 'akademik': loadNilaiAkademik(); break;
    case 'kepemimpinan': loadNilaiKepemimpinan(); break;
    case 'diniyah': loadNilaiDiniyah(); break;
    case 'santri': loadSantriList(); break;
    case 'cms': loadCmsSettings(); break;
    case 'rapor':
      if (AppState.activePrintNis) {
        loadSantriReportForPrint(AppState.activePrintNis);
      } else if (AppState.santriList.length > 0) {
        loadSantriReportForPrint(AppState.santriList[0].nis);
      }
      break;
  }
}

// 5. ROLE SWITCHER SIMULATOR (for testing and demo)
function toggleRoleDropdown() {
  const el = document.getElementById('dropdown-role-switcher');
  if (el) el.classList.toggle('hidden');
}

function setSimulatedRole(role) {
  const roleNames = {
    admin: 'Admin / CMS',
    guru_akademik: 'Guru Akademik',
    pembina_kepemimpinan: 'Pembina Kepemimpinan',
    pembina_diniyah: 'Pembina Diniyah',
    santri: 'Santri / Wali'
  };

  AppState.currentUser.role = role;
  AppState.currentUser.nama_lengkap = roleNames[role] || 'Pengguna';

  document.getElementById('nav-user-role-badge').innerText = roleNames[role] || role;
  document.getElementById('nav-user-name').innerText = roleNames[role];
  document.getElementById('nav-user-avatar').innerText = role.charAt(0).toUpperCase();

  // Hide/Show Admin Only Menus
  const adminElements = document.querySelectorAll('.menu-admin-only');
  adminElements.forEach(el => {
    if (role === 'admin') el.classList.remove('hidden');
    else el.classList.add('hidden');
  });

  const dropdown = document.getElementById('dropdown-role-switcher');
  if (dropdown) dropdown.classList.add('hidden');

  showToast(`Beralih ke tampilan role: ${roleNames[role]}`, 'info');
  switchView('dashboard');
}

// 6. THEME & CMS APPLICATION
function applyCmsTheme(settings) {
  if (!settings) return;
  AppState.cmsSettings = settings;

  const root = document.documentElement;
  if (settings.theme_primary_color) {
    root.style.setProperty('--primary-color', settings.theme_primary_color);
  }
  if (settings.theme_secondary_color) {
    root.style.setProperty('--secondary-color', settings.theme_secondary_color);
  }
  if (settings.theme_accent_color) {
    root.style.setProperty('--accent-color', settings.theme_accent_color);
  }

  // Update Navbar & Headings
  const schoolName = settings.school_name || 'SMP Al-Imam Islamic School (AI IS)';
  const logoUrl = settings.school_logo_url || 'https://alimamischool.com/wp-content/uploads/2020/08/Al-Imam-Islamic-School-alimamischool.com-sekolah-sunnah-logo.png';

  const navLogo = document.getElementById('nav-school-logo');
  if (navLogo) navLogo.src = logoUrl;
  const navName = document.getElementById('nav-school-name');
  if (navName) navName.innerText = schoolName;

  const homeWelcome = document.getElementById('home-welcome-school');
  if (homeWelcome) homeWelcome.innerText = schoolName;

  const navYear = document.getElementById('nav-academic-year');
  if (navYear) navYear.innerText = settings.academic_year || '2025/2026';
  const navSem = document.getElementById('nav-semester');
  if (navSem) navSem.innerText = settings.semester_active || 'Ganjil';

  // Update Print Kop
  const printLogo = document.getElementById('print-school-logo');
  if (printLogo) printLogo.src = logoUrl;
  const printName = document.getElementById('print-school-name');
  if (printName) printName.innerText = schoolName;
  const printAddress = document.getElementById('print-school-address');
  if (printAddress) printAddress.innerText = `${settings.school_address || ''} | Telp: ${settings.school_phone || ''}`;
  const printWeb = document.getElementById('print-school-contact');
  if (printWeb) printWeb.innerText = `Website: ${settings.school_website || ''}`;
  const printFooter = document.getElementById('print-footer-motto');
  if (printFooter) printFooter.innerText = settings.report_footer_text || '';
}

// 7. DASHBOARD STATS & 3-WAY CATEGORY SWITCHER (AKADEMIK, DINIYAH, KEPEMIMPINAN)
let activeDashboardTab = 'Akademik';

function switchDashboardTab(tabName) {
  activeDashboardTab = tabName;
  
  // Hide all category panels
  document.querySelectorAll('.dash-category-panel').forEach(p => p.classList.add('hidden'));
  
  // Reset buttons
  ['Akademik', 'Diniyah', 'Kepemimpinan'].forEach(name => {
    const btn = document.getElementById('dashTabBtn' + name);
    if (btn) {
      btn.className = 'flex-1 sm:flex-initial flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-xs font-bold transition-all duration-200 text-slate-600 hover:text-slate-900';
    }
  });

  // Activate selected panel & button
  const activePanel = document.getElementById('dashPanel' + tabName);
  if (activePanel) activePanel.classList.remove('hidden');

  const activeBtn = document.getElementById('dashTabBtn' + tabName);
  const colorClasses = {
    'Akademik': 'bg-white text-blue-700 shadow-sm',
    'Diniyah': 'bg-white text-emerald-700 shadow-sm',
    'Kepemimpinan': 'bg-white text-amber-700 shadow-sm'
  };
  if (activeBtn) {
    activeBtn.className = `flex-1 sm:flex-initial flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-xs font-bold transition-all duration-200 ${colorClasses[tabName] || 'bg-white text-slate-900 shadow-sm'}`;
  }

  // Titles
  const titles = {
    'Akademik': { title: 'Dashboard Akademik', subtitle: 'Status rekapitulasi nilai mata pelajaran umum, tugas, UTS, dan statistik ketuntasan KKM.' },
    'Diniyah': { title: 'Dashboard Diniyah & Tahfidz', subtitle: 'Status capaian hafalan Al-Qur\'an Ziyadah, Muroja\'ah Mutqin, Adab, dan Bahasa Arab.' },
    'Kepemimpinan': { title: 'Dashboard Kepemimpinan & Karakter', subtitle: 'Status kedisiplinan, keorganisasian, adab pergaulan, dan kemandirian santri asrama.' }
  };

  if (document.getElementById('dashboardTitle')) document.getElementById('dashboardTitle').innerText = titles[tabName].title;
  if (document.getElementById('dashboardSubtitle')) document.getElementById('dashboardSubtitle').innerText = titles[tabName].subtitle;

  loadDashboardStats();
}

function loadDashboardStats() {
  callApi('getSummaryStats')
    .then(res => {
      updateDashboardWithStats(res && res.stats ? res.stats : null);
    })
    .catch(err => {
      console.warn('Dashboard stats fallback:', err);
      updateDashboardWithStats(null);
    });
}

function updateDashboardWithStats(stats) {
  const totalSantri = AppState.santriList.length || 12;
  const akList = AppState.akademikList;
  const dnList = AppState.diniyahList;
  const kpList = AppState.kepemimpinanList;

  // 1. KPI Akademik
  let akSum = 0, akCountA = 0, akPass = 0;
  akList.forEach(a => {
    const val = Number(a.nilai_akhir) || 0;
    akSum += val;
    if (a.predikat === 'A') akCountA++;
    if (val >= 75) akPass++;
  });
  const akAvg = akList.length > 0 ? (akSum / akList.length).toFixed(1) : (stats?.avgAkademik || '89.2');
  const akKkmRate = akList.length > 0 ? Math.round((akPass / akList.length) * 100) + '%' : '100%';

  if (document.getElementById('kpi-ak-santri')) document.getElementById('kpi-ak-santri').innerText = totalSantri;
  if (document.getElementById('kpi-ak-avg')) document.getElementById('kpi-ak-avg').innerText = akAvg;
  if (document.getElementById('kpi-ak-kkm')) document.getElementById('kpi-ak-kkm').innerText = akKkmRate;
  if (document.getElementById('kpi-ak-total')) document.getElementById('kpi-ak-total').innerText = akList.length || 30;

  // 2. KPI Diniyah
  let dnSumTahfidz = 0, dnSumArab = 0, dnAdabMumtaz = 0;
  dnList.forEach(d => {
    dnSumTahfidz += Number(d.nilai_tahfidz) || 0;
    dnSumArab += Number(d.bahasa_arab) || 0;
    if (String(d.adab_harian).includes('(A)')) dnAdabMumtaz++;
  });
  const dnAvgTahfidz = dnList.length > 0 ? (dnSumTahfidz / dnList.length).toFixed(1) : '91.5';
  const dnAvgArab = dnList.length > 0 ? (dnSumArab / dnList.length).toFixed(1) : '89.3';

  if (document.getElementById('kpi-dn-santri')) document.getElementById('kpi-dn-santri').innerText = totalSantri;
  if (document.getElementById('kpi-dn-avg-tahfidz')) document.getElementById('kpi-dn-avg-tahfidz').innerText = dnAvgTahfidz;
  if (document.getElementById('kpi-dn-adab-mumtaz')) document.getElementById('kpi-dn-adab-mumtaz').innerText = (dnAdabMumtaz || 9) + ' Santri';
  if (document.getElementById('kpi-dn-avg-arab')) document.getElementById('kpi-dn-avg-arab').innerText = dnAvgArab;

  // 3. KPI Kepemimpinan
  let kpDisiplinA = 0, kpOrgA = 0, kpGood = 0;
  kpList.forEach(k => {
    if (String(k.kedisiplinan).includes('(A)')) kpDisiplinA++;
    if (String(k.organisasi).includes('(A)')) kpOrgA++;
    if (String(k.karakter_adab).includes('(A)') || String(k.karakter_adab).includes('(B)')) kpGood++;
  });
  const kpRate = kpList.length > 0 ? Math.round((kpGood / kpList.length) * 100) + '%' : '100%';

  if (document.getElementById('kpi-kp-santri')) document.getElementById('kpi-kp-santri').innerText = totalSantri;
  if (document.getElementById('kpi-kp-disiplin-a')) document.getElementById('kpi-kp-disiplin-a').innerText = (kpDisiplinA || 7) + ' Santri';
  if (document.getElementById('kpi-kp-organisasi-a')) document.getElementById('kpi-kp-organisasi-a').innerText = (kpOrgA || 6) + ' Santri';
  if (document.getElementById('kpi-kp-karakter-rate')) document.getElementById('kpi-kp-karakter-rate').innerText = kpRate;

  // Update Badges on Sidebar
  if (document.getElementById('badge-count-akademik')) document.getElementById('badge-count-akademik').innerText = akList.length || 30;
  if (document.getElementById('badge-count-kepemimpinan')) document.getElementById('badge-count-kepemimpinan').innerText = kpList.length || 12;
  if (document.getElementById('badge-count-diniyah')) document.getElementById('badge-count-diniyah').innerText = dnList.length || 12;

  // Render Mini-Tables on Dashboard
  renderDashboardMiniTables();
}

        <td class="py-2 px-3 text-slate-700">${i.mata_pelajaran}</td>
        <td class="py-2 px-2 text-center font-mono">${i.nilai_tugas}</td>
        <td class="py-2 px-2 text-center font-mono">${i.nilai_uts}</td>
        <td class="py-2 px-2 text-center font-mono font-bold text-slate-900">${i.nilai_akhir}</td>
        <td class="py-2 px-2 text-center"><span class="badge-predikat-${i.predikat} px-2 py-0.5 rounded-full text-[10px] font-bold">${i.predikat}</span></td>
      </tr>
    `).join('');
  }

  // Diniyah Mini Table (Top 6)
  const tbodyDn = document.getElementById('dash-diniyah-tbody');
  if (tbodyDn) {
    const items = AppState.diniyahList.slice(0, 6);
    tbodyDn.innerHTML = items.map(i => `
      <tr class="hover:bg-slate-50 transition">
        <td class="py-2 px-3 font-semibold text-slate-900">${i.nama_santri} <span class="text-[10px] text-slate-400">(${i.kelas})</span></td>
        <td class="py-2 px-3 text-emerald-800 font-medium">${i.ziyadah_juz}</td>
        <td class="py-2 px-3 text-teal-800 font-medium">${i.murojaah_juz}</td>
        <td class="py-2 px-2 text-center font-mono font-bold text-slate-900">${i.nilai_tahfidz}</td>
        <td class="py-2 px-2 text-center text-[11px] text-slate-700">${i.adab_harian}</td>
        <td class="py-2 px-2 text-center font-mono font-bold text-slate-900">${i.bahasa_arab}</td>
      </tr>
    `).join('');
  }

  // Kepemimpinan Mini Table (Top 6)
  const tbodyKp = document.getElementById('dash-kepemimpinan-tbody');
  if (tbodyKp) {
    const items = AppState.kepemimpinanList.slice(0, 6);
    tbodyKp.innerHTML = items.map(i => `
      <tr class="hover:bg-slate-50 transition">
        <td class="py-2 px-3 font-semibold text-slate-900">${i.nama_santri} <span class="text-[10px] text-slate-400">(${i.kelas})</span></td>
        <td class="py-2 px-3 text-xs text-slate-700">${i.kedisiplinan}</td>
        <td class="py-2 px-3 text-xs text-slate-700">${i.organisasi}</td>
        <td class="py-2 px-3 text-xs text-slate-700">${i.karakter_adab}</td>
        <td class="py-2 px-3 text-xs text-slate-700">${i.inisiatif_kemandirian}</td>
      </tr>
    `).join('');
  }
}

// 8. SANTRI MANAGEMENT
function loadSantriList() {
  const kelas = document.getElementById('filter-santri-kelas')?.value || 'Semua';
  const tbody = document.getElementById('table-santri-body');
  if (tbody) tbody.innerHTML = `<tr><td colspan="9" class="px-4 py-8 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin text-lg mb-2"></i><p>Memuat santri...</p></td></tr>`;

  callApi('getSantri', { kelas: kelas })
    .then(res => {
      AppState.santriList = res.data || [];
      populateSantriDropdowns();
      renderSantriTable(AppState.santriList);
    })
    .catch(err => {
      showToast('Gagal memuat santri: ' + err.toString(), 'error');
    });
}

function renderSantriTable(list) {
  const tbody = document.getElementById('table-santri-body');
  if (!tbody) return;

  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="9" class="px-4 py-8 text-center text-slate-400">Belum ada data santri pada kelas ini.</td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(s => `
    <tr class="hover:bg-slate-50 transition">
      <td class="px-4 py-3 font-mono font-bold text-slate-900">${s.nis}</td>
      <td class="px-4 py-3 text-slate-500 font-mono">${s.nisn || '-'}</td>
      <td class="px-4 py-3 font-semibold text-slate-800">${s.nama_santri}</td>
      <td class="px-3 py-3 text-center"><span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-purple-50 text-purple-700 border border-purple-200">${s.kelas}</span></td>
      <td class="px-3 py-3 text-center font-bold ${s.jenis_kelamin === 'L' ? 'text-blue-600' : 'text-pink-600'}">${s.jenis_kelamin}</td>
      <td class="px-4 py-3 text-slate-700">${s.nama_wali || '-'}</td>
      <td class="px-4 py-3 text-slate-500 font-mono text-[11px]">${s.kontak_wali || '-'}</td>
      <td class="px-3 py-3 text-center"><span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${s.status === 'Aktif' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-slate-100 text-slate-600'}">${s.status}</span></td>
      <td class="px-4 py-3 text-right space-x-1">
        <button onclick="previewRaporDirect('${s.nis}')" class="p-1.5 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-lg text-xs" title="Lihat & Cetak Rapor">
          <i class="fa-solid fa-file-invoice"></i>
        </button>
        <button onclick="editSantriModal('${s.nis}')" class="p-1.5 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-lg text-xs" title="Edit Santri">
          <i class="fa-solid fa-pen-to-square"></i>
        </button>
        <button onclick="deleteSantriAction('${s.nis}')" class="p-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg text-xs" title="Hapus">
          <i class="fa-solid fa-trash"></i>
        </button>
      </td>
    </tr>
  `).join('');
}

function filterTableSantriLocal() {
  const query = (document.getElementById('filter-santri-search')?.value || '').toLowerCase();
  const filtered = AppState.santriList.filter(s => 
    s.nama_santri.toLowerCase().includes(query) ||
    String(s.nis).toLowerCase().includes(query) ||
    String(s.nisn).toLowerCase().includes(query)
  );
  renderSantriTable(filtered);
}

function populateSantriDropdowns() {
  const optionsHtml = AppState.santriList.map(s => 
    `<option value="${s.nis}">${s.nama_santri} (${s.kelas} - ${s.nis})</option>`
  ).join('');

  const dropdowns = ['akademik-nis', 'kepemimpinan-nis', 'diniyah-nis', 'rapor-santri-select'];

function updateAkademikWidgets(list) {
  const total = list.length;
  let sum = 0;
  let countA = 0;
  let countPass = 0;
  list.forEach(i => {
    const val = Number(i.nilai_akhir) || 0;
    sum += val;
    if (i.predikat === 'A') countA++;
    if (val >= 75) countPass++;
  });
  const avg = total > 0 ? (sum / total).toFixed(1) : 0;
  const passRate = total > 0 ? Math.round((countPass / total) * 100) + '%' : '100%';

  if (document.getElementById('widget-ak-total')) document.getElementById('widget-ak-total').innerText = total;
  if (document.getElementById('widget-ak-avg')) document.getElementById('widget-ak-avg').innerText = avg;
  if (document.getElementById('widget-ak-count-a')) document.getElementById('widget-ak-count-a').innerText = countA;
  if (document.getElementById('widget-ak-pass-rate')) document.getElementById('widget-ak-pass-rate').innerText = passRate;
}

function recalcAkademikPreview() {
  const tugas = Number(document.getElementById('akademik-tugas')?.value) || 0;
  const uts = Number(document.getElementById('akademik-uts')?.value) || 0;
  const akhir = Math.round((tugas * 0.4) + (uts * 0.6));
  
  let predikat = 'D';
  if (akhir >= 90) predikat = 'A';
  else if (akhir >= 80) predikat = 'B';
  else if (akhir >= 70) predikat = 'C';

  const previewAkhir = document.getElementById('akademik-preview-akhir');
  if (previewAkhir) previewAkhir.innerText = akhir;
  const previewPredikat = document.getElementById('akademik-preview-predikat');
  if (previewPredikat) {
    previewPredikat.innerText = predikat;
    previewPredikat.className = `inline-block px-3 py-0.5 rounded-full font-bold text-xs badge-predikat-${predikat}`;
  }
}

function renderTableUsers(list) {

  tbody.innerHTML = list.map(u => `
    <tr class="hover:bg-slate-50 transition">
      <td class="px-4 py-3 font-mono text-[11px] text-slate-500">${u.id}</td>
      <td class="px-4 py-3 font-bold text-slate-900">${u.username}</td>
      <td class="px-4 py-3 text-slate-700">${u.nama_lengkap}</td>
      <td class="px-3 py-3">
        <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-700 border border-slate-200">${u.role}</span>
      </td>
      <td class="px-3 py-3 text-center">
        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${u.status === 'aktif' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700'}">${u.status}</span>
      </td>
      <td class="px-4 py-3 text-right space-x-1">
        <button onclick="editUserModal('${u.id}')" class="p-1.5 bg-blue-50 text-blue-700 hover:bg-blue-100 rounded-lg text-xs" title="Edit Pengguna">

        <button onclick="deleteUserAction('${u.id}')" class="p-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg text-xs" title="Hapus">

function editUserModal(id) {

function loadSantriReportForPrint(nis) {

function renderRaporSheet(report) {
  const s = report.santri || {};
  const set = report.settings || {};
  const ak = report.akademik || { items: [] };
  const kp = report.kepemimpinan || {};
  const dn = report.diniyah || {};

  // Header Identitas
  document.getElementById('print-santri-nama').innerText = s.nama_santri || '-';
  document.getElementById('print-santri-nis').innerText = s.nis || '-';
  document.getElementById('print-santri-nisn').innerText = s.nisn || '-';
  document.getElementById('print-santri-kelas').innerText = s.kelas || '-';
  document.getElementById('print-santri-jk').innerText = s.jenis_kelamin === 'L' ? 'Laki-laki (Ikhwan)' : 'Perempuan (Akhwat)';
  document.getElementById('print-tahun-ajaran').innerText = set.academic_year || '2025/2026';
  document.getElementById('print-semester').innerText = set.semester_active || 'Ganjil';

  // Section 1: Akademik
  const tbodyAk = document.getElementById('print-akademik-tbody');
  if (ak.items.length === 0) {
    tbodyAk.innerHTML = `<tr><td colspan="7" class="py-3 px-3 text-center text-slate-400 italic">Belum ada input nilai akademik untuk santri ini.</td></tr>`;
  } else {
    tbodyAk.innerHTML = ak.items.map((item, idx) => `
      <tr>
        <td class="py-2 px-2 text-center border-r border-slate-300 font-mono">${idx + 1}</td>
        <td class="py-2 px-3 border-r border-slate-300 font-bold text-slate-900">${item.mata_pelajaran}</td>
        <td class="py-2 px-2 text-center border-r border-slate-300 font-mono">${item.nilai_tugas}</td>
        <td class="py-2 px-2 text-center border-r border-slate-300 font-mono">${item.nilai_uts}</td>
        <td class="py-2 px-2 text-center border-r border-slate-300 font-bold font-mono text-slate-900">${item.nilai_akhir}</td>
        <td class="py-2 px-2 text-center border-r border-slate-300 font-black">${item.predikat}</td>
        <td class="py-2 px-3 text-slate-700 italic text-[11px] leading-tight">${item.catatan_guru || '-'}</td>
      </tr>
    `).join('');
  }
  document.getElementById('print-akademik-avg').innerText = ak.rataRata || '0';

  // Section 2: Kepemimpinan
  document.getElementById('print-kp-disiplin').innerText = kp.kedisiplinan || '-';
  document.getElementById('print-kp-organisasi').innerText = kp.organisasi || '-';
  document.getElementById('print-kp-karakter').innerText = kp.karakter_adab || '-';
  document.getElementById('print-kp-inisiatif').innerText = kp.inisiatif_kemandirian || '-';
  document.getElementById('print-kp-catatan').innerText = kp.catatan_pembina || 'Belum ada catatan kepemimpinan.';

  // Section 3: Diniyah
  document.getElementById('print-dn-ziyadah').innerText = dn.ziyadah_juz || '-';
  document.getElementById('print-dn-murojaah').innerText = dn.murojaah_juz || '-';
  document.getElementById('print-dn-tahfidz').innerText = dn.nilai_tahfidz || '0';
  document.getElementById('print-dn-adab').innerText = dn.adab_harian || '-';
  document.getElementById('print-dn-ibadah').innerText = dn.ibadah_harian || '-';
  document.getElementById('print-dn-bahasa-arab').innerText = dn.bahasa_arab || '0';
  document.getElementById('print-dn-catatan').innerText = dn.catatan_musyrif || 'Belum ada catatan diniyah.';

  // Signatures
  document.getElementById('print-report-place').innerText = set.report_place || 'Depok';
  document.getElementById('print-report-date').innerText = set.report_date || '28 September 2025';
  document.getElementById('print-signatory-school').innerText = set.school_name || 'SMP Al-Imam (AI IS)';
  document.getElementById('print-headmaster-name').innerText = set.headmaster_name || 'Ust. Ahmad Fauzi, M.Pd.';
  document.getElementById('print-headmaster-nip').innerText = set.headmaster_nip ? `NIP. ${set.headmaster_nip}` : '';

  const sigImg = document.getElementById('print-headmaster-sig-img');
  if (sigImg) {
    if (set.headmaster_signature_url) {
      sigImg.src = set.headmaster_signature_url;
      sigImg.classList.remove('hidden');
    } else {
      sigImg.classList.add('hidden');
    }
  }
}

// 17. INTERACTIVE ONBOARDING GUIDE TOUR
let currentGuideStep = 1;
const TOTAL_GUIDE_STEPS = 8;

function openInteractiveGuide(step = 1) {
  currentGuideStep = step;
  const modal = document.getElementById('modal-interactive-guide');
  if (modal) {
    modal.classList.remove('hidden');
    renderGuideStep(currentGuideStep);
  }
}

function closeInteractiveGuide(dismissForever = false) {
  const modal = document.getElementById('modal-interactive-guide');
  if (modal) modal.classList.add('hidden');
  if (dismissForever) {
    localStorage.setItem('rapor_guide_dismissed', 'true');
    showToast('Panduan ditutup. Anda dapat membukanya kembali kapan saja melalui tombol di navbar.', 'info');
  }
}

function changeGuideStep(delta) {
  const nextStep = currentGuideStep + delta;
  if (nextStep < 1) return;
  if (nextStep > TOTAL_GUIDE_STEPS) {
    closeInteractiveGuide(true);
    showToast('Alhamdulillah! Anda telah menyelesaikan panduan penggunaan sistem.', 'success');
    return;
  }
  currentGuideStep = nextStep;
  renderGuideStep(currentGuideStep);
}

function renderGuideStep(step) {
  // Update counter & progress bar
  const counter = document.getElementById('guide-step-counter');
  if (counter) counter.innerText = `Langkah ${step} dari ${TOTAL_GUIDE_STEPS}`;
  
  const progressFill = document.getElementById('guide-progress-fill');
  if (progressFill) progressFill.style.width = `${(step / TOTAL_GUIDE_STEPS) * 100}%`;

  // Toggle step cards
  document.querySelectorAll('.guide-step-card').forEach(card => {
    if (parseInt(card.getAttribute('data-step')) === step) {
      card.classList.remove('hidden');
    } else {
      card.classList.add('hidden');
    }
  });

  // Buttons
  const btnPrev = document.getElementById('btn-guide-prev');
  const btnNext = document.getElementById('btn-guide-next');
  if (btnPrev) {
    if (step === 1) btnPrev.classList.add('hidden');
    else btnPrev.classList.remove('hidden');
  }
  if (btnNext) {
    if (step === TOTAL_GUIDE_STEPS) {
      btnNext.innerHTML = '<span>Mulai Gunakan Aplikasi</span> <i class="fa-solid fa-check text-xs"></i>';
      btnNext.className = 'px-4 py-2 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl shadow-md transition flex items-center gap-1.5';
    } else {
      btnNext.innerHTML = '<span>Selanjutnya</span> <i class="fa-solid fa-arrow-right text-[10px]"></i>';
      btnNext.className = 'px-4 py-2 text-xs font-bold text-white bg-theme-primary hover:opacity-90 rounded-xl shadow-md transition flex items-center gap-1.5';
    }
  }
}

function switchViewAndHighlight(viewName) {
  switchView(viewName);
  closeInteractiveGuide(false);
  const titles = {
    'dashboard': 'Dashboard Beranda',
    'akademik': 'Nilai Akademik',
    'kepemimpinan': 'Nilai Kepemimpinan',
    'diniyah': 'Nilai Diniyah & Tahfidz',
    'santri': 'Data Santri & Kelas',

  };
  showToast(`💡 Anda berada di modul: ${titles[viewName] || viewName}. Klik 'Panduan Interaktif' di atas untuk membuka kembali tour.`);
}
