<!-- Dynamic Theme CSS Variables & Custom Styles -->
<style id="app-dynamic-theme">
  :root {
    --primary-color: #00a66c;
    --primary-hover: #008f5d;
    --primary-dark: #065f46;
    --primary-light: #e8f8f2;
    --primary-surface: #f0fdf4;
    --secondary-color: #0d9488;
    --secondary-hover: #0f766e;
    --accent-color: #10b981;
    --accent-hover: #059669;
    --bg-canvas: #eaf8f2;
    --card-border: #e2f3ea;
    --font-main: 'Plus Jakarta Sans', 'Inter', sans-serif;
  }
  
  body {
    font-family: var(--font-main);
    background: linear-gradient(135deg, #edf9f3 0%, #e4f6ee 50%, #daf2e6 100%);
    background-attachment: fixed;
    color: #1e293b;
    overflow-x: hidden;
    min-height: 100vh;
  }
  
  /* Custom scrollbar */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: #eaf8f2;
  }
  ::-webkit-scrollbar-thumb {
    background: #a7f3d0;
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #34d399;
  }
  
  /* Custom CSS Utility Classes using dynamic CSS variables */
  .bg-theme-primary { background-color: var(--primary-color) !important; }
  .text-theme-primary { color: var(--primary-color) !important; }
  .border-theme-primary { border-color: var(--primary-color) !important; }
  .bg-theme-primary-light { background-color: var(--primary-light) !important; }
  
  .bg-theme-secondary { background-color: var(--secondary-color) !important; }
  .text-theme-secondary { color: var(--secondary-color) !important; }
  .border-theme-secondary { border-color: var(--secondary-color) !important; }
  
  .bg-theme-accent { background-color: var(--accent-color) !important; }
  .text-theme-accent { color: var(--accent-color) !important; }

  .theme-card {
    background-color: #ffffff;
    border: 1px solid #e2f3ea;
    border-radius: 1.5rem;
    box-shadow: 0 4px 20px -2px rgba(0, 166, 108, 0.04), 0 2px 6px -1px rgba(0, 0, 0, 0.02);
  }
  
  .badge-predikat-A { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
  .badge-predikat-B { background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
  .badge-predikat-C { background-color: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
  .badge-predikat-D { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

  /* Smooth View Transitions */
  .view-panel {
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  /* Print Optimization for Report Card (Format A4) & Leger */
  @media print {
    @page {
      size: A4 portrait;
      margin: 8mm 10mm 8mm 10mm;
    }
    
    html, body {
      height: auto !important;
      min-height: 0 !important;
      overflow: visible !important;
      background: #ffffff !important;
      color: #000000 !important;
      font-size: 10pt;
    }

    /* Allow all parent wrappers to flow without clipping pages */
    .flex-1, main, div, body, html {
      overflow: visible !important;
      height: auto !important;
      max-height: none !important;
    }

    body > * {
      overflow: visible !important;
    }

    .view-panel {
      overflow: visible !important;
      transition: none !important;
    }

    /* Hide non-printable UI components */
    nav, aside, header, footer, #sidebar-nav, #sidebar-backdrop, #toast-container,
    .no-print, [class*="no-print"] {
      display: none !important;
    }

    .print-only {
      display: block !important;
    }

    main {
      padding: 0 !important;
      margin: 0 !important;
      width: 100% !important;
      max-width: 100% !important;
    }

    .max-w-7xl, .max-w-4xl {
      max-width: 100% !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    .print-container {
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      box-shadow: none !important;
      border: none !important;
      border-radius: 0 !important;
      background: #ffffff !important;
    }

    .identity-box {
      background: #f8fafc !important;
      border: 1px solid #cbd5e1 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* Page breaks */
    .page-break-inside-avoid {
      break-inside: avoid !important;
      page-break-inside: avoid !important;
    }
    
    .page-break-before {
      break-before: page !important;
      page-break-before: always !important;
    }

    table {
      border-collapse: collapse !important;
      width: 100% !important;
      page-break-inside: auto;
    }

    tr {
      break-inside: avoid !important;
      page-break-inside: avoid !important;
    }

    th, td {
      border: 1px solid #000000 !important;
      padding: 3px 5px !important;
    }

    th {
      background-color: #f1f5f9 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* Ensure borderless identity table stays clean without table borders */
    .identity-table,
    .identity-table tr,
    .identity-table td,
    .identity-table th,
    table.no-border,
    table.no-border tr,
    table.no-border td,
    table.no-border th,
    .border-none {
      border: none !important;
      background: transparent !important;
      padding: 1.5px 3px !important;
    }

    /* Leger landscape adjustments when printing leger */
    body.printing-leger-landscape {
      font-size: 7.5pt !important;
    }
    body.printing-leger-landscape table th,
    body.printing-leger-landscape table td {
      padding: 2px 4px !important;
      font-size: 7pt !important;
    }
  }
</style>
